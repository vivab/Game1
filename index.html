<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оффлайн Шутер Вид Сверху</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #menu {
            text-align: center;
            background: #222;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        #btn-ct { background: #0055ff; color: white; }
        #btn-t { background: #ff2222; color: white; }
        
        #game-container {
            display: none;
            position: relative;
        }
        canvas {
            background: #2b2b2b;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            display: block;
            border-radius: 6px;
        }
        #ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        .hud-btn {
            background: #444;
            color: white;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #666;
            cursor: pointer;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 10px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ff3333;
            border: 3px solid white;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .action-btn:active {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Тактический Шутер</h1>
        <p style="color: #aaa; margin-bottom: 20px;">Выберите сторону конфликта</p>
        <button id="btn-ct" onclick="startGame('CT')">Спецназ (Синие)</button>
        <button id="btn-t" onclick="startGame('T')">Террористы (Красные)</button>
    </div>

    <div id="game-container">
        <div id="ui">
            <div>Здоровье: <span id="hp" style="color: #ff4444;">100</span></div>
            <div>Патроны: <span id="ammo">7</span>/7</div>
            <button class="hud-btn" onclick="reloadWeapon()">Перезарядка</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="controls">
            <div class="dpad">
                <div class="control-btn" id="btn-up">▲</div>
                <div class="control-btn" id="btn-left">◀</div>
                <div class="control-btn" id="btn-down">▼</div>
                <div class="control-btn" id="btn-right">▶</div>
            </div>
            <div class="actions">
                <div class="action-btn" id="btn-shoot">ОГОНЬ</div>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameStarted = false;
let playerTeam = '';

const keys = { w: false, a: false, s: false, d: false };

window.addEventListener('keydown', e => {
    if (e.key === 'w' || e.key === 'ц') keys.w = true;
    if (e.key === 'a' || e.key === 'ф') keys.a = true;
    if (e.key === 's' || e.key === 'ы') keys.s = true;
    if (e.key === 'd' || e.key === 'в') keys.d = true;
    if (e.key === 'r' || e.key === 'к') reloadWeapon();
});

window.addEventListener('keyup', e => {
    if (e.key === 'w' || e.key === 'ц') keys.w = false;
    if (e.key === 'a' || e.key === 'ф') keys.a = false;
    if (e.key === 's' || e.key === 'ы') keys.s = false;
    if (e.key === 'd' || e.key === 'в') keys.d = false;
});

function bindTouchButton(id, keyName) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => { keys[keyName] = true; });
    el.addEventListener('mouseup', () => { keys[keyName] = false; });
}

bindTouchButton('btn-up', 'w');
bindTouchButton('btn-left', 'a');
bindTouchButton('btn-down', 's');
bindTouchButton('btn-right', 'd');

document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
document.getElementById('btn-shoot').addEventListener('mousedown', () => { shoot(); });

let mouseX = 400, mouseY = 250;
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

const MAP_WIDTH = 1600;
const MAP_HEIGHT = 1200;

// Стены с красивыми параметрами
const walls = [
    { x: 300, y: 200, w: 500, h: 40 },
    { x: 200, y: 600, w: 40, h: 400 },
    { x: 900, y: 400, w: 40, h: 500 },
    { x: 600, y: 950, w: 600, h: 40 },
    { x: 1100, y: 200, w: 300, h: 40 }
];

let player = {
    x: 400, y: 400, radius: 15, speed: 3.5, hp: 100, maxHp: 100,
    ammo: 7, maxAmmo: 7, isReloading: false, isDead: false, angle: 0
};

let bots = [];
let bullets = [];

function startGame(team) {
    playerTeam = team;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    
    bots = [
        { x: 1300, y: 300, radius: 15, speed: 1.5, hp: 100, team: team === 'CT' ? 'T' : 'CT', angle: 0, shootTimer: 0 },
        { x: 1200, y: 1000, radius: 15, speed: 1.5, hp: 100, team: team === 'CT' ? 'T' : 'CT', angle: 0, shootTimer: 0 },
        { x: 500, y: 800, radius: 15, speed: 1.5, hp: 100, team: team, angle: 0, shootTimer: 0 }
    ];

    gameStarted = true;
    loop();
}

function shoot() {
    if (player.isDead || player.isReloading || player.ammo <= 0) return;
    player.ammo--;
    document.getElementById('ammo').innerText = player.ammo;

    bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        dx: Math.cos(player.angle) * 12,
        dy: Math.sin(player.angle) * 12,
        damage: 50,
        team: playerTeam
    });
}

function reloadWeapon() {
    if (player.isReloading || player.ammo === player.maxAmmo || player.isDead) return;
    player.isReloading = true;
    setTimeout(() => {
        player.ammo = player.maxAmmo;
        document.getElementById('ammo').innerText = player.ammo;
        player.isReloading = false;
    }, 1500);
}

function checkWallCollision(x, y, r) {
    for (let w of walls) {
        if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) {
            return true;
        }
    }
    return x < r || x > MAP_WIDTH - r || y < r || y > MAP_HEIGHT - r;
}

function drawCharacter(x, y, angle, team, isDead) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    if (isDead) {
        ctx.fillStyle = "#555";
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
    }

    // Ноги
    ctx.fillStyle = "#111";
    ctx.fillRect(-8, -12, 5, 8);
    ctx.fillRect(3, -12, 5, 8);

    // Тело с тенью/обводкой
    ctx.fillStyle = team === 'CT' ? '#0066ff' : '#ff3333';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    // Голова
    ctx.fillStyle = "#ffccaa";
    ctx.beginPath();
    ctx.arc(4, 0, 7, 0, Math.PI * 2);
    ctx.fill();

    // Оружие (Дигл)
    ctx.fillStyle = "#222";
    ctx.fillRect(10, 4, 10, 4);

    ctx.restore();
}

function update() {
    if (!gameStarted) return;

    if (!player.isDead) {
        let moveX = 0, moveY = 0;
        if (keys.w) moveY -= player.speed;
        if (keys.s) moveY += player.speed;
        if (keys.a) moveX -= player.speed;
        if (keys.d) moveX += player.speed;

        if (!checkWallCollision(player.x + moveX, player.y, player.radius)) player.x += moveX;
        if (!checkWallCollision(player.x, player.y + moveY, player.radius)) player.y += moveY;

        let targetBot = bots.find(b => b.hp > 0 && b.team !== playerTeam);
        if (moveX !== 0 || moveY !== 0) {
            player.angle = Math.atan2(moveY, moveX);
        } else if (targetBot) {
            player.angle = Math.atan2(targetBot.y - player.y, targetBot.x - player.x);
        } else {
            let worldMouseX = mouseX + (player.x - canvas.width / 2);
            let worldMouseY = mouseY + (player.y - canvas.height / 2);
            player.angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
        }
    }

    bots.forEach(bot => {
        if (bot.hp <= 0) return;
        let target = (bot.team !== playerTeam && !player.isDead) ? player : null;
        
        if (target) {
            let angleToTarget = Math.atan2(target.y - bot.y, target.x - bot.x);
            bot.angle = angleToTarget;

            let dist = Math.hypot(target.x - bot.x, target.y - bot.y);
            if (dist > 140) {
                let bx = Math.cos(angleToTarget) * bot.speed;
                let by = Math.sin(angleToTarget) * bot.speed;
                if (!checkWallCollision(bot.x + bx, bot.y, bot.radius)) bot.x += bx;
                if (!checkWallCollision(bot.x, bot.y + by, bot.radius)) bot.y += by;
            }

            bot.shootTimer++;
            if (bot.shootTimer > 100) {
                bullets.push({
                    x: bot.x + Math.cos(bot.angle) * 20,
                    y: bot.y + Math.sin(bot.angle) * 20,
                    dx: Math.cos(bot.angle) * 8,
                    dy: Math.sin(bot.angle) * 8,
                    damage: 50,
                    team: bot.team
                });
                bot.shootTimer = 0;
            }
        }
    });

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;

        if (checkWallCollision(b.x, b.y, 3)) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.team !== playerTeam && !player.isDead) {
            if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius) {
                player.hp -= b.damage;
                document.getElementById('hp').innerText = Math.max(0, player.hp);
                if (player.hp <= 0) player.isDead = true;
                bullets.splice(i, 1);
                continue;
            }
        }

        let hitBot = false;
        for (let bot of bots) {
            if (b.team !== bot.team && bot.hp > 0) {
                if (Math.hypot(bot.x - b.x, bot.y - b.y) < bot.radius) {
                    bot.hp -= b.damage;
                    hitBot = true;
                    break;
                }
            }
        }
        if (hitBot) bullets.splice(i, 1);
    }
}

function draw() {
    // Очищаем фон холста
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    let cameraX = canvas.width / 2 - player.x;
    let cameraY = canvas.height / 2 - player.y;
    ctx.translate(cameraX, cameraY);

    // --- ОТРИСОВКА КРАСИВОГО ФОНА И СЕТКИ ---
    ctx.fillStyle = "#333740"; // Приятный серо-синий цвет бетонного пола
    ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

    // Рисуем сетку пола для тактического стиля
    ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
    ctx.lineWidth = 1;
    let gridSize = 60;
    for (let x = 0; x <= MAP_WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y <= MAP_HEIGHT; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_WIDTH, y);
        ctx.stroke();
    }

    // Границы карты (красивый бортик)
    ctx.strokeStyle = "#555b6e";
    ctx.lineWidth = 6;
    ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

    // --- СТЕНЫ С ТЕНЬЮ И ОБЪЕМОМ ---
    walls.forEach(w => {
        // Тень стены
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(w.x + 6, w.y + 6, w.w, w.h);
        
        // Сама стена
        ctx.fillStyle = "#5c6370";
        ctx.fillRect(w.x, w.y, w.w, w.h);

        // Внутренняя текстура стены
        ctx.strokeStyle = "#474e5d";
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Рисуем ботов
    bots.forEach(bot => drawCharacter(bot.x, bot.y, bot.angle, bot.team, bot.hp <= 0));

    // Рисуем игрока
    drawCharacter(player.x, player.y, player.angle, playerTeam, player.isDead);

    // Рисуем пули (светящиеся точки)
    ctx.fillStyle = "#ffee55";
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();

    if (player.isDead) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4444";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ВЫ УБИТЫ (Режим призрака)", canvas.width / 2, canvas.height / 2);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
</script>

</body>
</html>
