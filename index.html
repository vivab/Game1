<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile FPS 1.0 - Desert Eagle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- UI OVERLAYS & HUD --- */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before {
      top: 11px; left: 0; width: 24px; height: 2px;
    }
    #crosshair::after {
      top: 0; left: 11px; width: 2px; height: 24px;
    }

    /* Health HUD */
    .hud-box {
      position: absolute;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
    }

    #hp-hud {
      top: 16px;
      left: 16px;
      border: 2px solid #2196F3;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #hp-label { font-size: 12px; color: #aaa; }
    #hp-value { font-size: 24px; color: #4CAF50; }

    /* Ammo HUD */
    #ammo-hud {
      top: 16px;
      right: 16px;
      border: 2px solid #f44336;
      text-align: right;
    }
    #ammo-label { font-size: 12px; color: #aaa; }
    #ammo-value { font-size: 24px; color: #FFD700; }

    /* Round & Stats HUD */
    #center-hud {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 14px;
      text-align: center;
    }

    /* FPS Counter */
    #fps-counter {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: #00FF00;
      font-size: 12px;
      font-family: monospace;
    }

    /* Damage Flash */
    #damage-flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      z-index: 11;
    }

    /* Mobile Controls Touch Overlay */
    #touch-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20;
      pointer-events: auto;
    }

    #joystick-base {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: none;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #joystick-stick {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Control Buttons */
    .btn-touch {
      position: absolute;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      pointer-events: auto;
      touch-action: manipulation;
    }
    .btn-touch:active {
      transform: scale(0.92);
    }

    #btn-fire {
      bottom: 30px;
      right: 30px;
      width: 85px;
      height: 85px;
      background: rgba(244, 67, 54, 0.8);
      border: 3px solid #ff7961;
      font-size: 32px;
    }

    #btn-reload {
      bottom: 130px;
      right: 40px;
      width: 65px;
      height: 65px;
      background: rgba(76, 175, 80, 0.8);
      border: 3px solid #80e27e;
      font-size: 26px;
    }

    /* Modals & Screens */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
    }

    .modal-title {
      font-size: 36px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .team-buttons {
      display: flex;
      gap: 20px;
    }

    .team-btn {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .team-btn-ct {
      background: #2196F3; color: white;
      box-shadow: 0 0 15px rgba(33, 150, 243, 0.5);
    }
    .team-btn-t {
      background: #f44336; color: white;
      box-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
    }
    .team-btn:hover { transform: scale(1.05); }

    /* Round Overlay Message */
    #round-status-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 90;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #fff;
    }
    #round-status-title { font-size: 42px; font-weight: 900; margin-bottom: 10px; }
    #round-status-sub { font-size: 18px; color: #ccc; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- HUD Layer -->
  <div id="hud">
    <div id="crosshair"></div>

    <div id="hp-hud" class="hud-box">
      <span id="hp-label">HP</span>
      <span id="hp-value">100</span>
    </div>

    <div id="center-hud" class="hud-box">
      <span>РАУНД <span id="round-num">1</span></span>
    </div>

    <div id="fps-counter">60 FPS</div>

    <div id="ammo-hud" class="hud-box">
      <span id="ammo-label">DEAGLE</span>
      <span id="ammo-value">7/7</span>
    </div>
  </div>

  <div id="damage-flash"></div>

  <!-- Touch Controls -->
  <div id="touch-layer" style="display:none;">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
    <div id="btn-fire" class="btn-touch">🔫</div>
    <div id="btn-reload" class="btn-touch">↻</div>
  </div>

  <!-- Team Selection Modal -->
  <div id="team-modal" class="modal-overlay">
    <h1 class="modal-title">MOBILE FPS 1.0</h1>
    <p style="margin-bottom: 30px; color: #aaa;">Выберите вашу команду для начала боя</p>
    <div class="team-buttons">
      <button class="team-btn team-btn-ct" onclick="selectTeam('CT')">🛡️ СБОРНАЯ CT</button>
      <button class="team-btn team-btn-t" onclick="selectTeam('T')">🔴 КОМАНДА T</button>
    </div>
  </div>

  <!-- Round End / Death Screen -->
  <div id="round-status-overlay">
    <div id="round-status-title">ВЫ УБИТЫ</div>
    <div id="round-status-sub">Ждите следующего раунда...</div>
  </div>

  <script>
    /* =========================================================================
       AUDIO SYNTHESIZER (Web Audio API)
       Генерация звуков выстрелов, перезарядки и попаданий без внешних файлов
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playShoot() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        // Звук резкого щелчка/взрыва
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.15);

        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playReload() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    }

    const sounds = new SoundEngine();

    /* =========================================================================
       ИГРОВЫЕ ПАРАМЕТРЫ И КОНСТАНТЫ
       ========================================================================= */
    const CONFIG = {
      playerSpeed: 7.0,
      botSpeed: 4.5,
      deagleDamage: 50,
      maxAmmo: 7,
      reloadTime: 1000, // мс
      fireRate: 250,    // мс между выстрелами
      mapSize: 100,
      botCount: 3
    };

    // Состояние игры
    let gameState = {
      started: false,
      playerTeam: 'CT',
      botTeam: 'T',
      round: 1,
      playerHp: 100,
      ammo: 7,
      isReloading: false,
      lastShootTime: 0,
      roundOver: false
    };

    /* =========================================================================
       THREE.JS И СЦЕНА
       ========================================================================= */
    let scene, camera, renderer;
    let mapWalls = [];
    let bots = [];
    let weaponGroup, muzzleFlashMesh, muzzleLight;

    // Векторы движения
    const moveVector = new THREE.Vector3();
    const cameraRotation = { yaw: 0, pitch: 0 };

    /* =========================================================================
       ПОДГОТОВКА СЦЕНЫ И КАРТЫ
       ========================================================================= */
    function initEngine() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);
      scene.fog = new THREE.FogExp2(0x1a1a24, 0.015);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.rotation.order = 'YXZ';

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ea, 0.8);
      dirLight.position.set(30, 50, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 150;
      const d = 60;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      buildMap();
      createWeaponModel();

      window.addEventListener('resize', onWindowResize);
    }

    /* Генерация карты 100x100 с периметром и укрытиями */
    function buildMap() {
      // Пол
      const floorGeo = new THREE.PlaneGeometry(CONFIG.mapSize, CONFIG.mapSize);
      // Простая процедурная текстура плиток
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#44444c'; ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = '#33333a'; ctx.lineWidth = 4;
      for(let i=0; i<=256; i+=32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }
      const floorTex = new THREE.CanvasTexture(canvas);
      floorTex.wrapS = THREE.RepeatWrapping;
      floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(20, 20);

      const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Материал стен
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });

      function addWall(x, z, w, d, h = 6) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, wallMat);
        mesh.position.set(x, h / 2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        // Для коллизий
        const box = new THREE.Box3().setFromObject(mesh);
        mapWalls.push(box);
      }

      const S = CONFIG.mapSize / 2;
      // Внешние стены по периметру
      addWall(0, -S, CONFIG.mapSize, 2);
      addWall(0, S, CONFIG.mapSize, 2);
      addWall(-S, 0, 2, CONFIG.mapSize);
      addWall(S, 0, 2, CONFIG.mapSize);

      // Внутренние препятствия / Укрытия
      addWall(-15, -15, 12, 2);
      addWall(-15, 15, 12, 2);
      addWall(15, -15, 2, 12);
      addWall(15, 15, 2, 12);

      // Центральные укрытия
      addWall(0, 0, 8, 8, 4);
      addWall(-25, 0, 4, 16, 5);
      addWall(25, 0, 4, 16, 5);
      addWall(0, -30, 16, 4, 5);
      addWall(0, 30, 16, 4, 5);
    }

    /* =========================================================================
       3D МОДЕЛЬ ПИСТОЛЕТА DEAGLE
       ========================================================================= */
    function createWeaponModel() {
      weaponGroup = new THREE.Group();

      const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222225, metalness: 0.8, roughness: 0.3 });
      const chromeMetal = new THREE.MeshStandardMaterial({ color: 0x55555d, metalness: 0.9, roughness: 0.2 });
      const gripMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

      // Затвор (Slide)
      const slideGeo = new THREE.BoxGeometry(0.12, 0.14, 0.6);
      const slide = new THREE.Mesh(slideGeo, chromeMetal);
      slide.position.set(0, 0.06, -0.1);
      weaponGroup.add(slide);

      // Рукоятка (Grip)
      const gripGeo = new THREE.BoxGeometry(0.1, 0.4, 0.18);
      const grip = new THREE.Mesh(gripGeo, gripMat);
      grip.position.set(0, -0.15, 0.08);
      grip.rotation.x = 0.25;
      weaponGroup.add(grip);

      // Ствол (Barrel)
      const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 12);
      const barrel = new THREE.Mesh(barrelGeo, darkMetal);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.05, -0.15);
      weaponGroup.add(barrel);

      // Спусковая скоба
      const guardGeo = new THREE.BoxGeometry(0.04, 0.12, 0.15);
      const guard = new THREE.Mesh(guardGeo, darkMetal);
      guard.position.set(0, -0.08, -0.02);
      weaponGroup.add(guard);

      // Вспышка выстрела (Muzzle Flash)
      const flashGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
      muzzleFlashMesh = new THREE.Mesh(flashGeo, flashMat);
      muzzleFlashMesh.position.set(0, 0.06, -0.45);
      weaponGroup.add(muzzleFlashMesh);

      muzzleLight = new THREE.PointLight(0xffaa00, 0, 5);
      muzzleLight.position.set(0, 0.06, -0.45);
      weaponGroup.add(muzzleLight);

      // Позиционируем оружие перед камерой
      weaponGroup.position.set(0.22, -0.22, -0.45);
      camera.add(weaponGroup);
      scene.add(camera);
    }

    /* =========================================================================
       БОТЫ (AI ENEMIES)
       ========================================================================= */
    class Bot {
      constructor(x, z, team) {
        this.team = team;
        this.hp = 100;
        this.dead = false;
        this.lastShootTime = 0;
        this.targetDirection = new THREE.Vector3();
        this.changeDirTimer = 0;

        // Группа модели бота
        this.mesh = new THREE.Group();
        this.mesh.position.set(x, 0, z);

        const color = team === 'CT' ? 0x2196F3 : 0xf44336;
        const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });

        // Туловище
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.4, 0.4);
        const body = new THREE.Mesh(bodyGeo, mat);
        body.position.y = 1.2;
        body.castShadow = true;
        this.mesh.add(body);

        // Голова
        const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
        const head = new THREE.Mesh(headGeo, mat);
        head.position.y = 2.1;
        head.castShadow = true;
        this.mesh.add(head);

        // Руки
        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
        const armL = new THREE.Mesh(armGeo, mat);
        armL.position.set(-0.55, 1.2, 0);
        const armR = new THREE.Mesh(armGeo, mat);
        armR.position.set(0.55, 1.2, 0);
        this.mesh.add(armL);
        this.mesh.add(armR);

        // Оружие в руке
        const gunGeo = new THREE.BoxGeometry(0.1, 0.12, 0.4);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.55, 0.9, -0.25);
        this.mesh.add(gun);

        // UI Полоски здоровья над головой (Sprite Canvas)
        this.hpCanvas = document.createElement('canvas');
        this.hpCanvas.width = 128;
        this.hpCanvas.height = 32;
        this.hpCtx = this.hpCanvas.getContext('2d');
        
        this.hpTexture = new THREE.CanvasTexture(this.hpCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: this.hpTexture });
        this.hpSprite = new THREE.Sprite(spriteMat);
        this.hpSprite.position.set(0, 2.7, 0);
        this.hpSprite.scale.set(1.5, 0.375, 1);
        this.mesh.add(this.hpSprite);

        this.updateHpBar();
        scene.add(this.mesh);
      }

      updateHpBar() {
        const ctx = this.hpCtx;
        ctx.clearRect(0, 0, 128, 32);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 8, 128, 16);
        ctx.fillStyle = this.team === 'CT' ? '#2196F3' : '#f44336';
        ctx.fillRect(2, 10, Math.max(0, (124 * this.hp) / 100), 12);
        this.hpTexture.needsUpdate = true;
      }

      takeDamage(amount) {
        if (this.dead) return;
        this.hp -= amount;
        sounds.playHit();
        if (this.hp <= 0) {
          this.hp = 0;
          this.dead = true;
          this.mesh.visible = false;
        }
        this.updateHpBar();
      }

      update(delta) {
        if (this.dead || !gameState.started || gameState.roundOver) return;

        const distToPlayer = this.mesh.position.distanceTo(camera.position);

        // ИИ: Преследование и стрельба
        if (distToPlayer < 45) {
          // Смотрим на игрока
          this.mesh.lookAt(camera.position.x, 0, camera.position.z);

          // Движение к игроку
          if (distToPlayer > 8) {
            const dir = new THREE.Vector3().subVectors(camera.position, this.mesh.position);
            dir.y = 0;
            dir.normalize();
            this.moveWithCollision(dir.multiplyScalar(CONFIG.botSpeed * delta));
          }

          // Выстрел по игроку
          const now = performance.now();
          if (now - this.lastShootTime > 800 + Math.random() * 400) {
            this.lastShootTime = now;
            // Точность бота
            if (Math.random() < 0.65) {
              damagePlayer(CONFIG.deagleDamage);
            }
          }
        } else {
          // Патрулирование
          this.changeDirTimer -= delta;
          if (this.changeDirTimer <= 0) {
            this.changeDirTimer = 2 + Math.random() * 2;
            this.targetDirection.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize();
          }
          this.mesh.rotation.y = Math.atan2(this.targetDirection.x, this.targetDirection.z);
          this.moveWithCollision(this.targetDirection.clone().multiplyScalar(CONFIG.botSpeed * 0.5 * delta));
        }
      }

      moveWithCollision(moveDelta) {
        const oldPos = this.mesh.position.clone();
        this.mesh.position.add(moveDelta);

        // Простая проверка коллизии со стенами
        const botBox = new THREE.Box3().setFromCenterAndSize(
          this.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)),
          new THREE.Vector3(1, 2, 1)
        );

        for (let wall of mapWalls) {
          if (botBox.intersectsBox(wall)) {
            this.mesh.position.copy(oldPos);
            break;
          }
        }
      }

      destroy() {
        scene.remove(this.mesh);
      }
    }

    /* Спаун ботов для раунда */
    function spawnBots() {
      bots.forEach(b => b.destroy());
      bots = [];

      // Спаун на противоположной стороне
      const spawnZ = gameState.playerTeam === 'CT' ? 35 : -35;
      const positions = [
        { x: -15, z: spawnZ },
        { x: 0, z: spawnZ },
        { x: 15, z: spawnZ }
      ];

      positions.forEach(pos => {
        bots.push(new Bot(pos.x, pos.z, gameState.botTeam));
      });
    }

    /* =========================================================================
       УПРАВЛЕНИЕ (TOUCH & DESKTOP)
       ========================================================================= */
    const touchState = {
      joystickActive: false,
      joystickId: null,
      joystickCenter: { x: 0, y: 0 },
      joystickInput: { x: 0, y: 0 },
      lookId: null,
      lastLookTouch: { x: 0, y: 0 }
    };

    const keysPressed = {};

    function setupControls() {
      const touchLayer = document.getElementById('touch-layer');
      const joystickBase = document.getElementById('joystick-base');
      const joystickStick = document.getElementById('joystick-stick');

      // Сенсорные события
      touchLayer.addEventListener('touchstart', (e) => {
        sounds.init();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];

          // Левая половина - Джойстик
          if (touch.clientX < window.innerWidth / 2 && !touchState.joystickActive) {
            touchState.joystickActive = true;
            touchState.joystickId = touch.identifier;
            touchState.joystickCenter = { x: touch.clientX, y: touch.clientY };
            touchState.joystickInput = { x: 0, y: 0 };

            joystickBase.style.display = 'block';
            joystickBase.style.left = touch.clientX + 'px';
            joystickBase.style.top = touch.clientY + 'px';
            joystickStick.style.transform = `translate(-50%, -50%)`;
          }
          // Правая половина - Взгляд / Свайп
          else if (touch.clientX >= window.innerWidth / 2 && touchState.lookId === null) {
            // Исключаем попадание по кнопкам
            const btnFire = document.getElementById('btn-fire').getBoundingClientRect();
            const btnReload = document.getElementById('btn-reload').getBoundingClientRect();

            if (!isInside(touch, btnFire) && !isInside(touch, btnReload)) {
              touchState.lookId = touch.identifier;
              touchState.lastLookTouch = { x: touch.clientX, y: touch.clientY };
            }
          }
        }
      }, { passive: false });

      touchLayer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];

          if (touch.identifier === touchState.joystickId) {
            const dx = touch.clientX - touchState.joystickCenter.x;
            const dy = touch.clientY - touchState.joystickCenter.y;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 50;

            const angle = Math.atan2(dy, dx);
            const clampedDist = Math.min(dist, maxRadius);

            const inputX = (Math.cos(angle) * clampedDist) / maxRadius;
            const inputY = (Math.sin(angle) * clampedDist) / maxRadius;

            touchState.joystickInput = { x: inputX, y: inputY };
            joystickStick.style.transform = `translate(calc(-50% + ${inputX * maxRadius}px), calc(-50% + ${inputY * maxRadius}px))`;
          }
          else if (touch.identifier === touchState.lookId) {
            const dx = touch.clientX - touchState.lastLookTouch.x;
            const dy = touch.clientY - touchState.lastLookTouch.y;

            cameraRotation.yaw -= dx * 0.005;
            cameraRotation.pitch -= dy * 0.005;
            // Ограничение наклона вверх/вниз (~60 градусов)
            cameraRotation.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.pitch));

            touchState.lastLookTouch = { x: touch.clientX, y: touch.clientY };
          }
        }
      }, { passive: false });

      const endTouch = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === touchState.joystickId) {
            touchState.joystickActive = false;
            touchState.joystickId = null;
            touchState.joystickInput = { x: 0, y: 0 };
            joystickBase.style.display = 'none';
          }
          else if (touch.identifier === touchState.lookId) {
            touchState.lookId = null;
          }
        }
      };

      touchLayer.addEventListener('touchend', endTouch);
      touchLayer.addEventListener('touchcancel', endTouch);

      // Кнопки огня и перезарядки
      document.getElementById('btn-fire').addEventListener('click', shoot);
      document.getElementById('btn-reload').addEventListener('click', reload);

      // Клавиатура и Мышь для ПК (для удобства тестов)
      window.addEventListener('keydown', (e) => {
        sounds.init();
        keysPressed[e.code] = true;
        if (e.code === 'KeyR') reload();
      });
      window.addEventListener('keyup', (e) => keysPressed[e.code] = false);

      renderer.domElement.addEventListener('click', () => {
        sounds.init();
        if (window.innerWidth > 1024) {
          renderer.domElement.requestPointerLock();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
          cameraRotation.yaw -= e.movementX * 0.002;
          cameraRotation.pitch -= e.movementY * 0.002;
          cameraRotation.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.pitch));
        }
      });

      window.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement === renderer.domElement && e.button === 0) {
          shoot();
        }
      });
    }

    function isInside(touch, rect) {
      return touch.clientX >= rect.left && touch.clientX <= rect.right &&
             touch.clientY >= rect.top && touch.clientY <= rect.bottom;
    }

    /* =========================================================================
       МЕХАНИКА СТРЕЛЬБЫ И ПЕРЕЗАРЯДКИ
       ========================================================================= */
    function shoot() {
      if (!gameState.started || gameState.roundOver || gameState.isReloading) return;

      const now = performance.now();
      if (now - gameState.lastShootTime < CONFIG.fireRate) return;

      if (gameState.ammo <= 0) {
        reload();
        return;
      }

      gameState.ammo--;
      gameState.lastShootTime = now;
      updateHudUI();

      sounds.playShoot();

      // Анимация отдачи оружия
      weaponGroup.position.z = -0.35; // Движение назад
      cameraRotation.pitch += 0.02;   // Подъем ствола

      // Вспышка
      muzzleFlashMesh.material.opacity = 1.0;
      muzzleLight.intensity = 2.0;
      setTimeout(() => {
        muzzleFlashMesh.material.opacity = 0;
        muzzleLight.intensity = 0;
      }, 50);

      // Raycasting для попадания в врагов
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const livingBots = bots.filter(b => !b.dead);
      const intersects = raycaster.intersectObjects(livingBots.map(b => b.mesh), true);

      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        // Находим владельца бота
        const hitBot = livingBots.find(b => {
          let parent = hitObject;
          while (parent) {
            if (parent === b.mesh) return true;
            parent = parent.parent;
          }
          return false;
        });

        if (hitBot) {
          hitBot.takeDamage(CONFIG.deagleDamage);
          checkRoundState();
        }
      }
    }

    function reload() {
      if (gameState.isReloading || gameState.ammo === CONFIG.maxAmmo || gameState.roundOver) return;

      gameState.isReloading = true;
      sounds.playReload();

      const ammoVal = document.getElementById('ammo-value');
      ammoVal.innerText = 'РЕЛОАД';
      ammoVal.style.color = '#ff9800';

      setTimeout(() => {
        gameState.ammo = CONFIG.maxAmmo;
        gameState.isReloading = false;
        updateHudUI();
      }, CONFIG.reloadTime);
    }

    /* Нанесение урона игроку */
    function damagePlayer(amount) {
      if (gameState.roundOver) return;

      gameState.playerHp -= amount;
      sounds.playHit();

      // Красная вспышка урона на экране
      const flash = document.getElementById('damage-flash');
      flash.style.opacity = '1';
      setTimeout(() => flash.style.opacity = '0', 100);

      if (gameState.playerHp <= 0) {
        gameState.playerHp = 0;
        endRound(false);
      }
      updateHudUI();
    }

    /* =========================================================================
       УПРАВЛЕНИЕ РАУНДАМИ И ИГРОВЫМ ЦИКЛОМ
       ========================================================================= */
    function selectTeam(team) {
      sounds.init();
      gameState.playerTeam = team;
      gameState.botTeam = team === 'CT' ? 'T' : 'CT';

      document.getElementById('team-modal').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('touch-layer').style.display = 'block';

      gameState.started = true;
      startNewRound();
    }

    function startNewRound() {
      gameState.roundOver = false;
      gameState.playerHp = 100;
      gameState.ammo = CONFIG.maxAmmo;
      gameState.isReloading = false;

      document.getElementById('round-status-overlay').style.display = 'none';

      // Спаун игрока
      const spawnZ = gameState.playerTeam === 'CT' ? -35 : 35;
      camera.position.set(0, 1.6, spawnZ);
      cameraRotation.yaw = gameState.playerTeam === 'CT' ? 0 : Math.PI;
      cameraRotation.pitch = 0;

      spawnBots();
      updateHudUI();
    }

    function checkRoundState() {
      const allBotsDead = bots.every(b => b.dead);
      if (allBotsDead) {
        endRound(true);
      }
    }

    function endRound(victory) {
      gameState.roundOver = true;
      const overlay = document.getElementById('round-status-overlay');
      const title = document.getElementById('round-status-title');
      const sub = document.getElementById('round-status-sub');

      overlay.style.display = 'flex';

      if (victory) {
        title.innerText = 'РАУНД ВЫИГРАН';
        title.style.color = '#4CAF50';
        sub.innerText = 'Переход на следующий раунд...';
        gameState.round++;
      } else {
        title.innerText = '💀 ВЫ УБИТЫ';
        title.style.color = '#f44336';
        sub.innerText = 'Перезапуск раунда...';
      }

      setTimeout(() => {
        startNewRound();
      }, 2000);
    }

    function updateHudUI() {
      // HP
      const hpVal = document.getElementById('hp-value');
      hpVal.innerText = gameState.playerHp;
      if (gameState.playerHp > 75) hpVal.style.color = '#4CAF50';
      else if (gameState.playerHp > 25) hpVal.style.color = '#FFEB3B';
      else hpVal.style.color = '#f44336';

      // Патроны
      const ammoVal = document.getElementById('ammo-value');
      if (!gameState.isReloading) {
        ammoVal.innerText = `${gameState.ammo}/${CONFIG.maxAmmo}`;
        ammoVal.style.color = gameState.ammo === 0 ? '#f44336' : '#FFD700';
      }

      // Раунд
      document.getElementById('round-num').innerText = gameState.round;
    }

    /* =========================================================================
       ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ (GAME LOOP)
       ========================================================================= */
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fpsLastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      // Расчет FPS
      frameCount++;
      if (now - fpsLastTime >= 1000) {
        document.getElementById('fps-counter').innerText = `${frameCount} FPS`;
        frameCount = 0;
        fpsLastTime = now;
      }

      if (gameState.started && !gameState.roundOver) {
        updatePlayerMovement(delta);
        bots.forEach(b => b.update(delta));
      }

      // Плавный возврат оружия после отдачи
      if (weaponGroup) {
        weaponGroup.position.z += (-0.45 - weaponGroup.position.z) * 0.1;
      }

      renderer.render(scene, camera);
    }

    /* Движение игрока с учетом коллизий */
    function updatePlayerMovement(delta) {
      // Поворот камеры
      camera.rotation.x = cameraRotation.pitch;
      camera.rotation.y = cameraRotation.yaw;

      moveVector.set(0, 0, 0);

      // Джойстик
      if (touchState.joystickActive) {
        moveVector.x = touchState.joystickInput.x;
        moveVector.z = touchState.joystickInput.y;
      }

      // Клавиатура (WASD)
      if (keysPressed['KeyW']) moveVector.z = -1;
      if (keysPressed['KeyS']) moveVector.z = 1;
      if (keysPressed['KeyA']) moveVector.x = -1;
      if (keysPressed['KeyD']) moveVector.x = 1;

      if (moveVector.lengthSq() > 0) {
        moveVector.normalize();

        // Поворот направления относительно взгляда
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);

        const moveDelta = new THREE.Vector3()
          .addScaledVector(right, moveVector.x)
          .addScaledVector(forward, -moveVector.z)
          .multiplyScalar(CONFIG.playerSpeed * delta);

        // Проверка коллизий игрока
        const oldPos = camera.position.clone();
        camera.position.add(moveDelta);

        const playerBox = new THREE.Box3().setFromCenterAndSize(
          camera.position,
          new THREE.Vector3(0.8, 1.8, 0.8)
        );

        for (let wall of mapWalls) {
          if (playerBox.intersectsBox(wall)) {
            camera.position.copy(oldPos);
            break;
          }
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* Запуск системы */
    window.onload = () => {
      initEngine();
      setupControls();
      animate();
    };
  </script>
</body>
</html>
