<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оффлайн Шутер Вид Сверху</title>
    <style>
        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #menu {
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
        #btn-ct { background: #0055ff; color: white; }
        #btn-t { background: #ff2222; color: white; }
        
        #game-container {
            display: none;
            position: relative;
        }
        canvas {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
        }
        #ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .hud-btn {
            background: #333;
            color: white;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
        }

        /* Экранные кнопки управления для телефона */
        #controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 10px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ff4444;
            border: 3px solid white;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .action-btn:active {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Выбор стороны</h1>
        <button id="btn-ct" onclick="startGame('CT')">Спецназ (Синие)</button>
        <button id="btn-t" onclick="startGame('T')">Террористы (Красные)</button>
    </div>

    <div id="game-container">
        <div id="ui">
            <div>Здоровье: <span id="hp">100</span></div>
            <div>Патроны: <span id="ammo">7</span>/7</div>
            <button class="hud-btn" onclick="reloadWeapon()">Перезарядка</button>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="controls">
            <!-- Джойстик движения -->
            <div class="dpad">
                <div class="control-btn" id="btn-up">▲</div>
                <div class="control-btn" id="btn-left">◀</div>
                <div class="control-btn" id="btn-down">▼</div>
                <div class="control-btn" id="btn-right">▶</div>
            </div>
            <!-- Кнопки действий -->
            <div class="actions">
                <div class="action-btn" id="btn-shoot">СТРЕЛЯТЬ</div>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameStarted = false;
let playerTeam = '';

// Управление (Клавиатура + Кнопки)
const keys = { w: false, a: false, s: false, d: false };

window.addEventListener('keydown', e => {
    if (e.key === 'w' || e.key === 'ц') keys.w = true;
    if (e.key === 'a' || e.key === 'ф') keys.a = true;
    if (e.key === 's' || e.key === 'ы') keys.s = true;
    if (e.key === 'd' || e.key === 'в') keys.d = true;
    if (e.key === 'r' || e.key === 'к') reloadWeapon();
});

window.addEventListener('keyup', e => {
    if (e.key === 'w' || e.key === 'ц') keys.w = false;
    if (e.key === 'a' || e.key === 'ф') keys.a = false;
    if (e.key === 's' || e.key === 'ы') keys.s = false;
    if (e.key === 'd' || e.key === 'в') keys.d = false;
});

// Привязка экранных кнопок для телефона
function bindTouchButton(id, keyName) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => { keys[keyName] = true; });
    el.addEventListener('mouseup', () => { keys[keyName] = false; });
}

bindTouchButton('btn-up', 'w');
bindTouchButton('btn-left', 'a');
bindTouchButton('btn-down', 's');
bindTouchButton('btn-right', 'd');

document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
document.getElementById('btn-shoot').addEventListener('mousedown', () => { shoot(); });

// Поворот за мышкой (на ПК) или по направлению движения / врагам (на телефоне)
let mouseX = 400, mouseY = 250;
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

// Карты и стены
const walls = [
    { x: 200, y: 150, w: 400, h: 25 },
    { x: 150, y: 350, w: 25, h: 120 },
    { x: 550, y: 250, w: 25, h: 180 }
];

let player = {
    x: 100, y: 100, radius: 15, speed: 3, hp: 100, maxHp: 100,
    ammo: 7, maxAmmo: 7, isReloading: false, isDead: false, angle: 0
};

let bots = [];
let bullets = [];

function startGame(team) {
    playerTeam = team;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    
    bots = [
        { x: 700, y: 80, radius: 15, speed: 1.2, hp: 100, team: team === 'CT' ? 'T' : 'CT', angle: 0, shootTimer: 0 },
        { x: 700, y: 420, radius: 15, speed: 1.2, hp: 100, team: team === 'CT' ? 'T' : 'CT', angle: 0, shootTimer: 0 },
        { x: 400, y: 400, radius: 15, speed: 1.2, hp: 100, team: team, angle: 0, shootTimer: 0 }
    ];

    gameStarted = true;
    loop();
}

function shoot() {
    if (player.isDead || player.isReloading || player.ammo <= 0) return;
    player.ammo--;
    document.getElementById('ammo').innerText = player.ammo;

    bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        dx: Math.cos(player.angle) * 10,
        dy: Math.sin(player.angle) * 10,
        damage: 50,
        team: playerTeam
    });
}

function reloadWeapon() {
    if (player.isReloading || player.ammo === player.maxAmmo || player.isDead) return;
    player.isReloading = true;
    setTimeout(() => {
        player.ammo = player.maxAmmo;
        document.getElementById('ammo').innerText = player.ammo;
        player.isReloading = false;
    }, 1500);
}

function checkWallCollision(x, y, r) {
    for (let w of walls) {
        if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) {
            return true;
        }
    }
    return x < r || x > canvas.width - r || y < r || y > canvas.height - r;
}

function drawCharacter(x, y, angle, team, isDead) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    if (isDead) {
        ctx.fillStyle = "#777";
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
    }

    // Ноги
    ctx.fillStyle = "#333";
    ctx.fillRect(-8, -12, 5, 8);
    ctx.fillRect(3, -12, 5, 8);

    // Тело (форма)
    ctx.fillStyle = team === 'CT' ? '#0055ff' : '#ff2222';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();

    // Голова
    ctx.fillStyle = "#ffccaa";
    ctx.beginPath();
    ctx.arc(4, 0, 7, 0, Math.PI * 2);
    ctx.fill();

    // Пистолет (Дигл)
    ctx.fillStyle = "#444";
    ctx.fillRect(10, 4, 10, 4);

    ctx.restore();
}

function update() {
    if (!gameStarted) return;

    if (!player.isDead) {
        let moveX = 0, moveY = 0;
        if (keys.w) moveY -= player.speed;
        if (keys.s) moveY += player.speed;
        if (keys.a) moveX -= player.speed;
        if (keys.d) moveX += player.speed;

        if (!checkWallCollision(player.x + moveX, player.y, player.radius)) player.x += moveX;
        if (!checkWallCollision(player.x, player.y + moveY, player.radius)) player.y += moveY;

        // Поворот: на ПК за мышкой, на телефоне — в сторону ближайшего живого бота или по направлению движения
        let targetBot = bots.find(b => b.hp > 0 && b.team !== playerTeam);
        if (moveX !== 0 || moveY !== 0) {
            player.angle = Math.atan2(moveY, moveX);
        } else if (targetBot) {
            player.angle = Math.atan2(targetBot.y - player.y, targetBot.x - player.x);
        } else {
            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        }
    }

    // Логика ботов
    bots.forEach(bot => {
        if (bot.hp <= 0) return;

        let target = (bot.team !== playerTeam && !player.isDead) ? player : null;
        
        if (target) {
            let angleToTarget = Math.atan2(target.y - bot.y, target.x - bot.x);
            bot.angle = angleToTarget;

            let dist = Math.hypot(target.x - bot.x, target.y - bot.y);
            if (dist > 140) {
                let bx = Math.cos(angleToTarget) * bot.speed;
                let by = Math.sin(angleToTarget) * bot.speed;
                if (!checkWallCollision(bot.x + bx, bot.y, bot.radius)) bot.x += bx;
                if (!checkWallCollision(bot.x, bot.y + by, bot.radius)) bot.y += by;
            }

            bot.shootTimer++;
            if (bot.shootTimer > 100) {
                bullets.push({
                    x: bot.x + Math.cos(bot.angle) * 20,
                    y: bot.y + Math.sin(bot.angle) * 20,
                    dx: Math.cos(bot.angle) * 8,
                    dy: Math.sin(bot.angle) * 8,
                    damage: 50,
                    team: bot.team
                });
                bot.shootTimer = 0;
            }
        }
    });

    // Пули
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;

        if (checkWallCollision(b.x, b.y, 3)) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.team !== playerTeam && !player.isDead) {
            if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius) {
                player.hp -= b.damage;
                document.getElementById('hp').innerText = Math.max(0, player.hp);
                if (player.hp <= 0) player.isDead = true;
                bullets.splice(i, 1);
                continue;
            }
        }

        let hitBot = false;
        for (let bot of bots) {
            if (b.team !== bot.team && bot.hp > 0) {
                if (Math.hypot(bot.x - b.x, bot.y - b.y) < bot.radius) {
                    bot.hp -= b.damage;
                    hitBot = true;
                    break;
                }
            }
        }
        if (hitBot) bullets.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#888";
    for (let w of walls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
    }

    bots.forEach(bot => drawCharacter(bot.x, bot.y, bot.angle, bot.team, bot.hp <= 0));
    drawCharacter(player.x, player.y, player.angle, playerTeam, player.isDead);
    
    if (player.isDead) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ВЫ УБИТЫ (Режим призрака)", canvas.width / 2, canvas.height / 2);
    }

    ctx.fillStyle = "#000";
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
</script>

</body>
</html>
