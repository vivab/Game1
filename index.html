<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Offline FPS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive-ui { pointer-events: auto !important; }

        #stats-panel {
            position: absolute; top: 16px; left: 16px;
            background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; padding: 12px 16px; color: #fff; width: 190px;
            backdrop-filter: blur(6px);
        }
        .hp-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .hp-bar-track { width: 100%; height: 7px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        #hp-bar-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.15s; }
        .kills-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #9ca3af; }
        #score-val { color: #fff; }

        #minimap-wrapper { position: absolute; top: 16px; right: 16px; width: 100px; height: 100px; }
        #minimap-canvas { width: 100%; height: 100%; border-radius: 50%; background: rgba(15,23,42,0.75); border: 2px solid rgba(255,255,255,0.2); }
        #btn-reload {
            position: absolute; top: -4px; right: -4px; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center;
        }

        #joystick-zone { position: absolute; bottom: 28px; left: 24px; width: 130px; height: 130px; }

        #btn-fire {
            position: absolute; bottom: 100px; right: 30px; width: 90px; height: 90px; border-radius: 50%;
            background: rgba(120, 35, 35, 0.7); border: 2px solid rgba(255,120,120,0.45);
            color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center;
        }
        #btn-fire:active { background: rgba(220, 38, 38, 0.8); }

        #controls-right-panel {
            position: absolute; bottom: 22px; right: 22px;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-action {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
            color: #fff; font-weight: 800; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-action:active { background: rgba(255,255,255,0.4); }
        .btn-active { background: rgba(34, 197, 94, 0.55) !important; border-color: rgba(34,197,94,0.85) !important; }

        #ammo-panel {
            background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px; padding: 7px 14px; display: flex; flex-direction: column;
        }
        #ammo-count { font-size: 24px; font-weight: 900; color: #f59e0b; line-height: 1; }
        #weapon-name { font-size: 10px; font-weight: 700; color: #9ca3af; margin-top: 2px; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 22px; height: 22px; pointer-events: none; }
        .ch-bar { position: absolute; background: #39ff14; box-shadow: 0 0 2px #000; }
        .ch-v { width: 2px; height: 7px; left: 10px; }
        .ch-h { height: 2px; width: 7px; top: 10px; }
        #ch-top { top: 0; } #ch-bottom { bottom: 0; } #ch-left { left: 0; } #ch-right { right: 0; }

        #hitmarker {
            position: absolute; top: 50%; left: 50%; width: 26px; height: 26px;
            transform: translate(-50%,-50%); pointer-events: none; opacity: 0; transition: opacity 0.05s;
        }
        #hitmarker.show { opacity: 1; }
        #hitmarker div { position: absolute; background: #fff; width: 9px; height: 2px; box-shadow: 0 0 2px #000; }
        #hitmarker .a { top: 3px; left: 2px; transform: rotate(45deg); }
        #hitmarker .b { top: 3px; right: 2px; transform: rotate(-45deg); }
        #hitmarker .c { bottom: 3px; left: 2px; transform: rotate(-45deg); }
        #hitmarker .d { bottom: 3px; right: 2px; transform: rotate(45deg); }

        #start-overlay {
            position: absolute; inset: 0; background: rgba(8,10,18,0.92); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        #start-btn {
            padding: 15px 42px; font-size: 19px; font-weight: bold;
            background: #22c55e; color: #fff; border: none; border-radius: 10px; margin-top: 18px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div id="stats-panel">
            <div class="hp-header"><span>ЗДОРОВЬЕ</span><span id="hp-val">100</span></div>
            <div class="hp-bar-track"><div id="hp-bar-fill"></div></div>
            <div class="kills-row"><span>УБИТО:</span><span id="score-val">0</span></div>
        </div>

        <div id="minimap-wrapper">
            <canvas id="minimap-canvas" width="100" height="100"></canvas>
            <button id="btn-reload" class="interactive-ui">R</button>
        </div>

        <div id="joystick-zone" class="interactive-ui"></div>
        <button id="btn-fire" class="interactive-ui">ОГОНЬ</button>

        <div id="controls-right-panel">
            <button id="btn-crouch" class="btn-action interactive-ui">ПРИСЕД</button>
            <button id="btn-jump" class="btn-action interactive-ui">ПРЫЖОК</button>
            <div id="ammo-panel">
                <div id="ammo-count">30 / 90</div>
                <div id="weapon-name">AK-47</div>
            </div>
        </div>

        <div id="crosshair">
            <div id="ch-top" class="ch-bar ch-v"></div>
            <div id="ch-bottom" class="ch-bar ch-v"></div>
            <div id="ch-left" class="ch-bar ch-h"></div>
            <div id="ch-right" class="ch-bar ch-h"></div>
        </div>
        <div id="hitmarker">
            <div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div>
        </div>
    </div>

    <div id="start-overlay">
        <h2>OFFLINE FPS</h2>
        <p style="opacity:0.7;margin-top:6px;font-size:14px">АК-47 + руки</p>
        <button id="start-btn" class="interactive-ui">В БОЙ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script>
        let scene, camera, renderer;
        let weaponContainer = new THREE.Group();
        let colliders = [];
        let bots = [];
        let bulletDecals = [];
        let raycaster = new THREE.Raycaster();

        const player = {
            hp: 100, score: 0,
            pos: new THREE.Vector3(0, 1.6, 10),
            vel: new THREE.Vector3(),
            onGround: true, isCrouching: false,
            targetHeight: 1.6, currentHeight: 1.6,
            speed: 7.0,
            ammoInMag: 30, maxMag: 30, reserveAmmo: 90,
            isReloading: false, lastShootTime: 0, shootInterval: 105
        };

        let moveJoystick = { x: 0, y: 0 };
        let cameraYaw = 0, cameraPitch = 0;
        let recoilPitch = 0, recoilYaw = 0;
        let isFiring = false;
        let hitmarkerTimer = 0;
        let weaponBob = 0;

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.018);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 400);
            camera.rotation.order = 'YXZ';
            camera.add(weaponContainer);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(25, 40, 15);
            sun.castShadow = true;
            scene.add(sun);

            buildMap();
            loadWeapon();
            for (let i = 0; i < 5; i++) spawnBot();
            setupControls();

            let last = performance.now();
            function loop(now) {
                requestAnimationFrame(loop);
                const dt = Math.min((now - last) / 1000, 0.08);
                last = now;
                updatePlayer(dt);
                updateBots(dt);
                if (isFiring) processShoot(now);
                if (hitmarkerTimer > 0) {
                    hitmarkerTimer -= dt;
                    if (hitmarkerTimer <= 0) document.getElementById('hitmarker').classList.remove('show');
                }
                renderMinimap();
                renderer.render(scene, camera);
            }
            loop(performance.now());
        }

        function buildMap() {
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(80, 80),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            colliders.push(floor);

            scene.add(new THREE.GridHelper(80, 40, 0x3b82f6, 0x334155));

            const crateMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.65 });
            [[0,1.5,-5],[-7,1.5,-9],[7,1.5,-9],[-11,1.5,3],[11,1.5,3],[0,1.5,8],[-4,1.5,-15],[5,1.5,-18]].forEach(p => {
                const c = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), crateMat);
                c.position.set(...p);
                c.castShadow = true; c.receiveShadow = true;
                scene.add(c);
                colliders.push(c);
            });
        }

        function loadWeapon() {
            const loader = new THREE.GLTFLoader();

            // ===== АК-47 (увеличен и подогнан) =====
            loader.load('ak-47_low_poly.glb', (gltf) => {
                const ak = gltf.scene;
                ak.scale.set(0.24, 0.24, 0.24);          // крупнее
                ak.position.set(0.30, -0.26, -0.42);      // позиция под руки
                ak.rotation.set(0.04, Math.PI, 0.02);
                weaponContainer.add(ak);
            }, undefined, (err) => console.log('АК не загрузилась', err));

            // ===== Руки CS =====
            loader.load('default_counter-strike_hands_rigged.glb', (gltf) => {
                const hands = gltf.scene;
                hands.scale.set(0.17, 0.17, 0.17);
                hands.position.set(0.02, -0.38, -0.38);
                hands.rotation.set(0.05, 0, 0);
                weaponContainer.add(hands);
            }, undefined, (err) => console.log('Руки не загрузились', err));
        }

        function spawnBot() {
            const g = new THREE.Group();
            const shirt = 0xd97706, skin = 0xfca5a5, pants = 0x334155;

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshStandardMaterial({ color: shirt }));
            torso.position.y = 1.05; torso.castShadow = true; g.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.MeshStandardMaterial({ color: skin }));
            head.position.y = 1.55; head.castShadow = true; head.userData = { isHead: true }; g.add(head);

            function limb(w, h, d, col, x, y) {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: col }));
                m.position.set(x, y, 0); m.castShadow = true; g.add(m); return m;
            }
            const lArm = limb(0.14, 0.5, 0.14, shirt, 0.34, 1.1);
            const rArm = limb(0.14, 0.5, 0.14, shirt, -0.34, 1.1);
            const lLeg = limb(0.17, 0.6, 0.17, pants, 0.14, 0.4);
            const rLeg = limb(0.17, 0.6, 0.17, pants, -0.14, 0.4);

            g.position.set((Math.random()-0.5)*45, 0, (Math.random()-0.5)*35 - 8);
            scene.add(g);
            bots.push({ mesh: g, hp: 100, speed: 2.4 + Math.random(), lArm, rArm, lLeg, rLeg, t: Math.random()*10 });
        }

        function setupControls() {
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-overlay').style.display = 'none';
            });

            const joy = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static', position: { left: '65px', bottom: '65px' }, color: 'white', size: 110
            });
            joy.on('move', (e, d) => { if (d.vector) { moveJoystick.x = d.vector.x; moveJoystick.y = d.vector.y; } });
            joy.on('end', () => { moveJoystick.x = 0; moveJoystick.y = 0; });

            let lookId = null, fireId = null, lastX = 0, lastY = 0;
            const fireBtn = document.getElementById('btn-fire');

            window.addEventListener('touchstart', e => {
                for (const t of e.changedTouches) {
                    const r = fireBtn.getBoundingClientRect();
                    if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) {
                        fireId = t.identifier; isFiring = true; lastX = t.clientX; lastY = t.clientY; continue;
                    }
                    if (t.target.closest('.interactive-ui')) continue;
                    if (t.clientX > window.innerWidth * 0.3 && lookId === null) {
                        lookId = t.identifier; lastX = t.clientX; lastY = t.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === lookId || t.identifier === fireId) {
                        cameraYaw -= (t.clientX - lastX) * 0.0042;
                        cameraPitch -= (t.clientY - lastY) * 0.0042;
                        cameraPitch = Math.max(-1.35, Math.min(1.35, cameraPitch));
                        lastX = t.clientX; lastY = t.clientY;
                    }
                }
            }, { passive: false });

            const endT = e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === lookId) lookId = null;
                    if (t.identifier === fireId) { fireId = null; isFiring = false; }
                }
            };
            window.addEventListener('touchend', endT);
            window.addEventListener('touchcancel', endT);

            const crouchBtn = document.getElementById('btn-crouch');
            crouchBtn.addEventListener('click', () => {
                player.isCrouching = !player.isCrouching;
                if (player.isCrouching) {
                    player.targetHeight = 0.95; player.speed = 3.4;
                    crouchBtn.classList.add('btn-active');
                } else {
                    player.targetHeight = 1.6; player.speed = 7.0;
                    crouchBtn.classList.remove('btn-active');
                }
            });

            document.getElementById('btn-jump').addEventListener('click', () => {
                if (player.onGround) { player.vel.y = 7.8; player.onGround = false; }
            });
            document.getElementById('btn-reload').addEventListener('click', reloadAmmo);
        }

        function createBulletHole(point, normal) {
            const m = new THREE.Mesh(
                new THREE.PlaneGeometry(0.11, 0.11),
                new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4 })
            );
            m.position.copy(point).addScaledVector(normal, 0.012);
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), normal);
            scene.add(m);
            bulletDecals.push(m);
            if (bulletDecals.length > 45) { scene.remove(bulletDecals.shift()); }
        }

        function processShoot(now) {
            if (player.isReloading) return;
            if (now - player.lastShootTime < player.shootInterval) return;
            if (player.ammoInMag <= 0) { reloadAmmo(); return; }

            player.ammoInMag--;
            player.lastShootTime = now;
            updateUI();

            // Разброс
            let spread = 0.006;
            if (!player.onGround) spread = 0.038;
            else if (Math.abs(moveJoystick.x) > 0.2 || Math.abs(moveJoystick.y) > 0.2) spread = 0.016;

            const sx = (Math.random() - 0.5) * spread;
            const sy = (Math.random() - 0.5) * spread;

            recoilPitch += 0.020 + Math.random() * 0.01;
            recoilYaw += (Math.random() - 0.5) * 0.014;
            weaponContainer.position.z = 0.06;

            raycaster.setFromCamera(new THREE.Vector2(sx * 12, sy * 12), camera);

            const targets = [];
            bots.forEach(b => b.mesh.traverse(c => { if (c.isMesh) targets.push(c); }));
            colliders.forEach(c => targets.push(c));

            const hits = raycaster.intersectObjects(targets);
            if (hits.length) {
                const hit = hits[0];
                let hitBot = null;
                bots.forEach(b => b.mesh.traverse(c => { if (c === hit.object) hitBot = b; }));

                if (hitBot) {
                    const isHead = hit.object.userData && hit.object.userData.isHead;
                    hitBot.hp -= isHead ? 100 : (30 + Math.floor(Math.random() * 18));
                    document.getElementById('hitmarker').classList.add('show');
                    hitmarkerTimer = 0.16;
                    if (hitBot.hp <= 0) {
                        scene.remove(hitBot.mesh);
                        bots = bots.filter(b => b !== hitBot);
                        player.score++;
                        updateUI();
                        spawnBot();
                    }
                } else if (hit.face) {
                    createBulletHole(hit.point, hit.face.normal);
                }
            }
        }

        function reloadAmmo() {
            if (player.isReloading || player.reserveAmmo <= 0 || player.ammoInMag === player.maxMag) return;
            player.isReloading = true;
            document.getElementById('weapon-name').innerText = 'ПЕРЕЗАРЯДКА...';
            setTimeout(() => {
                const need = player.maxMag - player.ammoInMag;
                const take = Math.min(need, player.reserveAmmo);
                player.ammoInMag += take;
                player.reserveAmmo -= take;
                player.isReloading = false;
                document.getElementById('weapon-name').innerText = 'AK-47';
                updateUI();
            }, 1450);
        }

        function updatePlayer(dt) {
            player.vel.y -= 22 * dt;

            const move = new THREE.Vector3(moveJoystick.x, 0, -moveJoystick.y);
            if (move.lengthSq() > 0) move.normalize();
            move.applyEuler(new THREE.Euler(0, cameraYaw, 0, 'YXZ'));

            player.pos.x += move.x * player.speed * dt;
            player.pos.z += move.z * player.speed * dt;
            player.pos.y += player.vel.y * dt;

            player.currentHeight = THREE.MathUtils.lerp(player.currentHeight, player.targetHeight, 11 * dt);
            if (player.pos.y <= player.currentHeight) {
                player.pos.y = player.currentHeight;
                player.vel.y = 0;
                player.onGround = true;
            }

            recoilPitch = THREE.MathUtils.lerp(recoilPitch, 0, 9 * dt);
            recoilYaw = THREE.MathUtils.lerp(recoilYaw, 0, 9 * dt);
            weaponContainer.position.z = THREE.MathUtils.lerp(weaponContainer.position.z, 0, 11 * dt);

            // лёгкий боб оружия
            const moving = Math.abs(moveJoystick.x) > 0.15 || Math.abs(moveJoystick.y) > 0.15;
            weaponBob += dt * (moving ? 9 : 2.5);
            weaponContainer.position.x = Math.sin(weaponBob) * (moving ? 0.012 : 0.003);
            weaponContainer.position.y = Math.cos(weaponBob * 2) * (moving ? 0.008 : 0.002);

            camera.rotation.y = cameraYaw + recoilYaw;
            camera.rotation.x = cameraPitch + recoilPitch;
            camera.position.copy(player.pos);
        }

        function updateBots(dt) {
            bots.forEach(bot => {
                const dir = new THREE.Vector3().subVectors(player.pos, bot.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                if (dist > 1.3) {
                    dir.normalize();
                    bot.mesh.position.addScaledVector(dir, bot.speed * dt);
                    bot.mesh.lookAt(player.pos.x, bot.mesh.position.y, player.pos.z);
                    bot.t += dt * 7.5;
                    const a = Math.sin(bot.t) * 0.55;
                    bot.lLeg.rotation.x = a; bot.rLeg.rotation.x = -a;
                    bot.lArm.rotation.x = -a; bot.rArm.rotation.x = a;
                } else {
                    bot.lLeg.rotation.x = 0; bot.rLeg.rotation.x = 0;
                    player.hp = Math.max(0, player.hp - 9 * dt);
                    updateUI();
                }
            });
        }

        function renderMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const c = 50, scale = 1.2;
            ctx.clearRect(0, 0, 100, 100);
            ctx.fillStyle = '#ef4444';
            bots.forEach(b => {
                const rx = (b.mesh.position.x - player.pos.x) * scale;
                const rz = (b.mesh.position.z - player.pos.z) * scale;
                ctx.beginPath(); ctx.arc(c + rx, c + rz, 3, 0, Math.PI * 2); ctx.fill();
            });
            ctx.fillStyle = '#22c55e';
            ctx.beginPath(); ctx.arc(c, c, 4, 0, Math.PI * 2); ctx.fill();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = Math.round(player.hp);
            document.getElementById('hp-bar-fill').style.width = player.hp + '%';
            document.getElementById('score-val').innerText = player.score;
            document.getElementById('ammo-count').innerText = player.ammoInMag + ' / ' + player.reserveAmmo;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = initScene;
    </script>
</body>
</html>
