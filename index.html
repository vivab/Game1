<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS 1.6 WebGL Mobile - AI & Smooth Touch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
        
        /* UI HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; z-index: 2;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0, 255, 0, 0.85); }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        .hud-panel {
            background: rgba(15, 20, 25, 0.75); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px; border-radius: 8px; color: #fff; font-size: 14px; font-weight: bold;
            backdrop-filter: blur(4px);
        }
        #top-bar { display: flex; justify-content: space-between; align-items: center; }
        #bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .ct-color { color: #4b8bf5; }
        .t-color { color: #e54d4d; }

        #kill-feed {
            position: absolute; top: 60px; right: 15px; text-align: right; font-size: 13px;
            color: #fff; text-shadow: 1px 1px 2px #000; display: flex; flex-direction: column; gap: 4px;
        }

        /* Touch Controls */
        #touch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: auto; touch-action: none;
        }
        
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto; touch-action: none;
        }
        #joystick-thumb {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.6); pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        .touch-btn {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4); color: #fff; font-weight: bold; font-size: 13px;
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
            touch-action: none; backdrop-filter: blur(2px); transition: background 0.2s;
        }
        .touch-btn:active, .touch-btn.active { background: rgba(255, 255, 255, 0.5); border-color: #2ecc71; }
        
        #btn-fire { bottom: 50px; right: 25px; width: 80px; height: 80px; background: rgba(231, 76, 60, 0.65); border-color: #e74c3c; font-size: 18px; }
        #btn-jump { bottom: 145px; right: 25px; width: 60px; height: 60px; }
        #btn-crouch { bottom: 50px; right: 120px; width: 60px; height: 60px; }
        #btn-reload { bottom: 145px; right: 120px; width: 60px; height: 60px; }

        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; z-index: 10; text-align: center; padding: 20px;
        }
        #blocker h1 { font-size: 28px; margin-bottom: 12px; text-transform: uppercase; }
        #blocker p { font-size: 15px; color: #ccc; margin-top: 6px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="top-bar">
            <div class="hud-panel"><span class="ct-color">CT: <span id="ct-count">5</span></span></div>
            <div class="hud-panel"><span id="match-timer">01:45</span></div>
            <div class="hud-panel"><span class="t-color">T: <span id="t-count">5</span></span></div>
        </div>
        <div id="kill-feed"></div>
        <div id="bottom-bar">
            <div class="hud-panel">HP: <span id="health-val" style="color:#2ecc71;">100</span></div>
            <div class="hud-panel">Поза: <span id="state-val" style="color:#f39c12;">Стоит</span></div>
            <div class="hud-panel">Патроны: <span id="ammo-val">30</span> / ∞</div>
        </div>
    </div>

    <div id="touch-overlay">
        <div id="joystick-container">
            <div id="joystick-thumb"></div>
        </div>
        <div id="btn-fire" class="touch-btn">🔥</div>
        <div id="btn-jump" class="touch-btn">🦘</div>
        <div id="btn-crouch" class="touch-btn">🧎</div>
        <div id="btn-reload" class="touch-btn">🔄</div>
    </div>

    <div id="blocker">
        <h1>Нажмите для старта</h1>
        <p>📱 Управление: Джойстик слева | Поворот камеры — свайп справа</p>
        <p>🤖 Боты передвигаются, целятся и ведут огонь!</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // === ПЕРЕМЕННЫЕ ===
        let scene, camera, renderer;
        let yaw = 0, pitch = 0;
        let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;

        let moveDir = { x: 0, y: 0 };
        let isCrouching = false, isJumping = false;
        let velocityY = 0;

        let playerHealth = 100;
        let ammo = 30;
        let isReloading = false;

        const mapObjects = [];
        const characters = [];
        const bulletHoles = [];
        const raycaster = new THREE.Raycaster();

        const STAND_HEIGHT = 1.7;
        const CROUCH_HEIGHT = 1.0;
        const PLAYER_RADIUS = 0.5;

        let pistolGroup, muzzleFlash;
        let weaponRecoilZ = 0, weaponRecoilRotX = 0;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xb5c9df);
            scene.fog = new THREE.FogExp2(0xb5c9df, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            camera.position.set(0, STAND_HEIGHT, -25);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xdbe3ed, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e0, 0.95);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const blocker = document.getElementById('blocker');
            blocker.addEventListener('click', () => { blocker.style.display = 'none'; });
            blocker.addEventListener('touchstart', () => { blocker.style.display = 'none'; });

            create3DPistol();
            setupTouchControls();
            setupKeyboardFallback();
            buildMap();
            spawnTeams();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // === 3D ПИСТОЛЕТ ===
        function create3DPistol() {
            pistolGroup = new THREE.Group();

            const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1f2429, metalness: 0.85, roughness: 0.25 });
            const slideMetal = new THREE.MeshStandardMaterial({ color: 0x3a4047, metalness: 0.9, roughness: 0.2 });
            const gripMat = new THREE.MeshStandardMaterial({ color: 0x111315, roughness: 0.8 });

            const slide = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.07, 0.26), slideMetal);
            slide.position.set(0, 0.035, -0.08); pistolGroup.add(slide);

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.28, 12), darkMetal);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.035, -0.1); pistolGroup.add(barrel);

            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.15, 0.075), gripMat);
            grip.position.set(0, -0.06, -0.02); grip.rotation.x = -0.28; pistolGroup.add(grip);

            const sight = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.018, 0.018), darkMetal);
            sight.position.set(0, 0.08, -0.19); pistolGroup.add(sight);

            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), flashMat);
            muzzleFlash.position.set(0, 0.035, -0.25); pistolGroup.add(muzzleFlash);

            pistolGroup.position.set(0.18, -0.18, -0.35);
            camera.add(pistolGroup);
        }

        // === ПЛАВНОЕ СЕНСОРНОЕ УПРАВЛЕНИЕ ===
        function setupTouchControls() {
            const joyContainer = document.getElementById('joystick-container');
            const joyThumb = document.getElementById('joystick-thumb');
            let joyTouchId = null;

            // ДЖОЙСТИК
            joyContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (joyTouchId === null) {
                        joyTouchId = t.identifier;
                        updateJoystick(t);
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) updateJoystick(t);
                }
            }, { passive: false });

            function resetJoystick() {
                joyTouchId = null;
                joyThumb.style.transform = 'translate(0px, 0px)';
                moveDir.x = 0; moveDir.y = 0;
            }

            window.addEventListener('touchend', (e) => {
                for (let t of e.changedTouches) { if (t.identifier === joyTouchId) resetJoystick(); }
            });

            function updateJoystick(touch) {
                const rect = joyContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const maxRadius = 45;
                const dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joyThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                moveDir.x = dx / maxRadius;
                moveDir.y = -dy / maxRadius;
            }

            // ОБЗОР КАМЕРЫ (ПРАВАЯ ЧАСТЬ)
            const overlay = document.getElementById('touch-overlay');
            overlay.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2 && lookTouchId === null) {
                        if (!t.target.classList.contains('touch-btn')) {
                            lookTouchId = t.identifier;
                            lastTouchX = t.clientX;
                            lastTouchY = t.clientY;
                        }
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === lookTouchId) {
                        const deltaX = t.clientX - lastTouchX;
                        const deltaY = t.clientY - lastTouchY;
                        lastTouchX = t.clientX;
                        lastTouchY = t.clientY;

                        const sens = 0.0035;
                        yaw -= deltaX * sens;
                        pitch -= deltaY * sens;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                        camera.rotation.y = yaw;
                        camera.rotation.x = pitch;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let t of e.changedTouches) { if (t.identifier === lookTouchId) lookTouchId = null; }
            });

            // КНОПКИ
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isJumping) { velocityY = 8.5; isJumping = true; }
            });
            
            const crouchBtn = document.getElementById('btn-crouch');
            crouchBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isCrouching = !isCrouching;
                if (isCrouching) crouchBtn.classList.add('active');
                else crouchBtn.classList.remove('active');
            });

            document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); reloadAmmo(); });
        }

        function setupKeyboardFallback() {
            let keys = {};
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'Space' && !isJumping) { velocityY = 8.5; isJumping = true; }
                if (e.code === 'KeyC' || e.code === 'ControlLeft') isCrouching = !isCrouching;
                if (e.code === 'KeyR') reloadAmmo();
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            setInterval(() => {
                if (lookTouchId === null) {
                    let kx = 0, ky = 0;
                    if (keys['KeyW']) ky += 1;
                    if (keys['KeyS']) ky -= 1;
                    if (keys['KeyA']) kx -= 1;
                    if (keys['KeyD']) kx += 1;
                    if (kx !== 0 || ky !== 0) { moveDir.x = kx; moveDir.y = ky; }
                }
            }, 20);
        }

        // === ПОСТРОЕНИЕ КАРТЫ ===
        function buildMap() {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x999285, roughness: 0.8 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd1c7b7, roughness: 0.6 });
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xad7d52, roughness: 0.5 });

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
            floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

            const wallGeo = new THREE.BoxGeometry(80, 6, 2);
            [
                [0, 3, -40, 0], [0, 3, 40, 0],
                [-40, 3, 0, Math.PI / 2], [40, 3, 0, Math.PI / 2]
            ].forEach(w => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(w[0], w[1], w[2]); wall.rotation.y = w[3];
                scene.add(wall); mapObjects.push(wall);
            });

            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            [[-10, 1.5, -10], [10, 1.5, -10], [-10, 1.5, 10], [10, 1.5, 10], [0, 1.5, -18], [0, 1.5, 18], [-20, 1.5, 0], [20, 1.5, 0]].forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos); box.castShadow = true; box.receiveShadow = true;
                scene.add(box); mapObjects.push(box);
            });
        }

        // === МОДЕЛИ БОТОВ ===
        function createCharacterModel(team) {
            const group = new THREE.Group();
            const isCT = team === 'CT';

            const bodyMat = new THREE.MeshStandardMaterial({ color: isCT ? 0x2b3e55 : 0x4a3b2c });
            const vestMat = new THREE.MeshStandardMaterial({ color: isCT ? 0x1a232e : 0x2a221b });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69 });
            const maskMat = new THREE.MeshStandardMaterial({ color: 0xb53535 });

            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), isCT ? skinMat : maskMat);
            headMesh.position.y = 1.6; headMesh.name = "head"; group.add(headMesh);

            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.3), bodyMat);
            torsoMesh.position.y = 1.1; torsoMesh.name = "torso"; group.add(torsoMesh);

            const vest = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.45, 0.34), vestMat);
            vest.position.y = 1.15; group.add(vest);

            const armGeo = new THREE.BoxGeometry(0.18, 0.55, 0.18);
            const leftArm = new THREE.Mesh(armGeo, bodyMat); leftArm.position.set(-0.38, 1.1, 0); leftArm.name = "arm"; group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, bodyMat); rightArm.position.set(0.38, 1.1, 0); rightArm.name = "arm"; group.add(rightArm);

            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            gun.position.set(0.25, 1.0, -0.25); group.add(gun);

            const legGeo = new THREE.BoxGeometry(0.22, 0.7, 0.22);
            const pantsMat = new THREE.MeshStandardMaterial({ color: isCT ? 0x18202a : 0x2e2720 });
            const leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.16, 0.35, 0); leftLeg.name = "leg"; group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.16, 0.35, 0); rightLeg.name = "leg"; group.add(rightLeg);

            group.userData = { leftLeg, rightLeg, leftArm, rightArm, team, health: 100, isDead: false, animTime: Math.random() * 10, lastShoot: 0 };
            return group;
        }

        function spawnTeams() {
            [[-5,0,-30], [-2.5,0,-30], [2.5,0,-30], [5,0,-30]].forEach(p => {
                const b = createCharacterModel('CT'); b.position.set(...p); scene.add(b); characters.push(b);
            });
            [[-10,0,30], [-5,0,30], [0,0,30], [5,0,30], [10,0,30]].forEach(p => {
                const b = createCharacterModel('T'); b.position.set(...p); scene.add(b); characters.push(b);
            });
        }

        function reloadAmmo() {
            if (isReloading || ammo === 30) return;
            isReloading = true;
            document.getElementById('ammo-val').innerText = "Перезарядка...";
            setTimeout(() => { ammo = 30; isReloading = false; document.getElementById('ammo-val').innerText = ammo; }, 1500);
        }

        // === ИИ БОТОВ (ДВИЖЕНИЕ И СТРЕЛЬБА) ===
        function updateBots(delta) {
            characters.forEach(bot => {
                if (bot.userData.isDead) return;

                // Поиск ближайшего врага
                let nearestEnemy = null;
                let minDist = Infinity;

                // Игрок считается членом команды CT
                if (bot.userData.team === 'T' && playerHealth > 0) {
                    let d = bot.position.distanceTo(camera.position);
                    if (d < minDist) { minDist = d; nearestEnemy = { position: camera.position, isPlayer: true }; }
                }

                characters.forEach(other => {
                    if (other !== bot && !other.userData.isDead && other.userData.team !== bot.userData.team) {
                        let d = bot.position.distanceTo(other.position);
                        if (d < minDist) { minDist = d; nearestEnemy = { position: other.position, isPlayer: false, mesh: other }; }
                    }
                });

                if (nearestEnemy) {
                    // Поворот к цели
                    const targetPos = nearestEnemy.position.clone();
                    targetPos.y = bot.position.y;
                    bot.lookAt(targetPos);

                    // Движение к цели
                    if (minDist > 5) {
                        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(bot.quaternion);
                        const nextX = bot.position.x + dir.x * 3.2 * delta;
                        const nextZ = bot.position.z + dir.z * 3.2 * delta;

                        if (!checkCollision(nextX, nextZ)) {
                            bot.position.x = nextX;
                            bot.position.z = nextZ;
                        }
                    }

                    // Анимация ног при ходьбе
                    bot.userData.animTime += delta * 7;
                    const swing = Math.sin(bot.userData.animTime) * 0.5;
                    bot.userData.leftLeg.rotation.x = swing;
                    bot.userData.rightLeg.rotation.x = -swing;

                    // Стрельба по врагу (раз в 1 секунду)
                    if (performance.now() - bot.userData.lastShoot > 1000 + Math.random() * 500) {
                        bot.userData.lastShoot = performance.now();
                        botShoot(bot, nearestEnemy);
                    }
                }
            });
        }

        function botShoot(bot, enemy) {
            const origin = bot.position.clone().add(new THREE.Vector3(0, 1.4, 0));
            const targetPos = enemy.position.clone();
            if (!enemy.isPlayer) targetPos.y += 1.2;

            const dir = targetPos.sub(origin).normalize();
            // Разброс ботов
            dir.x += (Math.random() - 0.5) * 0.08;
            dir.y += (Math.random() - 0.5) * 0.08;
            dir.z += (Math.random() - 0.5) * 0.08;
            dir.normalize();

            raycaster.set(origin, dir);
            const wallHits = raycaster.intersectObjects(mapObjects, false);
            let maxDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;

            const distToTarget = origin.distanceTo(enemy.position);

            if (distToTarget < maxDist) {
                let damage = Math.floor(Math.random() * 15) + 12;
                if (enemy.isPlayer) {
                    playerHealth = Math.max(0, playerHealth - damage);
                    document.getElementById('health-val').innerText = playerHealth;
                    showFeed(`Бот попал в вас! (-${damage} HP)`);
                    if (playerHealth === 0) showFeed(`ВЫ ПОГИБЛИ!`, true);
                } else {
                    enemy.mesh.userData.health -= damage;
                    if (enemy.mesh.userData.health <= 0 && !enemy.mesh.userData.isDead) {
                        enemy.mesh.userData.isDead = true;
                        enemy.mesh.rotation.x = -Math.PI / 2;
                        enemy.mesh.position.y = 0.2;
                        showFeed(`${bot.userData.team} ликвидировал ${enemy.mesh.userData.team}`, true);
                        updateCounts();
                    }
                }
            }
        }

        // === СТРЕЛЬБА ИГРОКА ===
        function shoot() {
            if (playerHealth <= 0) return;
            if (ammo <= 0 || isReloading) { reloadAmmo(); return; }
            ammo--;
            document.getElementById('ammo-val').innerText = ammo;

            weaponRecoilZ = 0.05;
            weaponRecoilRotX = 0.12;
            muzzleFlash.material.opacity = 0.9;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 50);

            const spread = isCrouching ? 0.005 : (isJumping ? 0.05 : 0.018);
            const dir = new THREE.Vector3((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, -1).applyQuaternion(camera.quaternion).normalize();

            raycaster.set(camera.position, dir);

            const wallHits = raycaster.intersectObjects(mapObjects, false);
            let maxDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;

            if (wallHits.length > 0) createBulletHole(wallHits[0].point, wallHits[0].face.normal);

            const targets = [];
            characters.forEach(c => { if (!c.userData.isDead && c.userData.team === 'T') c.children.forEach(p => targets.push(p)); });

            const hits = raycaster.intersectObjects(targets, false);

            if (hits.length > 0 && hits[0].distance < maxDist) {
                const hit = hits[0];
                const part = hit.object;
                const char = part.parent;

                let damage = 0, name = "";
                if (part.name === "head") { damage = Math.floor(Math.random() * 6) + 95; name = "Голова 🎯"; }
                else if (part.name === "torso") { damage = Math.floor(Math.random() * 31) + 30; name = "Тело 👕"; }
                else if (part.name === "arm") { damage = Math.floor(Math.random() * 31) + 10; name = "Рука 🦾"; }
                else if (part.name === "leg") { damage = Math.floor(Math.random() * 11) + 10; name = "Нога 🦵"; }

                char.userData.health -= damage;
                showFeed(`Попадание: ${name} (-${damage} HP)`);

                if (char.userData.health <= 0 && !char.userData.isDead) {
                    char.userData.isDead = true;
                    char.rotation.x = -Math.PI / 2;
                    char.position.y = 0.2;
                    showFeed(`Враг уничтожен!`, true);
                    updateCounts();
                }
            }
        }

        function createBulletHole(point, normal) {
            const geo = new THREE.CircleGeometry(0.08, 12);
            const mat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
            const hole = new THREE.Mesh(geo, mat);

            hole.position.copy(point).add(normal.clone().multiplyScalar(0.01));
            const dummy = new THREE.Object3D();
            dummy.position.copy(hole.position);
            dummy.lookAt(point.clone().add(normal));
            hole.quaternion.copy(dummy.quaternion);

            scene.add(hole);
            bulletHoles.push({ mesh: hole, time: performance.now() });
        }

        function showFeed(msg, isKill = false) {
            const feed = document.getElementById('kill-feed');
            const el = document.createElement('div');
            el.innerText = msg;
            el.style.color = isKill ? '#e74c3c' : '#f1c40f';
            feed.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function updateCounts() {
            const tAlive = characters.filter(c => c.userData.team === 'T' && !c.userData.isDead).length;
            document.getElementById('t-count').innerText = tAlive;
        }

        function checkCollision(nextX, nextZ) {
            for (let obj of mapObjects) {
                const bbox = new THREE.Box3().setFromObject(obj);
                bbox.min.x -= PLAYER_RADIUS; bbox.max.x += PLAYER_RADIUS;
                bbox.min.z -= PLAYER_RADIUS; bbox.max.z += PLAYER_RADIUS;

                if (nextX >= bbox.min.x && nextX <= bbox.max.x && nextZ >= bbox.min.z && nextZ <= bbox.max.z) return true;
            }
            return false;
        }

        // === ИГРОВОЙ ЦИКЛ ===
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            weaponRecoilZ *= 0.82;
            weaponRecoilRotX *= 0.82;
            pistolGroup.position.z = -0.35 + weaponRecoilZ;
            pistolGroup.rotation.x = weaponRecoilRotX;

            const targetHeight = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
            camera.position.y += (targetHeight - camera.position.y) * 12 * delta;

            if (playerHealth > 0) {
                const speed = (isCrouching ? 3.0 : 7.0) * delta;
                if (moveDir.x !== 0 || moveDir.y !== 0) {
                    const forward = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
                    const right = new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw));

                    const deltaPos = new THREE.Vector3();
                    deltaPos.addScaledVector(forward, moveDir.y * speed);
                    deltaPos.addScaledVector(right, moveDir.x * speed);

                    if (!checkCollision(camera.position.x + deltaPos.x, camera.position.z)) camera.position.x += deltaPos.x;
                    if (!checkCollision(camera.position.x, camera.position.z + deltaPos.z)) camera.position.z += deltaPos.z;
                }
            }

            velocityY -= 25.0 * delta;
            camera.position.y += velocityY * delta;

            if (camera.position.y < targetHeight) {
                velocityY = 0;
                camera.position.y = targetHeight;
                isJumping = false;
            }

            document.getElementById('state-val').innerText = isJumping ? "В прыжке 🦘" : (isCrouching ? "Сидя 🧎" : "Стоит 🧍");

            // Очистка следов от пуль
            for (let i = bulletHoles.length - 1; i >= 0; i--) {
                if (time - bulletHoles[i].time > 1800) {
                    scene.remove(bulletHoles[i].mesh);
                    bulletHoles[i].mesh.geometry.dispose();
                    bulletHoles[i].mesh.material.dispose();
                    bulletHoles.splice(i, 1);
                }
            }

            // Обновляем ИИ ботов
            updateBots(delta);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
