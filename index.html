<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS 1.6 WebGL - 5v5 Tactical Shooter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
        
        /* UI HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        .hud-panel {
            background: rgba(15, 20, 25, 0.65); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold;
            backdrop-filter: blur(4px);
        }
        #top-bar { display: flex; justify-content: space-between; align-items: center; }
        #bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .ct-color { color: #4b8bf5; }
        .t-color { color: #e54d4d; }

        #kill-feed {
            position: absolute; top: 20px; right: 20px; text-align: right; font-size: 14px;
            color: #fff; text-shadow: 1px 1px 2px #000; display: flex; flex-direction: column; gap: 4px;
        }

        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; z-index: 10;
        }
        #blocker h1 { font-size: 36px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        #blocker p { font-size: 16px; color: #ccc; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="top-bar">
            <div class="hud-panel"><span class="ct-color">CT (Спецназ): <span id="ct-count">5</span></span></div>
            <div class="hud-panel"><span id="match-timer">01:45</span></div>
            <div class="hud-panel"><span class="t-color">T (Террористы): <span id="t-count">5</span></span></div>
        </div>
        <div id="kill-feed"></div>
        <div id="bottom-bar">
            <div class="hud-panel">HP: <span id="health-val" style="color:#2ecc71;">100</span></div>
            <div class="hud-panel">Состояние: <span id="state-val" style="color:#f39c12;">Стоит</span></div>
            <div class="hud-panel">Патроны: <span id="ammo-val">30</span> / ∞</div>
        </div>
    </div>

    <div id="blocker">
        <h1>Кликните для старта</h1>
        <p>Управление: WASD — Перемещение | Мышь — Обзор | ЛКМ — Стрельба</p>
        <p>Space — Прыжок | C / Ctrl — Присесть (уменьшает разброс)</p>
    </div>

    <!-- Подключаем Three.js и PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // === ОСНОВНЫЕ ПЕРЕМЕННЫЕ ===
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isCrouching = false, isJumping = false;

        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        let playerHealth = 100;
        let ammo = 30;
        let isReloading = false;

        const mapObjects = [];
        const characters = []; // Все боты и игроки
        const raycaster = new THREE.Raycaster();

        // Высота игрока
        const STAND_HEIGHT = 1.7;
        const CROUCH_HEIGHT = 1.0;

        // === ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ===
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xb5c9df); // Мягкое небесно-голубое небо
            scene.fog = new THREE.FogExp2(0xb5c9df, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = STAND_HEIGHT;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Освещение в приятных тонах
            const ambientLight = new THREE.AmbientLight(0xdbe3ed, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e0, 0.9);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Управление
            controls = new THREE.PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');

            blocker.addEventListener('click', () => { controls.lock(); });
            controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
            controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

            scene.add(controls.getObject());

            setupInputs();
            buildMap();
            spawnTeams();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // === ПОСТРОЕНИЕ КАРТЫ В ПРИЯТНЫХ ТОНАХ ===
        function buildMap() {
            // Материалы
            const floorMat = new THREE.MeshStandardMaterial({ color: #999285, roughness: 0.8 });
            const wallMat = new THREE.MeshStandardMaterial({ color: #d1c7b7, roughness: 0.6 });
            const boxMat = new THREE.MeshStandardMaterial({ color: #ad7d52, roughness: 0.5 });

            // Пол
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Внешние стены
            const wallGeo = new THREE.BoxGeometry(80, 6, 2);
            const wallPositions = [
                { pos: [0, 3, -40], rot: [0, 0, 0] },
                { pos: [0, 3, 40], rot: [0, 0, 0] },
                { pos: [-40, 3, 0], rot: [0, Math.PI / 2, 0] },
                { pos: [40, 3, 0], rot: [0, Math.PI / 2, 0] }
            ];

            wallPositions.forEach(w => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(...w.pos);
                wall.rotation.set(...w.rot);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                mapObjects.push(wall);
            });

            // Препятствия и ящики (Укрытие)
            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            const boxCoords = [
                [-10, 1.5, -10], [10, 1.5, -10], [-10, 1.5, 10], [10, 1.5, 10],
                [0, 1.5, -18], [0, 1.5, 18], [-20, 1.5, 0], [20, 1.5, 0]
            ];

            boxCoords.forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                mapObjects.push(box);
            });
        }

        // === ПРОЦЕДУРНОЕ СОЗДАНИЕ ПЕРСОНАЖЕЙ (CS 1.6 STYLE) ===
        function createCharacterModel(team) {
            const group = new THREE.Group();

            // Цвета формы
            const isCT = team === 'CT';
            const bodyColor = isCT ? 0x2b3e55 : 0x5c4228;
            const pantsColor = isCT ? 0x1f2a38 : 0x3d352b;
            const skinColor = 0xe0ac69;

            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.8 });
            const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.5 });
            const headMat = isCT ? new THREE.MeshStandardMaterial({ color: 0x222222 }) : skinMat; // Шлем у CT

            // 1. Голова (Head Hitbox)
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 1.6;
            headMesh.castShadow = true;
            headMesh.name = "head";
            group.add(headMesh);

            // 2. Торс (Body Hitbox)
            const torsoGeo = new THREE.BoxGeometry(0.55, 0.65, 0.3);
            const torsoMesh = new THREE.Mesh(torsoGeo, bodyMat);
            torsoMesh.position.y = 1.1;
            torsoMesh.castShadow = true;
            torsoMesh.name = "torso";
            group.add(torsoMesh);

            // 3. Руки (Arms Hitbox)
            const armGeo = new THREE.BoxGeometry(0.18, 0.55, 0.18);
            
            const leftArm = new THREE.Mesh(armGeo, bodyMat);
            leftArm.position.set(-0.38, 1.1, 0);
            leftArm.name = "arm";
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, bodyMat);
            rightArm.position.set(0.38, 1.1, 0);
            rightArm.name = "arm";
            group.add(rightArm);

            // 4. Ноги (Legs Hitbox)
            const legGeo = new THREE.BoxGeometry(0.22, 0.7, 0.22);

            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.16, 0.35, 0);
            leftLeg.name = "leg";
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.16, 0.35, 0);
            rightLeg.name = "leg";
            group.add(rightLeg);

            // Сохраняем ссылки для анимации
            group.userData = {
                leftLeg, rightLeg, leftArm, rightArm, headMesh, torsoMesh,
                team, health: 100, isDead: false, animTime: Math.random() * 10
            };

            return group;
        }

        // === СПАВН КОМАНД 5v5 ===
        function spawnTeams() {
            // Игрок уже CT, спавним 4 CT союзников и 5 T врагов
            const ctSpawns = [
                [-5, 0, -30], [-2.5, 0, -30], [2.5, 0, -30], [5, 0, -30]
            ];
            const tSpawns = [
                [-10, 0, 30], [-5, 0, 30], [0, 0, 30], [5, 0, 30], [10, 0, 30]
            ];

            // Спавн CT Ботов
            ctSpawns.forEach(pos => {
                const bot = createCharacterModel('CT');
                bot.position.set(...pos);
                scene.add(bot);
                characters.push(bot);
            });

            // Спавн T Ботов
            tSpawns.forEach(pos => {
                const bot = createCharacterModel('T');
                bot.position.set(...pos);
                scene.add(bot);
                characters.push(bot);
            });
        }

        // === ОБРАБОТКА ВВОДА ===
        function setupInputs() {
            const onKeyDown = (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (!isJumping) {
                            velocity.y += 8.5; // Прыжок
                            isJumping = true;
                        }
                        break;
                    case 'KeyC':
                    case 'ControlLeft':
                        isCrouching = true;
                        break;
                    case 'KeyR':
                        reloadAmmo();
                        break;
                }
            };

            const onKeyUp = (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'KeyC':
                    case 'ControlLeft':
                        isCrouching = false;
                        break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', (e) => {
                if (e.button === 0 && controls.isLocked) {
                    shoot();
                }
            });
        }

        function reloadAmmo() {
            if (isReloading || ammo === 30) return;
            isReloading = true;
            document.getElementById('ammo-val').innerText = "Перезарядка...";
            setTimeout(() => {
                ammo = 30;
                isReloading = false;
                document.getElementById('ammo-val').innerText = ammo;
            }, 1500);
        }

        // === РАСЧЕТ УРОНА И ПРОВЕРКА СТЕН (RAYCASTING) ===
        function shoot() {
            if (ammo <= 0 || isReloading) {
                reloadAmmo();
                return;
            }

            ammo--;
            document.getElementById('ammo-val').innerText = ammo;

            // Направление выстрела с учётом приседания (разброс)
            const spread = isCrouching ? 0.005 : (isJumping ? 0.05 : 0.018);
            const rayDirection = new THREE.Vector3(
                (Math.random() - 0.5) * spread,
                (Math.random() - 0.5) * spread,
                -1
            ).applyQuaternion(camera.quaternion).normalize();

            raycaster.set(camera.position, rayDirection);

            // 1. Проверяем попадание в стены
            const wallIntersects = raycaster.intersectObjects(mapObjects, false);
            let maxDistance = Infinity;
            if (wallIntersects.length > 0) {
                maxDistance = wallIntersects[0].distance; // Пуля не летит дальше стены!
            }

            // 2. Проверяем попадания в живых ботов
            const targetMeshes = [];
            characters.forEach(char => {
                if (!char.userData.isDead && char.userData.team === 'T') {
                    char.children.forEach(part => targetMeshes.push(part));
                }
            });

            const hits = raycaster.intersectObjects(targetMeshes, false);

            if (hits.length > 0 && hits[0].distance < maxDistance) {
                const hit = hits[0];
                const part = hit.object;
                const character = part.parent;
                const hitPoint = hit.point;

                let damage = 0;
                let hitZoneName = "";

                // Расчет урона по зонам
                if (part.name === "head") {
                    damage = Math.floor(Math.random() * 6) + 95; // 95-100
                    hitZoneName = "Голова 🎯";
                } else if (part.name === "torso") {
                    // Урон зависит от высоты попадания в торс (ближе к шее — выше)
                    const relY = (hitPoint.y - (character.position.y + 0.8)) / 0.65;
                    damage = Math.floor(30 + Math.max(0, Math.min(1, relY)) * 30); // 30-60
                    hitZoneName = "Тело 👕";
                } else if (part.name === "arm") {
                    const relY = (hitPoint.y - (character.position.y + 0.8)) / 0.55;
                    damage = Math.floor(10 + Math.max(0, Math.min(1, relY)) * 30); // 10-40
                    hitZoneName = "Рука 🦾";
                } else if (part.name === "leg") {
                    damage = Math.floor(Math.random() * 11) + 10; // 10-20
                    hitZoneName = "Нога 🦵";
                }

                applyDamage(character, damage, hitZoneName);
            }
        }

        function applyDamage(char, damage, zoneName) {
            char.userData.health -= damage;
            showKillFeed(`Попадание: ${zoneName} (-${damage} HP)`);

            if (char.userData.health <= 0 && !char.userData.isDead) {
                char.userData.isDead = true;
                char.rotation.x = -Math.PI / 2; // Регдолл / Падение
                char.position.y = 0.2;
                showKillFeed(`Враг ликвидирован!`, true);
                updateTeamCounts();
            }
        }

        function showKillFeed(msg, isKill = false) {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.innerText = msg;
            item.style.color = isKill ? '#e74c3c' : '#f1c40f';
            feed.appendChild(item);
            setTimeout(() => item.remove(), 2500);
        }

        function updateTeamCounts() {
            const tAlive = characters.filter(c => c.userData.team === 'T' && !c.userData.isDead).length;
            const ctAlive = characters.filter(c => c.userData.team === 'CT' && !c.userData.isDead).length + 1; // +1 игрок
            document.getElementById('t-count').innerText = tAlive;
            document.getElementById('ct-count').innerText = ctAlive;
        }

        // === АНИМАЦИИ ПЕРСОНАЖЕЙ И ФИЗИКА ===
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (controls.isLocked) {
                // Плавная смена высоты камеры (Приседание)
                const targetHeight = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
                camera.position.y += (targetHeight - camera.position.y) * 12 * delta;

                // Замедление при приседании
                const speedMultiplier = isCrouching ? 0.45 : 1.0;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta; // Гравитация

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * speedMultiplier * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * speedMultiplier * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += velocity.y * delta;

                // Проверка земли
                if (camera.position.y < targetHeight) {
                    velocity.y = 0;
                    camera.position.y = targetHeight;
                    isJumping = false;
                }

                // Обновление статуса в UI
                document.getElementById('state-val').innerText = isJumping ? "В прыжке 🦘" : (isCrouching ? "Присел 🧎" : "Стоит 🧍");
            }

            // Анимация ног и рук ботов
            characters.forEach(char => {
                if (char.userData.isDead) return;

                char.userData.animTime += delta * 6;
                const swing = Math.sin(char.userData.animTime) * 0.5;

                // Шагающие движения ног и рук
                char.userData.leftLeg.rotation.x = swing;
                char.userData.rightLeg.rotation.x = -swing;
                char.userData.leftArm.rotation.x = -swing * 0.8;
                char.userData.rightArm.rotation.x = swing * 0.8;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
