<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Offline FPS v0.4</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #game-container{width:100%;height:100%;position:relative;overflow:hidden}
    canvas{display:block;width:100%!important;height:100%!important;position:absolute;top:0;left:0}
    #crosshair{position:absolute;top:50%;left:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;z-index:15}
    #crosshair .h,#crosshair .v{position:absolute;background:rgba(255,255,255,.92);box-shadow:0 0 2px #000}
    #crosshair .h{width:22px;height:2px;top:10px;left:0}
    #crosshair .v{width:2px;height:22px;top:0;left:10px}
    #crosshair .dot{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;top:9.5px;left:9.5px}
    #hitmarker{position:absolute;top:50%;left:50%;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none;z-index:16;opacity:0;transition:opacity .05s}
    #hitmarker.show{opacity:1}
    #hitmarker .l1,#hitmarker .l2,#hitmarker .l3,#hitmarker .l4{position:absolute;background:#fff;box-shadow:0 0 3px #000}
    #hitmarker .l1{width:10px;height:2px;top:4px;left:2px;transform:rotate(45deg)}
    #hitmarker .l2{width:10px;height:2px;top:4px;right:2px;transform:rotate(-45deg)}
    #hitmarker .l3{width:10px;height:2px;bottom:4px;left:2px;transform:rotate(-45deg)}
    #hitmarker .l4{width:10px;height:2px;bottom:4px;right:2px;transform:rotate(45deg)}
    #hp-container{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:240px;z-index:15}
    #hp-bar-bg{width:100%;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
    #hp-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#a00f0f,#e74c3c);transition:width .12s ease-out}
    #hp-text{text-align:center;color:#fff;font-size:12px;margin-top:3px;text-shadow:0 1px 2px #000}
    #ammo-display{position:absolute;bottom:24px;right:20px;color:#fff;font-size:26px;font-weight:700;text-shadow:0 2px 6px #000;z-index:15;letter-spacing:1px}
    #ammo-display span{font-size:16px;opacity:.7}
    #debug-panel{position:absolute;top:10px;left:10px;color:#0f0;font:12px/1.45 monospace;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:4px;z-index:15;pointer-events:none;min-width:160px}
    #kill-feed{position:absolute;top:48px;left:12px;text-align:left;z-index:15;pointer-events:none;max-width:70%}
    #kill-feed .kill-line{color:#fff;font-size:13px;text-shadow:0 1px 3px #000;margin-bottom:5px;opacity:.95;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px;display:inline-block;animation:fadeOut 4s forwards}
    #kill-feed .killer{color:#7CFC00;font-weight:600}
    #kill-feed .victim{color:#ff6b6b;font-weight:600}
    #kill-feed .icon{color:#fff;margin:0 5px}
    @keyframes fadeOut{0%{opacity:.95}70%{opacity:.95}100%{opacity:0}}
    #mobile-controls{position:absolute;inset:0;pointer-events:none;z-index:20}
    #joystick-zone{position:absolute;bottom:20px;left:20px;width:150px;height:150px;pointer-events:auto}
    .mobile-btn{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,20,20,.55);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
    #btn-jump{bottom:120px;right:24px}
    #btn-crouch{bottom:40px;right:24px}
    #btn-shoot{bottom:40px;right:110px;width:82px;height:82px;background:rgba(160,30,30,.65);border-color:rgba(255,100,100,.5);font-size:15px}
    #btn-reload{bottom:120px;right:110px;width:60px;height:60px;font-size:12px}
    #start-screen{position:absolute;inset:0;background:linear-gradient(160deg,#0d1117 0%,#161b22 50%,#0d1117 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:20px}
    #start-screen h1{font-size:28px;margin-bottom:8px;letter-spacing:1px}
    #start-screen p{font-size:14px;opacity:.75;margin-bottom:6px;max-width:320px;line-height:1.5}
    #start-btn{margin-top:28px;padding:14px 48px;font-size:18px;font-weight:700;border:none;border-radius:10px;background:#238636;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(35,134,54,.4)}
    #start-btn:active{transform:scale(.97)}
    #error-box{display:none;margin-top:20px;padding:12px 16px;background:rgba(180,40,40,.3);border:1px solid #c0392b;border-radius:8px;color:#ffaaaa;font-size:13px;max-width:90%;text-align:left}
    #loading{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;color:#aaa;font-size:15px}
    #loading .spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#2ecc71;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><div id="loading-text">Загрузка...</div></div>
  <div id="game-container" style="display:none">
    <div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>
    <div id="hitmarker"><div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="l4"></div></div>
    <div id="hp-container"><div id="hp-bar-bg"><div id="hp-bar-fill"></div></div><div id="hp-text">100 HP</div></div>
    <div id="ammo-display">30 <span>/ 90</span></div>
    <div id="debug-panel">FPS: --</div>
    <div id="kill-feed"></div>
    <div id="mobile-controls">
      <div id="joystick-zone"></div>
      <div class="mobile-btn" id="btn-jump">ПРЫГ</div>
      <div class="mobile-btn" id="btn-crouch">СЕСТ</div>
      <div class="mobile-btn" id="btn-shoot">ОГОНЬ</div>
      <div class="mobile-btn" id="btn-reload">R</div>
    </div>
    <div id="start-screen">
      <h1>OFFLINE FPS</h1>
      <p>v0.4 + твоя АК-47</p>
      <p>Пробел — прыжок · C — присед · R — перезарядка</p>
      <button id="start-btn">НАЧАТЬ ИГРУ</button>
      <div id="error-box"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script>
    let scene, camera, renderer, clock, velocity, direction;
    let canJump = true, isCrouching = false, isGrounded = true, isShooting = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isPointerLocked = false, weaponGroup = null, weaponBobTime = 0;
    let decals = [], bots = [], colliders = [];
    let playerHP = 100, ammoInMag = 30, ammoReserve = 90, isReloading = false;
    let lastShotTime = 0, joyX = 0, joyY = 0, gameStarted = false;
    let frameCount = 0, lastFpsUpdate = 0, currentFps = 0, kills = 0;
    let muzzleFlash = null, flashTimer = 0, hitmarkerTimer = 0, botIdCounter = 1;

    const GRAVITY = 32, WALK_SPEED = 8.0, CROUCH_SPEED = 3.6, JUMP_SPEED = 11.0;
    const STAND_HEIGHT = 1.65, CROUCH_HEIGHT = 1.05;
    const MOUSE_SENS = 0.0022, TOUCH_SENS = 0.0045, FIRE_RATE = 100, MAG_SIZE = 30;
    const PLAYER_NICK = 'You';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('start-btn').addEventListener('touchend', e => { e.preventDefault(); startGame(); });

    function startGame() {
      if (gameStarted) return;
      gameStarted = true;
      document.getElementById('start-screen').style.display = 'none';
      try {
        initScene();
        createWorld();
        createWeapon();
        createBots(5);
        setupInput();
        animate();
      } catch (err) {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').textContent = 'Ошибка: ' + err.message;
        document.getElementById('start-screen').style.display = 'flex';
        gameStarted = false;
      }
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87b8d8);
      scene.fog = new THREE.Fog(0x87b8d8, 35, 95);
      camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 180);
      camera.position.set(0, STAND_HEIGHT, 8);
      camera.rotation.order = 'YXZ';
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').insertBefore(renderer.domElement, document.getElementById('game-container').firstChild);
      clock = new THREE.Clock();
      velocity = new THREE.Vector3();
      direction = new THREE.Vector3();
      scene.add(new THREE.AmbientLight(0x606060, 0.55));
      scene.add(new THREE.HemisphereLight(0xddeeff, 0x444422, 0.55));
      const sun = new THREE.DirectionalLight(0xfff4e0, 1.05);
      sun.position.set(25, 45, 15);
      sun.castShadow = true;
      scene.add(sun);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function createWorld() {
      colliders = [];
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.92 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      scene.add(new THREE.GridHelper(90, 45, 0x333333, 0x2a2a2a));
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a6a55, roughness: 0.88 });
      function makeWall(w, h, d, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
        colliders.push({ minX: x-w/2, maxX: x+w/2, minY: y-h/2, maxY: y+h/2, minZ: z-d/2, maxZ: z+d/2 });
      }
      const H = 5.5;
      makeWall(90, H, 1.2, 0, H/2, -45); makeWall(90, H, 1.2, 0, H/2, 45);
      makeWall(1.2, H, 90, -45, H/2, 0); makeWall(1.2, H, 90, 45, H/2, 0);
      makeWall(5, 2, 1.4, -14, 1, -10); makeWall(1.4, 2, 6, 10, 1, 8);
      makeWall(7, 1.3, 1.4, 0, 0.65, 20); makeWall(3.5, 3.2, 3.5, -20, 1.6, 18);
      makeWall(2.2, 1.8, 2.2, 16, 0.9, -15); makeWall(8, 1.1, 1.3, -5, 0.55, -22);
    }

    function createWeapon() {
      weaponGroup = new THREE.Group();
      // Руки
      const skin = new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: 0.7 });
      const sleeve = new THREE.MeshStandardMaterial({ color: 0x2a3a2a, roughness: 0.8 });
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.32), sleeve);
      armR.position.set(0.18, -0.28, -0.05); armR.rotation.x = 0.4; weaponGroup.add(armR);
      const handR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.1), skin);
      handR.position.set(0.18, -0.38, -0.22); weaponGroup.add(handR);
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.28), sleeve);
      armL.position.set(0.05, -0.25, -0.25); armL.rotation.x = 0.6; armL.rotation.y = -0.3; weaponGroup.add(armL);
      const handL = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.08, 0.09), skin);
      handL.position.set(0.0, -0.32, -0.42); weaponGroup.add(handL);

      muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0 }));
      muzzleFlash.position.set(0.25, -0.15, -0.85); weaponGroup.add(muzzleFlash);

      weaponGroup.position.set(0.15, -0.15, -0.2);
      camera.add(weaponGroup);
      scene.add(camera);

      // Загрузка твоей модели
      const loader = new THREE.GLTFLoader();
      loader.load('ak-47_low_poly.glb', function(gltf) {
        const model = gltf.scene;
        model.scale.set(0.45, 0.45, 0.45);
        model.rotation.y = Math.PI;
        model.position.set(0.28, -0.22, -0.35);
        weaponGroup.add(model);
        console.log('АК загружена');
      }, undefined, function(err) {
        console.warn('Модель не загрузилась', err);
        // запасное оружие
        const temp = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.55), new THREE.MeshStandardMaterial({ color: 0x333 }));
        temp.position.set(0.25, -0.18, -0.4); weaponGroup.add(temp);
      });
    }

    function createBotMesh(name) {
      const g = new THREE.Group(); g.userData.nick = name;
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.7, 0.28), new THREE.MeshStandardMaterial({ color: 0x3d5a3d }));
      torso.position.y = 1.15; torso.name = 'body'; g.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.32, 0.28), new THREE.MeshStandardMaterial({ color: 0xc4a070 }));
      head.position.y = 1.68; head.name = 'head'; g.add(head);
      const pants = new THREE.MeshStandardMaterial({ color: 0x2a3a4a });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.18), pants); legL.position.set(-0.13, 0.4, 0); legL.name = 'leg'; g.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.18), pants); legR.position.set(0.13, 0.4, 0); legR.name = 'leg'; g.add(legR);
      const armMat = new THREE.MeshStandardMaterial({ color: 0x3d5a3d });
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.13), armMat); armL.position.set(-0.34, 1.1, 0); armL.name = 'arm'; g.add(armL);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.13), armMat); armR.position.set(0.34, 1.1, 0); armR.name = 'arm'; g.add(armR);
      return g;
    }

    function createBots(n) {
      for (let i = 0; i < n; i++) {
        const nick = 'Bot' + (botIdCounter++);
        const bot = createBotMesh(nick);
        const a = (i / n) * Math.PI * 2, r = 12 + Math.random() * 18;
        bot.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        bot.userData = { hp: 100, speed: 2.3 + Math.random() * 1.3, attackCooldown: 0, nick };
        scene.add(bot); bots.push(bot);
      }
    }

    function setupInput() {
      window.addEventListener('keydown', e => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        if (e.code === 'Space' && canJump) { velocity.y = JUMP_SPEED; canJump = false; isGrounded = false; }
        if (e.code === 'KeyC') isCrouching = !isCrouching;
        if (e.code === 'KeyR') startReload();
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
      });
      renderer.domElement.addEventListener('click', () => { if (!isPointerLocked) renderer.domElement.requestPointerLock(); });
      document.addEventListener('pointerlockchange', () => { isPointerLocked = document.pointerLockElement === renderer.domElement; });
      document.addEventListener('mousemove', e => {
        if (!isPointerLocked) return;
        camera.rotation.y -= e.movementX * MOUSE_SENS;
        camera.rotation.x -= e.movementY * MOUSE_SENS;
        camera.rotation.x = Math.max(-1.35, Math.min(1.35, camera.rotation.x));
      });
      window.addEventListener('mousedown', e => { if (e.button === 0 && isPointerLocked) isShooting = true; });
      window.addEventListener('mouseup', e => { if (e.button === 0) isShooting = false; });

      document.getElementById('btn-jump').addEventListener('touchstart', e => {
        e.preventDefault(); if (canJump) { velocity.y = JUMP_SPEED; canJump = false; isGrounded = false; }
      }, { passive: false });
      document.getElementById('btn-crouch').addEventListener('touchstart', e => {
        e.preventDefault(); isCrouching = !isCrouching;
      }, { passive: false });
      document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault(); isShooting = true; }, { passive: false });
      document.getElementById('btn-shoot').addEventListener('touchend', e => { e.preventDefault(); isShooting = false; }, { passive: false });
      document.getElementById('btn-reload').addEventListener('touchstart', e => { e.preventDefault(); startReload(); }, { passive: false });

      if (window.nipplejs) {
        const m = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '75px', bottom: '75px' }, color: '#fff', size: 120 });
        m.on('move', (e, d) => { const f = Math.min(d.force, 1); joyX = Math.cos(d.angle.radian) * f; joyY = Math.sin(d.angle.radian) * f; });
        m.on('end', () => { joyX = 0; joyY = 0; });
      }

      let lastTX = 0, lastTY = 0, looking = false;
      renderer.domElement.addEventListener('touchstart', e => {
        for (let t of e.touches) {
          if (t.clientX < 160 && t.clientY > window.innerHeight - 170) continue;
          looking = true; lastTX = t.clientX; lastTY = t.clientY; break;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', e => {
        if (!looking) return;
        let t = null;
        for (let touch of e.touches) {
          if (touch.clientX < 160 && touch.clientY > window.innerHeight - 170) continue;
          t = touch; break;
        }
        if (!t) return;
        camera.rotation.y -= (t.clientX - lastTX) * TOUCH_SENS;
        camera.rotation.x -= (t.clientY - lastTY) * TOUCH_SENS;
        camera.rotation.x = Math.max(-1.35, Math.min(1.35, camera.rotation.x));
        lastTX = t.clientX; lastTY = t.clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', e => { if (e.touches.length === 0) looking = false; });
    }

    function tryShoot() {
      if (isReloading) return;
      const now = performance.now();
      if (now - lastShotTime < FIRE_RATE) return;
      if (ammoInMag <= 0) { startReload(); return; }
      lastShotTime = now; ammoInMag--; updateAmmoUI();

      let spread = 0.008;
      if (!isGrounded) spread = 0.045;
      else if (direction.lengthSq() > 0.1) spread = 0.018;
      const sx = (Math.random() - 0.5) * spread, sy = (Math.random() - 0.5) * spread;
      camera.rotation.x += 0.015 + Math.random() * 0.01 + sy;
      camera.rotation.y += sx;
      if (weaponGroup) { weaponGroup.position.z += 0.05; weaponGroup.rotation.x += 0.035; }
      if (muzzleFlash) { muzzleFlash.material.opacity = 0.95; flashTimer = 0.06; }

      const raycaster = new THREE.Raycaster();
      const dir = new THREE.Vector3(sx * 8, sy * 8, -1).normalize();
      dir.applyQuaternion(camera.quaternion);
      raycaster.set(camera.getWorldPosition(new THREE.Vector3()), dir);

      const botMeshes = [];
      bots.forEach(b => b.traverse(c => { if (c.isMesh) botMeshes.push(c); }));
      const hits = raycaster.intersectObjects(botMeshes, false);
      if (hits.length) {
        let bot = hits[0].object;
        while (bot.parent && !bots.includes(bot)) bot = bot.parent;
        if (bots.includes(bot)) {
          let dmg = 35;
          const part = hits[0].object.name || '';
          if (part === 'head') dmg = 100;
          else if (part === 'body') dmg = 30 + Math.floor(Math.random() * 20);
          else dmg = 20 + Math.floor(Math.random() * 11);
          bot.userData.hp -= dmg;
          createDecal(hits[0].point, hits[0].face ? hits[0].face.normal : new THREE.Vector3(0,1,0));
          document.getElementById('hitmarker').classList.add('show'); hitmarkerTimer = 0.18;
          if (bot.userData.hp <= 0) {
            scene.remove(bot); bots = bots.filter(b => b !== bot); kills++;
            addKillFeed(PLAYER_NICK, bot.userData.nick);
          }
        }
        return;
      }
      const worldHits = raycaster.intersectObjects(scene.children, true);
      for (let h of worldHits) {
        if (h.object === weaponGroup || (h.object.parent && h.object.parent === weaponGroup)) continue;
        if (h.object.type === 'GridHelper') continue;
        createDecal(h.point, h.face ? h.face.normal : new THREE.Vector3(0,1,0)); break;
      }
    }

    function startReload() {
      if (isReloading || ammoInMag === MAG_SIZE || ammoReserve <= 0) return;
      isReloading = true;
      setTimeout(() => {
        const need = MAG_SIZE - ammoInMag, take = Math.min(need, ammoReserve);
        ammoInMag += take; ammoReserve -= take; isReloading = false; updateAmmoUI();
      }, 1400);
    }
    function updateAmmoUI() { document.getElementById('ammo-display').innerHTML = ammoInMag + ' <span>/ ' + ammoReserve + '</span>'; }

    function createDecal(pos, normal) {
      const m = new THREE.Mesh(new THREE.CircleGeometry(0.07, 7), new THREE.MeshBasicMaterial({ color: 0x111, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide }));
      m.position.copy(pos); m.position.addScaledVector(normal, 0.012); m.lookAt(pos.clone().add(normal));
      scene.add(m); decals.push({ mesh: m, life: 1.8 });
    }
    function addKillFeed(killer, victim) {
      const d = document.createElement('div'); d.className = 'kill-line';
      d.innerHTML = '<span class="killer">' + killer + '</span><span class="icon">✕</span><span class="victim">' + victim + '</span>';
      document.getElementById('kill-feed').appendChild(d);
      setTimeout(() => d.remove(), 4200);
    }

    function update(dt) {
      if (isShooting) tryShoot();
      direction.set(0, 0, 0);
      if (moveForward) direction.z -= 1; if (moveBackward) direction.z += 1;
      if (moveLeft) direction.x -= 1; if (moveRight) direction.x += 1;
      direction.x += joyX; direction.z -= joyY;
      if (direction.lengthSq() > 0) direction.normalize();
      const speed = isCrouching ? CROUCH_SPEED : WALK_SPEED;
      const yaw = camera.rotation.y;
      velocity.x -= velocity.x * 10 * dt; velocity.z -= velocity.z * 10 * dt;
      velocity.x += (direction.x * Math.cos(yaw) + direction.z * Math.sin(yaw)) * speed * 12 * dt;
      velocity.z += (direction.z * Math.cos(yaw) - direction.x * Math.sin(yaw)) * speed * 12 * dt;
      velocity.y -= GRAVITY * dt;
      camera.position.x += velocity.x * dt; camera.position.y += velocity.y * dt; camera.position.z += velocity.z * dt;

      const pr = 0.35, ph = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
      for (const c of colliders) {
        if (camera.position.y + 0.2 < c.minY || camera.position.y - ph > c.maxY) continue;
        const cx = Math.max(c.minX, Math.min(camera.position.x, c.maxX));
        const cz = Math.max(c.minZ, Math.min(camera.position.z, c.maxZ));
        const dx = camera.position.x - cx, dz = camera.position.z - cz, dsq = dx*dx + dz*dz;
        if (dsq < pr*pr) {
          const d = Math.sqrt(dsq) || 0.0001, push = (pr - d) / d;
          camera.position.x += dx * push; camera.position.z += dz * push; velocity.x *= 0.3; velocity.z *= 0.3;
        }
      }
      const th = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
      if (camera.position.y < th) { camera.position.y = th; velocity.y = 0; canJump = true; isGrounded = true; }
      else isGrounded = false;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -42, 42);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -42, 42);

      if (weaponGroup) {
        const mov = direction.lengthSq() > 0.05;
        weaponBobTime += dt * (mov ? 9.5 : 2.5);
        weaponGroup.position.x = 0.15 + Math.sin(weaponBobTime) * (mov ? 0.012 : 0.003);
        weaponGroup.position.y = -0.15 + Math.cos(weaponBobTime * 2) * (mov ? 0.01 : 0.002);
        weaponGroup.position.z *= 0.85; weaponGroup.rotation.x *= 0.85;
      }
      if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0 && muzzleFlash) muzzleFlash.material.opacity = 0; }
      if (hitmarkerTimer > 0) { hitmarkerTimer -= dt; if (hitmarkerTimer <= 0) document.getElementById('hitmarker').classList.remove('show'); }
      for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life -= dt;
        if (decals[i].life <= 0) { scene.remove(decals[i].mesh); decals.splice(i, 1); }
        else decals[i].mesh.material.opacity = Math.min(0.8, decals[i].life * 0.5);
      }
      updateBots(dt);
      document.getElementById('hp-bar-fill').style.width = playerHP + '%';
      document.getElementById('hp-text').textContent = Math.ceil(playerHP) + ' HP';
    }

    function updateBots(dt) {
      for (const bot of bots) {
        const to = new THREE.Vector3(camera.position.x - bot.position.x, 0, camera.position.z - bot.position.z);
        const dist = to.length();
        if (dist > 2.8) {
          to.normalize();
          bot.position.x += to.x * bot.userData.speed * dt;
          bot.position.z += to.z * bot.userData.speed * dt;
          bot.lookAt(camera.position.x, bot.position.y + 1, camera.position.z);
        }
        bot.userData.attackCooldown -= dt;
        if (dist < 2.6 && bot.userData.attackCooldown <= 0) {
          playerHP = Math.max(0, playerHP - 6);
          bot.userData.attackCooldown = 0.9;
          if (playerHP <= 0) {
            playerHP = 100; camera.position.set(0, STAND_HEIGHT, 8);
            addKillFeed(bot.userData.nick, PLAYER_NICK);
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      renderer.render(scene, camera);
      frameCount++;
      const now = performance.now();
      if (now - lastFpsUpdate > 500) {
        currentFps = frameCount * 2; frameCount = 0; lastFpsUpdate = now;
        document.getElementById('debug-panel').textContent = 'FPS: ' + currentFps + ' | Боты: ' + bots.length + ' | Киллы: ' + kills;
      }
    }
  </script>
</body>
