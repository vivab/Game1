<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline FPS — Каркас</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
    #game-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ===== UI ===== */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.85);
    }
    #crosshair::before { width: 2px; height: 18px; left: 8px; top: 0; }
    #crosshair::after  { width: 18px; height: 2px; left: 0; top: 8px; }

    #hp-bar {
      position: absolute; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      width: 220px; height: 18px;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 4px; overflow: hidden; z-index: 10;
    }
    #hp-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #c0392b, #e74c3c);
      transition: width 0.15s;
    }

    #ammo {
      position: absolute; bottom: 28px; right: 24px;
      color: #fff; font: 700 22px/1 'Segoe UI', system-ui, sans-serif;
      text-shadow: 0 2px 4px #000; z-index: 10;
    }

    #debug {
      position: absolute; top: 12px; left: 12px;
      color: #0f0; font: 13px/1.4 monospace;
      background: rgba(0,0,0,0.45); padding: 6px 10px;
      border-radius: 4px; z-index: 10; pointer-events: none;
    }

    /* Мобильные кнопки */
    #btn-jump, #btn-crouch, #btn-shoot {
      position: absolute; width: 64px; height: 64px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.45); color: #fff;
      font: 700 14px/64px system-ui, sans-serif; text-align: center;
      z-index: 20; touch-action: none;
    }
    #btn-jump   { bottom: 110px; right: 28px; }
    #btn-crouch { bottom: 40px;  right: 28px; }
    #btn-shoot  { bottom: 40px;  right: 110px; width: 78px; height: 78px; line-height: 78px; font-size: 16px; background: rgba(180,40,40,0.55); }

    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 140px; height: 140px; z-index: 20;
    }

    #info {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; text-align: center; z-index: 30;
      background: rgba(0,0,0,0.7); padding: 24px 32px;
      border-radius: 12px; max-width: 90%;
      font: 16px/1.5 system-ui, sans-serif;
    }
    #info button {
      margin-top: 16px; padding: 10px 28px;
      font-size: 16px; border: none; border-radius: 8px;
      background: #2ecc71; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="crosshair"></div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="ammo">30 / 90</div>
    <div id="debug">FPS: —</div>

    <div id="joystick-zone"></div>
    <div id="btn-jump">ПРЫЖ</div>
    <div id="btn-crouch">СЕСТ</div>
    <div id="btn-shoot">ОГОНЬ</div>

    <div id="info">
      <b>Offline FPS — Каркас v0.1</b><br><br>
      Управление (ПК): WASD + мышь<br>
      Пробел — прыжок, C — присед, ЛКМ — стрельба<br><br>
      На телефоне: джойстик + кнопки<br><br>
      <button id="start-btn">НАЧАТЬ</button>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Простой джойстик -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

  <script>
    // ============================================================
    //  OFFLINE FPS — БАЗОВЫЙ КАРКАС
    //  Можно открывать прямо на телефоне или через GitHub Pages
    // ============================================================

    let scene, camera, renderer, clock;
    let player, velocity, direction;
    let canJump = false, isCrouching = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isLocked = false;
    let weapon, weaponBob = 0;
    let bullets = [];
    let decals = [];
    let bots = [];
    let hp = 100;
    let ammo = 30, reserve = 90;
    let lastShot = 0;
    let joyData = { x: 0, y: 0 };

    const GRAVITY = 28;
    const SPEED = 7.5;
    const JUMP_FORCE = 10.5;
    const PLAYER_HEIGHT = 1.7;
    const CROUCH_HEIGHT = 1.1;

    // ---------- Инициализация ----------
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, PLAYER_HEIGHT, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      clock = new THREE.Clock();
      velocity = new THREE.Vector3();
      direction = new THREE.Vector3();

      // Свет
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.85);
      dir.position.set(30, 50, 20);
      dir.castShadow = true;
      dir.shadow.mapSize.set(1024, 1024);
      scene.add(dir);

      createWorld();
      createWeapon();
      createBots();
      setupControls();
      setupMobile();

      window.addEventListener('resize', onResize);
      animate();
    }

    // ---------- Мир (простая карта) ----------
    function createWorld() {
      // Пол
      const floorGeo = new THREE.PlaneGeometry(80, 80);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x5a5a5a, roughness: 0.9 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Стены (коробка)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.85 });
      const wallH = 6;
      const wallT = 1;

      function wall(w, h, d, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
        return m;
      }

      wall(80, wallH, wallT, 0, wallH/2, -40);   // север
      wall(80, wallH, wallT, 0, wallH/2,  40);   // юг
      wall(wallT, wallH, 80, -40, wallH/2, 0);   // запад
      wall(wallT, wallH, 80,  40, wallH/2, 0);   // восток

      // Несколько укрытий
      wall(4, 2.2, 1.2, -12, 1.1, -8);
      wall(1.2, 2.2, 5,  8, 1.1, 10);
      wall(6, 1.4, 1.2, 0, 0.7, 18);
      wall(3, 3, 3, -18, 1.5, 15);

      // Небо / ambient
      scene.add(new THREE.AmbientLight(0x404040, 0.4));
    }

    // ---------- Оружие (простое, от 1 лица) ----------
    function createWeapon() {
      weapon = new THREE.Group();

      // Ствол
      const barrel = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.08, 0.55),
        new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 })
      );
      barrel.position.set(0.18, -0.18, -0.45);
      weapon.add(barrel);

      // Рукоятка
      const grip = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.22, 0.12),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      grip.position.set(0.18, -0.32, -0.15);
      weapon.add(grip);

      // Магазин
      const mag = new THREE.Mesh(
        new THREE.BoxGeometry(0.07, 0.16, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
      );
      mag.position.set(0.18, -0.28, -0.28);
      weapon.add(mag);

      camera.add(weapon);
      scene.add(camera);
    }

    // ---------- Боты (очень простые пока) ----------
    function createBots() {
      const botGeo = new THREE.CapsuleGeometry(0.35, 1.0, 4, 8);
      const botMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });

      for (let i = 0; i < 4; i++) {
        const bot = new THREE.Mesh(botGeo, botMat);
        bot.position.set(
          (Math.random() - 0.5) * 50,
          1.0,
          (Math.random() - 0.5) * 50
        );
        bot.castShadow = true;
        bot.userData = { hp: 100, speed: 2.2 + Math.random() };
        scene.add(bot);
        bots.push(bot);
      }
    }

    // ---------- Управление ----------
    function setupControls() {
      document.addEventListener('keydown', e => {
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (canJump) { velocity.y = JUMP_FORCE; canJump = false; } break;
          case 'KeyC': toggleCrouch(true); break;
        }
      });
      document.addEventListener('keyup', e => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
          case 'KeyC': toggleCrouch(false); break;
        }
      });

      // Мышь (ПК)
      renderer.domElement.addEventListener('click', () => {
        if (!isLocked) renderer.domElement.requestPointerLock();
      });
      document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === renderer.domElement;
      });
      document.addEventListener('mousemove', e => {
        if (!isLocked) return;
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
      });

      // Стрельба (ПК)
      document.addEventListener('mousedown', e => {
        if (e.button === 0 && isLocked) shoot();
      });
    }

    function setupMobile() {
      // Джойстик
      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '70px', bottom: '70px' },
        color: 'white',
        size: 110
      });
      manager.on('move', (evt, data) => {
        const f = Math.min(data.force, 1);
        joyData.x = Math.cos(data.angle.radian) * f;
        joyData.y = Math.sin(data.angle.radian) * f;
      });
      manager.on('end', () => { joyData.x = 0; joyData.y = 0; });

      // Кнопки
      const jumpBtn = document.getElementById('btn-jump');
      const crouchBtn = document.getElementById('btn-crouch');
      const shootBtn = document.getElementById('btn-shoot');

      jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); if (canJump) { velocity.y = JUMP_FORCE; canJump = false; } });
      crouchBtn.addEventListener('touchstart', e => { e.preventDefault(); toggleCrouch(true); });
      crouchBtn.addEventListener('touchend',   e => { e.preventDefault(); toggleCrouch(false); });
      shootBtn.addEventListener('touchstart', e => { e.preventDefault(); shoot(); });

      // Взгляд пальцем (свайп по экрану)
      let lastTouchX = 0, lastTouchY = 0;
      renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', e => {
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - lastTouchX;
          const dy = e.touches[0].clientY - lastTouchY;
          camera.rotation.y -= dx * 0.005;
          camera.rotation.x -= dy * 0.005;
          camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x));
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });
    }

    function toggleCrouch(down) {
      isCrouching = down;
    }

    // ---------- Стрельба + следы ----------
    function shoot() {
      const now = performance.now();
      if (now - lastShot < 110 || ammo <= 0) return;
      lastShot = now;
      ammo--;
      document.getElementById('ammo').textContent = `${ammo} / ${reserve}`;

      // Отдача
      camera.rotation.x += 0.012;
      weapon.position.z += 0.04;

      // Луч
      const ray = new THREE.Raycaster();
      const center = new THREE.Vector2(0, 0);
      ray.setFromCamera(center, camera);

      // Сначала боты
      const botHits = ray.intersectObjects(bots);
      if (botHits.length > 0) {
        const bot = botHits[0].object;
        bot.userData.hp -= 34;
        if (bot.userData.hp <= 0) {
          scene.remove(bot);
          bots = bots.filter(b => b !== bot);
        }
        createDecal(botHits[0].point, botHits[0].face.normal);
        return;
      }

      // Стены / пол
      const hits = ray.intersectObjects(scene.children, true);
      for (const hit of hits) {
        if (hit.object === weapon || hit.object.parent === weapon) continue;
        createDecal(hit.point, hit.face ? hit.face.normal : new THREE.Vector3(0,1,0));
        break;
      }
    }

    function createDecal(pos, normal) {
      const geo = new THREE.CircleGeometry(0.07, 8);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x111111,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const decal = new THREE.Mesh(geo, mat);
      decal.position.copy(pos);
      decal.position.addScaledVector(normal, 0.01);
      decal.lookAt(pos.clone().add(normal));
      scene.add(decal);
      decals.push({ mesh: decal, life: 1.6 });
    }

    // ---------- Обновление ----------
    function update(dt) {
      // Движение
      direction.set(0, 0, 0);

      // Клавиатура
      if (moveForward)  direction.z -= 1;
      if (moveBackward) direction.z += 1;
      if (moveLeft)     direction.x -= 1;
      if (moveRight)    direction.x += 1;

      // Джойстик
      direction.x += joyData.x;
      direction.z -= joyData.y;

      direction.normalize();

      const speed = isCrouching ? SPEED * 0.45 : SPEED;
      const angle = camera.rotation.y;

      velocity.x -= velocity.x * 8 * dt;
      velocity.z -= velocity.z * 8 * dt;

      velocity.x += direction.x * speed * dt * Math.cos(angle) + direction.z * speed * dt * Math.sin(angle);
      velocity.z += direction.z * speed * dt * Math.cos(angle) - direction.x * speed * dt * Math.sin(angle);

      // Гравитация
      velocity.y -= GRAVITY * dt;

      camera.position.x += velocity.x * dt;
      camera.position.y += velocity.y * dt;
      camera.position.z += velocity.z * dt;

      // Пол
      const targetH = isCrouching ? CROUCH_HEIGHT : PLAYER_HEIGHT;
      if (camera.position.y < targetH) {
        velocity.y = 0;
        camera.position.y = targetH;
        canJump = true;
      }

      // Простые границы карты
      camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
      camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

      // Покачивание оружия
      const moving = direction.length() > 0.1;
      weaponBob += dt * (moving ? 10 : 3);
      weapon.position.x = 0.18 + Math.sin(weaponBob) * (moving ? 0.012 : 0.004);
      weapon.position.y = -0.22 + Math.cos(weaponBob * 2) * (moving ? 0.01 : 0.003);
      weapon.position.z *= 0.85; // возврат после отдачи

      // Декали (следы от пуль)
      for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life -= dt;
        if (decals[i].life <= 0) {
          scene.remove(decals[i].mesh);
          decals.splice(i, 1);
        } else {
          decals[i].mesh.material.opacity = Math.min(0.85, decals[i].life);
        }
      }

      // Боты — простое преследование
      bots.forEach(bot => {
        const toPlayer = new THREE.Vector3().subVectors(camera.position, bot.position);
        toPlayer.y = 0;
        if (toPlayer.length() > 2.5) {
          toPlayer.normalize();
          bot.position.addScaledVector(toPlayer, bot.userData.speed * dt);
          bot.lookAt(camera.position.x, bot.position.y, camera.position.z);
        }
      });

      // HP бар
      document.getElementById('hp-fill').style.width = hp + '%';
    }

    // ---------- Цикл ----------
    let frames = 0, lastFps = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      renderer.render(scene, camera);

      frames++;
      if (performance.now() - lastFps > 500) {
        document.getElementById('debug').textContent = `FPS: ${frames * 2} | Боты: ${bots.length} | Следы: ${decals.length}`;
        frames = 0;
        lastFps = performance.now();
      }
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Старт
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('info').style.display = 'none';
      init();
    });
  </script>
</body>
</html>
