<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS 1.6 WebGL Mobile - 5v5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
        
        /* UI HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; z-index: 2;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.85);
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        .hud-panel {
            background: rgba(15, 20, 25, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px; border-radius: 8px; color: #fff; font-size: 14px; font-weight: bold;
            backdrop-filter: blur(4px);
        }
        #top-bar { display: flex; justify-content: space-between; align-items: center; }
        #bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .ct-color { color: #4b8bf5; }
        .t-color { color: #e54d4d; }

        #kill-feed {
            position: absolute; top: 60px; right: 15px; text-align: right; font-size: 13px;
            color: #fff; text-shadow: 1px 1px 2px #000; display: flex; flex-direction: column; gap: 4px;
        }

        /* Android Touch Controls */
        #touch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none; touch-action: none;
        }
        
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto; touch-action: none;
        }
        #joystick-thumb {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.5); pointer-events: none;
        }

        .touch-btn {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4); color: #fff; font-weight: bold; font-size: 13px;
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
            touch-action: none; backdrop-filter: blur(2px);
        }
        .touch-btn:active { background: rgba(255, 255, 255, 0.5); }
        
        #btn-fire { bottom: 60px; right: 25px; width: 75px; height: 75px; background: rgba(231, 76, 60, 0.5); border-color: #e74c3c; font-size: 15px; }
        #btn-jump { bottom: 150px; right: 25px; width: 60px; height: 60px; }
        #btn-crouch { bottom: 60px; right: 115px; width: 60px; height: 60px; }
        #btn-reload { bottom: 150px; right: 115px; width: 60px; height: 60px; }

        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; z-index: 10; text-align: center; padding: 20px;
        }
        #blocker h1 { font-size: 28px; margin-bottom: 12px; text-transform: uppercase; }
        #blocker p { font-size: 15px; color: #ccc; margin-top: 6px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="top-bar">
            <div class="hud-panel"><span class="ct-color">CT: <span id="ct-count">5</span></span></div>
            <div class="hud-panel"><span id="match-timer">01:45</span></div>
            <div class="hud-panel"><span class="t-color">T: <span id="t-count">5</span></span></div>
        </div>
        <div id="kill-feed"></div>
        <div id="bottom-bar">
            <div class="hud-panel">HP: <span id="health-val" style="color:#2ecc71;">100</span></div>
            <div class="hud-panel">Состояние: <span id="state-val" style="color:#f39c12;">Стоит</span></div>
            <div class="hud-panel">Патроны: <span id="ammo-val">30</span> / ∞</div>
        </div>
    </div>

    <!-- Сенсорные кнопки Андроид -->
    <div id="touch-overlay">
        <div id="joystick-container">
            <div id="joystick-thumb"></div>
        </div>
        <div id="btn-fire" class="touch-btn">🔥</div>
        <div id="btn-jump" class="touch-btn">🦘</div>
        <div id="btn-crouch" class="touch-btn">🧎</div>
        <div id="btn-reload" class="touch-btn">🔄</div>
    </div>

    <div id="blocker">
        <h1>Нажмите для старта</h1>
        <p>📱 Управление на Android: Левый джойстик — Бег | Правая часть экрана — Обзор</p>
        <p>Кнопки на экране: Огонь, Прыжок, Присесть, Перезарядка</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // === ОСНОВНЫЕ ПЕРЕМЕННЫЕ ===
        let scene, camera, renderer;
        let yaw = 0, pitch = 0; // Вращение камеры
        let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;

        // Движение
        let moveDir = { x: 0, y: 0 };
        let isCrouching = false, isJumping = false;
        let velocityY = 0;

        let playerHealth = 100;
        let ammo = 30;
        let isReloading = false;

        const mapObjects = [];
        const characters = [];
        const raycaster = new THREE.Raycaster();

        const STAND_HEIGHT = 1.7;
        const CROUCH_HEIGHT = 1.0;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xb5c9df);
            scene.fog = new THREE.FogExp2(0xb5c9df, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            camera.position.y = STAND_HEIGHT;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xdbe3ed, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e0, 0.9);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const blocker = document.getElementById('blocker');
            blocker.addEventListener('click', () => { blocker.style.display = 'none'; });
            blocker.addEventListener('touchstart', () => { blocker.style.display = 'none'; });

            setupTouchControls();
            setupKeyboardFallback();
            buildMap();
            spawnTeams();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // === СЕНСОРНОЕ УПРАВЛЕНИЕ ДЛЯ АНДРОИД ===
        function setupTouchControls() {
            const joyContainer = document.getElementById('joystick-container');
            const joyThumb = document.getElementById('joystick-thumb');
            let joyTouchId = null;

            // 1. Виртуальный джойстик
            joyContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (joyTouchId === null) {
                        joyTouchId = t.identifier;
                        updateJoystick(t);
                    }
                }
            }, { passive: false });

            joyContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) updateJoystick(t);
                }
            }, { passive: false });

            function resetJoystick() {
                joyTouchId = null;
                joyThumb.style.transform = 'translate(0px, 0px)';
                moveDir.x = 0; moveDir.y = 0;
            }

            joyContainer.addEventListener('touchend', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) resetJoystick();
                }
            });
            joyContainer.addEventListener('touchcancel', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === joyTouchId) resetJoystick();
                }
            });

            function updateJoystick(touch) {
                const rect = joyContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const maxRadius = 40;
                const dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joyThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                moveDir.x = dx / maxRadius;  // Влево / Вправо
                moveDir.y = -dy / maxRadius; // Вперед / Назад
            }

            // 2. Поворот камеры свайпом по правой части экрана
            document.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2 && lookTouchId === null) {
                        if (!t.target.classList.contains('touch-btn')) {
                            lookTouchId = t.identifier;
                            lastTouchX = t.clientX;
                            lastTouchY = t.clientY;
                        }
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === lookTouchId) {
                        const deltaX = t.clientX - lastTouchX;
                        const deltaY = t.clientY - lastTouchY;
                        lastTouchX = t.clientX;
                        lastTouchY = t.clientY;

                        const sens = 0.004;
                        yaw -= deltaX * sens;
                        pitch -= deltaY * sens;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                        camera.rotation.y = yaw;
                        camera.rotation.x = pitch;
                    }
                }
            });

            const clearLookTouch = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === lookTouchId) lookTouchId = null;
                }
            };
            document.addEventListener('touchend', clearLookTouch);
            document.addEventListener('touchcancel', clearLookTouch);

            // 3. Сенсорные кнопки
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isJumping) { velocityY = 8.5; isJumping = true; }
            });
            document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { e.preventDefault(); isCrouching = true; });
            document.getElementById('btn-crouch').addEventListener('touchend', (e) => { e.preventDefault(); isCrouching = false; });
            document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); reloadAmmo(); });
        }

        // Поддержка ПК клавиатуры (чтобы можно было тестировать везде)
        function setupKeyboardFallback() {
            let keys = {};
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'Space' && !isJumping) { velocityY = 8.5; isJumping = true; }
                if (e.code === 'KeyC' || e.code === 'ControlLeft') isCrouching = true;
                if (e.code === 'KeyR') reloadAmmo();
            });
            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'KeyC' || e.code === 'ControlLeft') isCrouching = false;
            });

            // Корректировка джойстика от клавиш WASD
            setInterval(() => {
                if (lookTouchId === null) {
                    let kx = 0, ky = 0;
                    if (keys['KeyW']) ky += 1;
                    if (keys['KeyS']) ky -= 1;
                    if (keys['KeyA']) kx -= 1;
                    if (keys['KeyD']) kx += 1;
                    if (kx !== 0 || ky !== 0) { moveDir.x = kx; moveDir.y = ky; }
                }
            }, 20);
        }

        // === ПОСТРОЕНИЕ КАРТЫ ===
        function buildMap() {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x999285, roughness: 0.8 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd1c7b7, roughness: 0.6 });
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xad7d52, roughness: 0.5 });

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallGeo = new THREE.BoxGeometry(80, 6, 2);
            [
                [0, 3, -40, 0], [0, 3, 40, 0],
                [-40, 3, 0, Math.PI / 2], [40, 3, 0, Math.PI / 2]
            ].forEach(w => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(w[0], w[1], w[2]);
                wall.rotation.y = w[3];
                scene.add(wall);
                mapObjects.push(wall);
            });

            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            [[-10, 1.5, -10], [10, 1.5, -10], [-10, 1.5, 10], [10, 1.5, 10], [0, 1.5, -18], [0, 1.5, 18]].forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                mapObjects.push(box);
            });
        }

        // === СОЗДАНИЕ МОДЕЛЕЙ CS 1.6 ===
        function createCharacterModel(team) {
            const group = new THREE.Group();
            const isCT = team === 'CT';
            const bodyMat = new THREE.MeshStandardMaterial({ color: isCT ? 0x2b3e55 : 0x5c4228 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: isCT ? 0x1f2a38 : 0x3d352b });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), isCT ? new THREE.MeshStandardMaterial({ color: 0x222222 }) : skinMat);
            head.position.y = 1.6; head.name = "head"; group.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.3), bodyMat);
            torso.position.y = 1.1; torso.name = "torso"; group.add(torso);

            const armGeo = new THREE.BoxGeometry(0.18, 0.55, 0.18);
            const leftArm = new THREE.Mesh(armGeo, bodyMat); leftArm.position.set(-0.38, 1.1, 0); leftArm.name = "arm"; group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, bodyMat); rightArm.position.set(0.38, 1.1, 0); rightArm.name = "arm"; group.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.22, 0.7, 0.22);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.16, 0.35, 0); leftLeg.name = "leg"; group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.16, 0.35, 0); rightLeg.name = "leg"; group.add(rightLeg);

            group.userData = { leftLeg, rightLeg, leftArm, rightArm, team, health: 100, isDead: false, animTime: Math.random() * 10 };
            return group;
        }

        function spawnTeams() {
            [[-5,0,-30], [-2.5,0,-30], [2.5,0,-30], [5,0,-30]].forEach(p => {
                const b = createCharacterModel('CT'); b.position.set(...p); scene.add(b); characters.push(b);
            });
            [[-10,0,30], [-5,0,30], [0,0,30], [5,0,30], [10,0,30]].forEach(p => {
                const b = createCharacterModel('T'); b.position.set(...p); scene.add(b); characters.push(b);
            });
        }

        function reloadAmmo() {
            if (isReloading || ammo === 30) return;
            isReloading = true;
            document.getElementById('ammo-val').innerText = "Перезарядка...";
            setTimeout(() => { ammo = 30; isReloading = false; document.getElementById('ammo-val').innerText = ammo; }, 1500);
        }

        // === ВЫСТРЕЛ И УРОН БЕЗ СТРЕЛЬБЫ СКВОЗЬ СТЕНЫ ===
        function shoot() {
            if (ammo <= 0 || isReloading) { reloadAmmo(); return; }
            ammo--;
            document.getElementById('ammo-val').innerText = ammo;

            const spread = isCrouching ? 0.005 : (isJumping ? 0.05 : 0.018);
            const dir = new THREE.Vector3((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, -1).applyQuaternion(camera.quaternion).normalize();

            raycaster.set(camera.position, dir);

            const wallHits = raycaster.intersectObjects(mapObjects, false);
            let maxDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;

            const targets = [];
            characters.forEach(c => { if (!c.userData.isDead && c.userData.team === 'T') c.children.forEach(p => targets.push(p)); });

            const hits = raycaster.intersectObjects(targets, false);

            if (hits.length > 0 && hits[0].distance < maxDist) {
                const hit = hits[0];
                const part = hit.object;
                const char = part.parent;

                let damage = 0, name = "";
                if (part.name === "head") { damage = Math.floor(Math.random() * 6) + 95; name = "Голова 🎯"; }
                else if (part.name === "torso") { damage = Math.floor(Math.random() * 31) + 30; name = "Тело 👕"; }
                else if (part.name === "arm") { damage = Math.floor(Math.random() * 31) + 10; name = "Рука 🦾"; }
                else if (part.name === "leg") { damage = Math.floor(Math.random() * 11) + 10; name = "Нога 🦵"; }

                char.userData.health -= damage;
                showFeed(`Попадание: ${name} (-${damage} HP)`);

                if (char.userData.health <= 0 && !char.userData.isDead) {
                    char.userData.isDead = true;
                    char.rotation.x = -Math.PI / 2;
                    char.position.y = 0.2;
                    showFeed(`Враг уничтожен!`, true);
                    updateCounts();
                }
            }
        }

        function showFeed(msg, isKill = false) {
            const feed = document.getElementById('kill-feed');
            const el = document.createElement('div');
            el.innerText = msg;
            el.style.color = isKill ? '#e74c3c' : '#f1c40f';
            feed.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function updateCounts() {
            const tAlive = characters.filter(c => c.userData.team === 'T' && !c.userData.isDead).length;
            document.getElementById('t-count').innerText = tAlive;
        }

        // === ИГРОВОЙ ЦИКЛ ===
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            // Смена высоты приседания
            const targetHeight = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
            camera.position.y += (targetHeight - camera.position.y) * 12 * delta;

            // Перемещение персонажа
            const speed = (isCrouching ? 3.0 : 7.0) * delta;
            if (moveDir.x !== 0 || moveDir.y !== 0) {
                const forward = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw));

                camera.position.addScaledVector(forward, moveDir.y * speed);
                camera.position.addScaledVector(right, moveDir.x * speed);
            }

            // Прыжок и гравитация
            velocityY -= 25.0 * delta;
            camera.position.y += velocityY * delta;

            if (camera.position.y < targetHeight) {
                velocityY = 0;
                camera.position.y = targetHeight;
                isJumping = false;
            }

            document.getElementById('state-val').innerText = isJumping ? "В прыжке 🦘" : (isCrouching ? "Присел 🧎" : "Стоит 🧍");

            // Анимации конечностей ботов
            characters.forEach(c => {
                if (c.userData.isDead) return;
                c.userData.animTime += delta * 6;
                const swing = Math.sin(c.userData.animTime) * 0.5;
                c.userData.leftLeg.rotation.x = swing;
                c.userData.rightLeg.rotation.x = -swing;
                c.userData.leftArm.rotation.x = -swing * 0.8;
                c.userData.rightArm.rotation.x = swing * 0.8;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
