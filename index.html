<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Offline FPS v0.3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #game-container { width: 100%; height: 100%; position: relative; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; position: absolute; top: 0; left: 0; }

    #crosshair { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
    #crosshair .h, #crosshair .v { position: absolute; background: rgba(255,255,255,0.92); box-shadow: 0 0 2px #000; }
    #crosshair .h { width: 22px; height: 2px; top: 10px; left: 0; }
    #crosshair .v { width: 2px; height: 22px; top: 0; left: 10px; }
    #crosshair .dot { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; top: 9.5px; left: 9.5px; }

    #hitmarker { position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); pointer-events: none; z-index: 16; opacity: 0; transition: opacity 0.05s; }
    #hitmarker.show { opacity: 1; }
    #hitmarker .l1, #hitmarker .l2, #hitmarker .l3, #hitmarker .l4 { position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
    #hitmarker .l1 { width: 10px; height: 2px; top: 4px; left: 2px; transform: rotate(45deg); }
    #hitmarker .l2 { width: 10px; height: 2px; top: 4px; right: 2px; transform: rotate(-45deg); }
    #hitmarker .l3 { width: 10px; height: 2px; bottom: 4px; left: 2px; transform: rotate(-45deg); }
    #hitmarker .l4 { width: 10px; height: 2px; bottom: 4px; right: 2px; transform: rotate(45deg); }

    #hp-container { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 240px; z-index: 15; }
    #hp-bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    #hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #a00f0f, #e74c3c); transition: width 0.12s ease-out; }
    #hp-text { text-align: center; color: #fff; font-size: 12px; margin-top: 3px; text-shadow: 0 1px 2px #000; }

    #ammo-display { position: absolute; bottom: 24px; right: 20px; color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 6px #000; z-index: 15; letter-spacing: 1px; }
    #ammo-display span { font-size: 16px; opacity: 0.7; }

    #debug-panel { position: absolute; top: 10px; left: 10px; color: #0f0; font: 12px/1.45 monospace; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 4px; z-index: 15; pointer-events: none; min-width: 160px; }

    #kill-feed { position: absolute; top: 48px; left: 12px; text-align: left; z-index: 15; pointer-events: none; max-width: 70%; }
    #kill-feed .kill-line { color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; margin-bottom: 5px; opacity: 0.95; background: rgba(0,0,0,0.35); padding: 3px 8px; border-radius: 4px; display: inline-block; animation: fadeOut 4s forwards; }
    #kill-feed .killer { color: #7CFC00; font-weight: 600; }
    #kill-feed .victim { color: #ff6b6b; font-weight: 600; }
    #kill-feed .icon { color: #fff; margin: 0 5px; }
    @keyframes fadeOut { 0% { opacity: 0.95; } 70% { opacity: 0.95; } 100% { opacity: 0; } }

    #mobile-controls { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; pointer-events: auto; }
    .mobile-btn { position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(20,20,20,0.55); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
    #btn-jump { bottom: 120px; right: 24px; }
    #btn-crouch { bottom: 40px; right: 24px; }
    #btn-shoot { bottom: 40px; right: 110px; width: 82px; height: 82px; background: rgba(160, 30, 30, 0.65); border-color: rgba(255,100,100,0.5); font-size: 15px; }
    #btn-reload { bottom: 120px; right: 110px; width: 60px; height: 60px; font-size: 12px; }

    #start-screen { position: absolute; inset: 0; background: linear-gradient(160deg, #0d1117 0%, #161b22 50%, #0d1117 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; text-align: center; padding: 20px; }
    #start-screen h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: 1px; }
    #start-screen p { font-size: 14px; opacity: 0.75; margin-bottom: 6px; max-width: 320px; line-height: 1.5; }
    #start-btn { margin-top: 28px; padding: 14px 48px; font-size: 18px; font-weight: 700; border: none; border-radius: 10px; background: #238636; color: #fff; cursor: pointer; box-shadow: 0 4px 14px rgba(35,134,54,0.4); }
    #start-btn:active { transform: scale(0.97); }
    #error-box { display: none; margin-top: 20px; padding: 12px 16px; background: rgba(180,40,40,0.3); border: 1px solid #c0392b; border-radius: 8px; color: #ffaaaa; font-size: 13px; max-width: 90%; text-align: left; }

    #loading { position: absolute; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: #aaa; font-size: 15px; }
    #loading .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #2ecc71; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Загрузка движка...</div>
  </div>

  <div id="game-container" style="display:none;">
    <div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>
    <div id="hitmarker"><div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="l4"></div></div>

    <div id="hp-container">
      <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
      <div id="hp-text">100 HP</div>
    </div>

    <div id="ammo-display">30 <span>/ 90</span></div>
    <div id="debug-panel">FPS: --</div>
    <div id="kill-feed"></div>

    <div id="mobile-controls">
      <div id="joystick-zone"></div>
      <div class="mobile-btn" id="btn-jump">ПРЫГ</div>
      <div class="mobile-btn" id="btn-crouch">СЕСТ</div>
      <div class="mobile-btn" id="btn-shoot">ОГОНЬ</div>
      <div class="mobile-btn" id="btn-reload">R</div>
    </div>

    <div id="start-screen">
      <h1>OFFLINE FPS</h1>
      <p>Каркас v0.3</p>
      <p>WASD + мышь / джойстик + кнопки</p>
      <p>Пробел — прыжок · C — присед · R — перезарядка</p>
      <button id="start-btn">НАЧАТЬ ИГРУ</button>
      <div id="error-box"></div>
    </div>
  </div>

  <script>
    let THREE;
    let scene, camera, renderer, clock;
    let velocity, direction;
    let canJump = true;
    let isCrouching = false;
    let crouchTouchId = null;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isPointerLocked = false;
    let weaponGroup = null;
    let weaponBobTime = 0;
    let decals = [];
    let bots = [];
    let playerHP = 100;
    let ammoInMag = 30;
    let ammoReserve = 90;
    let isReloading = false;
    let lastShotTime = 0;
    let joyX = 0, joyY = 0;
    let gameStarted = false;
    let frameCount = 0;
    let lastFpsUpdate = 0;
    let currentFps = 0;
    let kills = 0;
    let muzzleFlash = null;
    let flashTimer = 0;
    let colliders = [];
    let hitmarkerTimer = 0;
    let botIdCounter = 1;

    const GRAVITY = 32;
    const WALK_SPEED = 8.0;
    const CROUCH_SPEED = 3.6;
    const JUMP_SPEED = 11.0;
    const STAND_HEIGHT = 1.65;
    const CROUCH_HEIGHT = 1.05;
    const MOUSE_SENS = 0.0022;
    const TOUCH_SENS = 0.0045;
    const FIRE_RATE = 95;
    const MAG_SIZE = 30;
    const PLAYER_NICK = 'You';

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Не удалось загрузить: ' + src));
        document.head.appendChild(s);
      });
    }

    async function boot() {
      const loadingEl = document.getElementById('loading');
      const gameEl = document.getElementById('game-container');
      try {
        try {
          await loadScript('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js');
        } catch (e1) {
          await loadScript('https://unpkg.com/three@0.160.0/build/three.min.js');
        }
        THREE = window.THREE;
        if (!THREE) throw new Error('THREE не найден');

        try {
          await loadScript('https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js');
        } catch (e2) {}

        loadingEl.style.display = 'none';
        gameEl.style.display = 'block';

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('start-btn').addEventListener('touchend', function(e) {
          e.preventDefault(); startGame();
        });
      } catch (err) {
        loadingEl.innerHTML = '<div style="color:#ff6b6b;padding:20px;text-align:center;">Ошибка загрузки<br><br>' + err.message + '</div>';
      }
    }

    function startGame() {
      if (gameStarted) return;
      gameStarted = true;
      document.getElementById('start-screen').style.display = 'none';
      try {
        initScene();
        createWorld();
        createWeapon();
        createBots(5);
        setupInput();
        animate();
      } catch (err) {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').textContent = 'Ошибка: ' + err.message;
        document.getElementById('start-screen').style.display = 'flex';
        gameStarted = false;
      }
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87b8d8);
      scene.fog = new THREE.Fog(0x87b8d8, 35, 95);

      camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 180);
      camera.position.set(0, STAND_HEIGHT, 8);
      camera.rotation.order = 'YXZ';

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      document.getElementById('game-container').insertBefore(renderer.domElement, document.getElementById('game-container').firstChild);

      clock = new THREE.Clock();
      velocity = new THREE.Vector3();
      direction = new THREE.Vector3();

      scene.add(new THREE.AmbientLight(0x606060, 0.55));
      scene.add(new THREE.HemisphereLight(0xddeeff, 0x444422, 0.55));

      const sun = new THREE.DirectionalLight(0xfff4e0, 1.05);
      sun.position.set(25, 45, 15);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.near = 5; sun.shadow.camera.far = 120;
      sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
      sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
      scene.add(sun);

      window.addEventListener('resize', onWindowResize);
    }
        function createWorld() {
      colliders = [];
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(90, 90),
        new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.92 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(90, 45, 0x333333, 0x2a2a2a);
      grid.position.y = 0.01;
      scene.add(grid);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a6a55, roughness: 0.88 });

      function makeWall(w, h, d, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh);
        colliders.push({
          minX: x - w/2, maxX: x + w/2,
          minY: y - h/2, maxY: y + h/2,
          minZ: z - d/2, maxZ: z + d/2
        });
      }

      const H = 5.5;
      makeWall(90, H, 1.2, 0, H/2, -45);
      makeWall(90, H, 1.2, 0, H/2, 45);
      makeWall(1.2, H, 90, -45, H/2, 0);
      makeWall(1.2, H, 90, 45, H/2, 0);
      makeWall(5, 2.0, 1.4, -14, 1.0, -10);
      makeWall(1.4, 2.0, 6, 10, 1.0, 8);
      makeWall(7, 1.3, 1.4, 0, 0.65, 20);
      makeWall(3.5, 3.2, 3.5, -20, 1.6, 18);
      makeWall(2.2, 1.8, 2.2, 16, 0.9, -15);
      makeWall(8, 1.1, 1.3, -5, 0.55, -22);

      for (let i = 0; i < 4; i++) {
        const cx = -25 + i * 16;
        const col = new THREE.Mesh(
          new THREE.CylinderGeometry(0.55, 0.65, 4.5, 10),
          new THREE.MeshStandardMaterial({ color: 0x6b5b4b, roughness: 0.85 })
        );
        col.position.set(cx, 2.25, -30);
        col.castShadow = true; col.receiveShadow = true;
        scene.add(col);
        colliders.push({ minX: cx-0.7, maxX: cx+0.7, minY: 0, maxY: 4.5, minZ: -30.7, maxZ: -29.3 });
      }
    }

    // Оружие в стиле AK
    function createWeapon() {
      weaponGroup = new THREE.Group();
      const metal = new THREE.MeshStandardMaterial({ color: 0x2c2c2c, roughness: 0.4, metalness: 0.7 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.5 });
      const wood = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.85, metalness: 0.05 });

      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, 0.72, 8), metal);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0.25, -0.15, -0.55);
      weaponGroup.add(barrel);

      const gas = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.35, 6), dark);
      gas.rotation.x = Math.PI / 2;
      gas.position.set(0.25, -0.08, -0.35);
      weaponGroup.add(gas);

      const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.32), wood);
      handguard.position.set(0.25, -0.16, -0.28);
      weaponGroup.add(handguard);

      const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.28), metal);
      receiver.position.set(0.25, -0.14, -0.02);
      weaponGroup.add(receiver);

      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.1), dark);
      mag.position.set(0.25, -0.32, -0.08);
      mag.rotation.x = 0.15;
      weaponGroup.add(mag);

      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.2, 0.09), wood);
      grip.position.set(0.25, -0.30, 0.08);
      grip.rotation.x = 0.35;
      weaponGroup.add(grip);

      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.28), wood);
      stock.position.set(0.25, -0.14, 0.28);
      weaponGroup.add(stock);

      const stockLow = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.08), wood);
      stockLow.position.set(0.25, -0.22, 0.38);
      weaponGroup.add(stockLow);

      const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.02), dark);
      frontSight.position.set(0.25, -0.05, -0.88);
      weaponGroup.add(frontSight);

      muzzleFlash = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0 })
      );
      muzzleFlash.position.set(0.25, -0.15, -0.95);
      weaponGroup.add(muzzleFlash);

      weaponGroup.position.set(0, -0.04, 0);
      camera.add(weaponGroup);
      scene.add(camera);
    }

    // Более человечные боты
    function createBotMesh(name) {
      const group = new THREE.Group();
      group.userData.nick = name;

      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.48, 0.7, 0.28),
        new THREE.MeshStandardMaterial({ color: 0x3d5a3d, roughness: 0.75 })
      );
      torso.position.y = 1.15;
      torso.castShadow = true;
      torso.name = 'body';
      group.add(torso);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.32, 0.28),
        new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: 0.7 })
      );
      head.position.y = 1.68;
      head.castShadow = true;
      head.name = 'head';
      group.add(head);

      const neck = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.12, 0.14),
        new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: 0.7 })
      );
      neck.position.y = 1.48;
      group.add(neck);

      const pants = new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.8 });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.18), pants);
      legL.position.set(-0.13, 0.4, 0);
      legL.name = 'leg';
      group.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.18), pants);
      legR.position.set(0.13, 0.4, 0);
      legR.name = 'leg';
      group.add(legR);

      const bootMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
      const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.12, 0.26), bootMat);
      bootL.position.set(-0.13, 0.06, 0.03);
      group.add(bootL);
      const bootR = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.12, 0.26), bootMat);
      bootR.position.set(0.13, 0.06, 0.03);
      group.add(bootR);

      const armMat = new THREE.MeshStandardMaterial({ color: 0x3d5a3d, roughness: 0.75 });
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.13), armMat);
      armL.position.set(-0.34, 1.1, 0);
      armL.name = 'arm';
      group.add(armL);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.13), armMat);
      armR.position.set(0.34, 1.1, 0);
      armR.name = 'arm';
      group.add(armR);

      const handMat = new THREE.MeshStandardMaterial({ color: 0xc4a070, roughness: 0.7 });
      const handL = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.11), handMat);
      handL.position.set(-0.34, 0.78, 0);
      group.add(handL);
      const handR = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.11), handMat);
      handR.position.set(0.34, 0.78, 0);
      group.add(handR);

      return group;
    }

    function createBots(count) {
      for (let i = 0; i < count; i++) {
        const nick = 'Bot' + (botIdCounter++);
        const bot = createBotMesh(nick);
        const angle = (i / count) * Math.PI * 2;
        const radius = 12 + Math.random() * 18;
        bot.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
        bot.userData = {
          hp: 100,
          speed: 2.3 + Math.random() * 1.3,
          attackCooldown: 0,
          nick: nick
        };
        scene.add(bot);
        bots.push(bot);
      }
    }

    function setupInput() {
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      renderer.domElement.addEventListener('click', () => {
        if (!isPointerLocked) renderer.domElement.requestPointerLock();
      });
      document.addEventListener('pointerlockchange', () => {
        isPointerLocked = document.pointerLockElement === renderer.domElement;
      });
      document.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mousedown', (e) => {
        if (e.button === 0 && isPointerLocked) tryShoot();
      });

      const jumpBtn = document.getElementById('btn-jump');
      const crouchBtn = document.getElementById('btn-crouch');
      const shootBtn = document.getElementById('btn-shoot');
      const reloadBtn = document.getElementById('btn-reload');

      jumpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (canJump) { velocity.y = JUMP_SPEED; canJump = false; }
      }, { passive: false });

      // ПРИСЕД — строго hold
      crouchBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.changedTouches.length > 0) {
          crouchTouchId = e.changedTouches[0].identifier;
          isCrouching = true;
        }
      }, { passive: false });

      function onGlobalTouchEnd(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === crouchTouchId) {
            isCrouching = false;
            crouchTouchId = null;
            break;
          }
        }
      }
      document.addEventListener('touchend', onGlobalTouchEnd, { passive: true });
      document.addEventListener('touchcancel', onGlobalTouchEnd, { passive: true });

      shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); tryShoot(); }, { passive: false });
      reloadBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startReload(); }, { passive: false });

      if (window.nipplejs) {
        const manager = nipplejs.create({
          zone: document.getElementById('joystick-zone'),
          mode: 'static',
          position: { left: '75px', bottom: '75px' },
          color: '#ffffff', size: 120, restOpacity: 0.55
        });
        manager.on('move', (evt, data) => {
          const force = Math.min(data.force, 1.0);
          joyX = Math.cos(data.angle.radian) * force;
          joyY = Math.sin(data.angle.radian) * force;
        });
        manager.on('end', () => { joyX = 0; joyY = 0; });
      }

      let lastTX = 0, lastTY = 0, looking = false;
      renderer.domElement.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.touches.length; i++) {
          const t = e.touches[i];
          if (t.clientX < 160 && t.clientY > window.innerHeight - 170) continue;
          looking = true; lastTX = t.clientX; lastTY = t.clientY; break;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', (e) => {
        if (!looking) return;
        let t = null;
        for (let i = 0; i < e.touches.length; i++) {
          const touch = e.touches[i];
          if (touch.clientX < 160 && touch.clientY > window.innerHeight - 170) continue;
          t = touch; break;
        }
        if (!t) return;
        camera.rotation.y -= (t.clientX - lastTX) * TOUCH_SENS;
        camera.rotation.x -= (t.clientY - lastTY) * TOUCH_SENS;
        camera.rotation.x = Math.max(-1.35, Math.min(1.35, camera.rotation.x));
        lastTX = t.clientX; lastTY = t.clientY;
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) looking = false;
      });
    }

    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': moveForward = true; break;
        case 'KeyS': case 'ArrowDown': moveBackward = true; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
        case 'KeyD': case 'ArrowRight': moveRight = true; break;
        case 'Space': if (canJump) { velocity.y = JUMP_SPEED; canJump = false; } break;
        case 'KeyC': isCrouching = true; break;
        case 'KeyR': startReload(); break;
      }
    }
    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': moveForward = false; break;
        case 'KeyS': case 'ArrowDown': moveBackward = false; break;
        case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
        case 'KeyD': case 'ArrowRight': moveRight = false; break;
        case 'KeyC': isCrouching = false; break;
      }
    }
    function onMouseMove(e) {
      if (!isPointerLocked) return;
      camera.rotation.y -= e.movementX * MOUSE_SENS;
      camera.rotation.x -= e.movementY * MOUSE_SENS;
      camera.rotation.x = Math.max(-1.35, Math.min(1.35, camera.rotation.x));
    }

    function showHitmarker() {
      const el = document.getElementById('hitmarker');
      el.classList.add('show');
      hitmarkerTimer = 0.18;
    }

    function tryShoot() {
      if (isReloading) return;
      const now = performance.now();
      if (now - lastShotTime < FIRE_RATE) return;
      if (ammoInMag <= 0) { startReload(); return; }

      lastShotTime = now;
      ammoInMag--;
      updateAmmoUI();

      camera.rotation.x += 0.018 + Math.random() * 0.01;
      if (weaponGroup) {
        weaponGroup.position.z += 0.055;
        weaponGroup.rotation.x += 0.04;
      }
      if (muzzleFlash) { muzzleFlash.material.opacity = 0.95; flashTimer = 0.06; }

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const botMeshes = [];
      bots.forEach(b => b.traverse(c => { if (c.isMesh) botMeshes.push(c); }));

      const botHits = raycaster.intersectObjects(botMeshes, false);
      if (botHits.length > 0) {
        const hit = botHits[0];
        let bot = hit.object;
        while (bot.parent && !bots.includes(bot)) bot = bot.parent;
        if (bots.includes(bot)) {
          let dmg = 35;
          const part = hit.object.name || '';
          if (part === 'head') dmg = 100;
          else if (part === 'body') {
            const localY = hit.point.y - bot.position.y;
            dmg = 30 + Math.floor(Math.min(20, Math.max(0, (localY - 0.6) * 40)));
          } else if (part === 'arm' || part === 'leg') {
            dmg = 20 + Math.floor(Math.random() * 11);
          }

          bot.userData.hp -= dmg;
          createDecal(hit.point, hit.face ? hit.face.normal : new THREE.Vector3(0,1,0));
          showHitmarker();

          if (bot.userData.hp <= 0) {
            const victimNick = bot.userData.nick || 'Bot';
            scene.remove(bot);
            bots = bots.filter(b => b !== bot);
            kills++;
            addKillFeed(PLAYER_NICK, victimNick);
          }
        }
        return;
      }

      const worldHits = raycaster.intersectObjects(scene.children, true);
      for (let i = 0; i < worldHits.length; i++) {
        const h = worldHits[i];
        if (h.object === weaponGroup || (h.object.parent && h.object.parent === weaponGroup)) continue;
        if (h.object.type === 'GridHelper') continue;
        createDecal(h.point, h.face ? h.face.normal : new THREE.Vector3(0,1,0));
        break;
      }
    }

    function startReload() {
      if (isReloading || ammoInMag === MAG_SIZE || ammoReserve <= 0) return;
      isReloading = true;
      setTimeout(() => {
        const need = MAG_SIZE - ammoInMag;
        const take = Math.min(need, ammoReserve);
        ammoInMag += take; ammoReserve -= take;
        isReloading = false; updateAmmoUI();
      }, 1400);
    }

    function updateAmmoUI() {
      document.getElementById('ammo-display').innerHTML = ammoInMag + ' <span>/ ' + ammoReserve + '</span>';
    }

    function createDecal(position, normal) {
      const geo = new THREE.CircleGeometry(0.065 + Math.random() * 0.03, 7);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x111111, transparent: true, opacity: 0.82,
        depthWrite: false, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);
      mesh.position.addScaledVector(normal, 0.012);
      mesh.lookAt(position.clone().add(normal));
      scene.add(mesh);
      decals.push({ mesh, life: 1.8 });
    }

    function addKillFeed(killer, victim) {
      const feed = document.getElementById('kill-feed');
      const div = document.createElement('div');
      div.className = 'kill-line';
      div.innerHTML = '<span class="killer">' + killer + '</span><span class="icon">✕</span><span class="victim">' + victim + '</span>';
      feed.appendChild(div);
      setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 4200);
    }

    function update(dt) {
      direction.set(0, 0, 0);
      if (moveForward) direction.z -= 1;
      if (moveBackward) direction.z += 1;
      if (moveLeft) direction.x -= 1;
      if (moveRight) direction.x += 1;
      direction.x += joyX;
      direction.z -= joyY;
      if (direction.lengthSq() > 0) direction.normalize();

      const speed = isCrouching ? CROUCH_SPEED : WALK_SPEED;
      const yaw = camera.rotation.y;

      velocity.x -= velocity.x * 10.0 * dt;
      velocity.z -= velocity.z * 10.0 * dt;

      const moveX = direction.x * Math.cos(yaw) + direction.z * Math.sin(yaw);
      const moveZ = direction.z * Math.cos(yaw) - direction.x * Math.sin(yaw);
      velocity.x += moveX * speed * 12.0 * dt;
      velocity.z += moveZ * speed * 12.0 * dt;
      velocity.y -= GRAVITY * dt;

      camera.position.x += velocity.x * dt;
      camera.position.y += velocity.y * dt;
      camera.position.z += velocity.z * dt;

      // Коллизии
      const playerRadius = 0.35;
      const playerH = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
      for (let i = 0; i < colliders.length; i++) {
        const c = colliders[i];
        if (camera.position.y + 0.2 < c.minY || camera.position.y - playerH > c.maxY) continue;
        const closestX = Math.max(c.minX, Math.min(camera.position.x, c.maxX));
        const closestZ = Math.max(c.minZ, Math.min(camera.position.z, c.maxZ));
        const dx = camera.position.x - closestX;
        const dz = camera.position.z - closestZ;
        const distSq = dx*dx + dz*dz;
        if (distSq < playerRadius * playerRadius) {
          const dist = Math.sqrt(distSq) || 0.0001;
          const push = (playerRadius - dist) / dist;
          camera.position.x += dx * push;
          camera.position.z += dz * push;
          velocity.x *= 0.3; velocity.z *= 0.3;
        }
      }

      const targetH = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
      if (camera.position.y < targetH) {
        camera.position.y = targetH;
        velocity.y = 0;
        canJump = true;
      }
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -42, 42);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -42, 42);

      if (weaponGroup) {
        const moving = direction.lengthSq() > 0.05;
        weaponBobTime += dt * (moving ? 9.5 : 2.5);
        weaponGroup.position.x = Math.sin(weaponBobTime) * (moving ? 0.014 : 0.004);
        weaponGroup.position.y = -0.04 + Math.cos(weaponBobTime * 2) * (moving ? 0.011 : 0.003);
        weaponGroup.position.z *= 0.82;
        weaponGroup.rotation.x *= 0.82;
      }

      if (flashTimer > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0 && muzzleFlash) muzzleFlash.material.opacity = 0;
      }

      if (hitmarkerTimer > 0) {
        hitmarkerTimer -= dt;
        if (hitmarkerTimer <= 0) {
          document.getElementById('hitmarker').classList.remove('show');
        }
      }

      for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life -= dt;
        if (decals[i].life <= 0) {
          scene.remove(decals[i].mesh);
          decals[i].mesh.geometry.dispose();
          decals[i].mesh.material.dispose();
          decals.splice(i, 1);
        } else {
          decals[i].mesh.material.opacity = Math.min(0.82, decals[i].life * 0.55);
        }
      }

      updateBots(dt);

      document.getElementById('hp-bar-fill').style.width = playerHP + '%';
      document.getElementById('hp-text').textContent = Math.ceil(playerHP) + ' HP';
    }

    function updateBots(dt) {
      for (let i = 0; i < bots.length; i++) {
        const bot = bots[i];
        const toPlayer = new THREE.Vector3(
          camera.position.x - bot.position.x, 0,
          camera.position.z - bot.position.z
        );
        const dist = toPlayer.length();
        if (dist > 2.8) {
          toPlayer.normalize();
          bot.position.x += toPlayer.x * bot.userData.speed * dt;
          bot.position.z += toPlayer.z * bot.userData.speed * dt;
          bot.lookAt(camera.position.x, bot.position.y + 1.0, camera.position.z);
        }
        bot.userData.attackCooldown -= dt;
        if (dist < 2.6 && bot.userData.attackCooldown <= 0) {
          playerHP = Math.max(0, playerHP - 6);
          bot.userData.attackCooldown = 0.9;
          if (playerHP <= 0) {
            playerHP = 100;
            camera.position.set(0, STAND_HEIGHT, 8);
            addKillFeed(bot.userData.nick || 'Bot', PLAYER_NICK);
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      renderer.render(scene, camera);

      frameCount++;
      const now = performance.now();
      if (now - lastFpsUpdate > 500) {
        currentFps = frameCount * 2;
        frameCount = 0;
        lastFpsUpdate = now;
        document.getElementById('debug-panel').textContent =
          'FPS: ' + currentFps + ' | Боты: ' + bots.length + ' | Киллы: ' + kills;
      }
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    boot();
  </script>
</body>
</html>
