<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D CS-Style Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-ui {
            pointer-events: auto !important;
        }

        #stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 18px;
            color: #ffffff;
            width: 210px;
            backdrop-filter: blur(6px);
        }

        .hp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .hp-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #hp-bar-fill {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.15s ease-out;
        }

        .kills-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #9ca3af;
        }

        #score-val { color: #ffffff; }

        #minimap-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 110px;
            height: 110px;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #btn-reload {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #btn-reload:active { background: rgba(255, 255, 255, 0.4); }

        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
        }

        #btn-fire {
            position: absolute;
            bottom: 110px;
            right: 35px;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: rgba(120, 35, 35, 0.65);
            border: 2px solid rgba(255, 120, 120, 0.4);
            color: #ffffff;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #btn-fire:active {
            background: rgba(220, 38, 38, 0.75);
        }

        #controls-right-panel {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-weight: 800;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .btn-action:active { background: rgba(255, 255, 255, 0.4); }
        .btn-active { background: rgba(34, 197, 94, 0.5) !important; border-color: rgba(34, 197, 94, 0.8) !important; }

        #ammo-panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            backdrop-filter: blur(6px);
        }

        #ammo-count {
            font-size: 26px;
            font-weight: 900;
            color: #f59e0b;
            line-height: 1;
        }

        #weapon-name {
            font-size: 10px;
            font-weight: 700;
            color: #9ca3af;
            margin-top: 2px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
        }

        .ch-bar { position: absolute; background: #39ff14; box-shadow: 0 0 2px rgba(0,0,0,0.8); }
        .ch-v { width: 2px; height: 8px; left: 11px; }
        .ch-h { height: 2px; width: 8px; top: 11px; }
        #ch-top { top: 0; }
        #ch-bottom { bottom: 0; }
        #ch-left { left: 0; }
        #ch-right { right: 0; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.9);
            z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white;
        }

        #start-btn {
            padding: 16px 40px; font-size: 20px; font-weight: bold;
            background: #22c55e; color: white; border: none; border-radius: 8px;
            cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="stats-panel">
            <div class="hp-header">
                <span>ЗДОРОВЬЕ</span>
                <span id="hp-val">100</span>
            </div>
            <div class="hp-bar-track">
                <div id="hp-bar-fill"></div>
            </div>
            <div class="kills-row">
                <span>УБИТО:</span>
                <span id="score-val">0</span>
            </div>
        </div>

        <div id="minimap-wrapper">
            <canvas id="minimap-canvas" width="110" height="110"></canvas>
            <button id="btn-reload" class="interactive-ui">R</button>
        </div>

        <div id="joystick-zone" class="interactive-ui"></div>

        <button id="btn-fire" class="interactive-ui">ОГОНЬ</button>

        <div id="controls-right-panel">
            <button id="btn-crouch" class="btn-action interactive-ui">ПРИСЕД</button>
            <button id="btn-jump" class="btn-action interactive-ui">ПРЫЖОК</button>
            <div id="ammo-panel">
                <div id="ammo-count">30 / 90</div>
                <div id="weapon-name">AK-47</div>
            </div>
        </div>

        <div id="crosshair">
            <div id="ch-top" class="ch-bar ch-v"></div>
            <div id="ch-bottom" class="ch-bar ch-v"></div>
            <div id="ch-left" class="ch-bar ch-h"></div>
            <div id="ch-right" class="ch-bar ch-h"></div>
        </div>
    </div>

    <div id="start-overlay">
        <h2>3D TACTICAL SHOOTER</h2>
        <button id="start-btn" class="interactive-ui">В БОЙ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
        let scene, camera, renderer;
        let weaponContainer = new THREE.Group();
        let colliders = [];
        let bots = [];
        let bulletDecals = [];
        let raycaster = new THREE.Raycaster();

        const player = {
            hp: 100,
            score: 0,
            pos: new THREE.Vector3(0, 1.6, 10),
            vel: new THREE.Vector3(),
            onGround: true,
            isCrouching: false,
            targetHeight: 1.6,
            currentHeight: 1.6,
            speed: 7.0,

            ammoInMag: 30,
            maxMag: 30,
            reserveAmmo: 90,
            isReloading: false,
            lastShootTime: 0,
            shootInterval: 110
        };

        let moveJoystick = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;
        let recoilPitch = 0;
        let recoilYaw = 0;
        let isFiring = false;

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
            camera.rotation.order = 'YXZ';
            camera.add(weaponContainer);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(20, 40, 20);
            sun.castShadow = true;
            scene.add(sun);

            buildMap();
            loadGLTFModels();

            for (let i = 0; i < 4; i++) spawnBotCS();

            setupControls();

            let lastTime = performance.now();
            function loop(now) {
                requestAnimationFrame(loop);
                const dt = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;

                updatePlayer(dt);
                updateBots(dt);
                if (isFiring) processShoot(now);
                renderMinimap();

                renderer.render(scene, camera);
            }
            loop(performance.now());
        }

        function buildMap() {
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            colliders.push(floor);

            const grid = new THREE.GridHelper(80, 40, 0x3b82f6, 0x334155);
            grid.position.y = 0.01;
            scene.add(grid);

            const crateGeo = new THREE.BoxGeometry(3, 3, 3);
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.6 });

            const positions = [
                [0, 1.5, -5], [-6, 1.5, -8], [6, 1.5, -8],
                [-10, 1.5, 2], [10, 1.5, 2], [0, 1.5, 6]
            ];

            positions.forEach(pos => {
                const crate = new THREE.Mesh(crateGeo, crateMat);
                crate.position.set(...pos);
                crate.castShadow = true;
                crate.receiveShadow = true;
                scene.add(crate);
                colliders.push(crate);
            });
        }

        function createLimb(w, h, d, color) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = -h / 2;
            mesh.castShadow = true;
            group.add(mesh);
            return { group, mesh };
        }

        function spawnBotCS() {
            const botGroup = new THREE.Group();
            const shirtColor = 0xd97706; 
            const skinColor = 0xfca5a5;  
            const pantsColor = 0x334155; 

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshStandardMaterial({ color: shirtColor }));
            torso.position.y = 1.05;
            torso.castShadow = true;
            botGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: skinColor }));
            head.position.y = 1.55;
            head.castShadow = true;
            head.userData = { isHead: true };
            botGroup.add(head);

            const leftArm = createLimb(0.15, 0.5, 0.15, shirtColor);
            leftArm.group.position.set(0.35, 1.35, 0);
            botGroup.add(leftArm.group);

            const rightArm = createLimb(0.15, 0.5, 0.15, shirtColor);
            rightArm.group.position.set(-0.35, 1.35, 0);
            botGroup.add(rightArm.group);

            const leftLeg = createLimb(0.18, 0.6, 0.18, pantsColor);
            leftLeg.group.position.set(0.15, 0.75, 0);
            botGroup.add(leftLeg.group);

            const rightLeg = createLimb(0.18, 0.6, 0.18, pantsColor);
            rightLeg.group.position.set(-0.15, 0.75, 0);
            botGroup.add(rightLeg.group);

            const rx = (Math.random() - 0.5) * 50;
            const rz = (Math.random() - 0.5) * 40 - 5;
            botGroup.position.set(rx, 0, rz);

            scene.add(botGroup);

            bots.push({
                mesh: botGroup,
                hp: 100,
                speed: 2.5,
                leftArm: leftArm.group,
                rightArm: rightArm.group,
                leftLeg: leftLeg.group,
                rightLeg: rightLeg.group,
                animTime: Math.random() * 10
            });
        }

        /* =========================================================================
           ЗАГРУЗКА И НАСТРОЙКА КРУПНЫХ МОДЕЛЕЙ (АК-47 + РУКИ)
           ========================================================================= */
        function loadGLTFModels() {
            const loader = new THREE.GLTFLoader();

            // АК-47
            loader.load('ak-47_low_poly.glb', (gltf) => {
                const ak = gltf.scene;
                // ИСПРАВЛЕНИЕ: Масштаб увеличен в десятки раз для от первого лица
                ak.scale.set(0.12, 0.12, 0.12);
                ak.position.set(0.28, -0.32, -0.52);
                ak.rotation.set(0, Math.PI, 0);
                weaponContainer.add(ak);
            }, undefined, (err) => console.log('Файл АК-47 не найден или загружается...', err));

            // РУКИ
            loader.load('default_counter-strike_hands_rigged.glb', (gltf) => {
                const hands = gltf.scene;
                // ИСПРАВЛЕНИЕ: Подогнан масштаб и выравнивание с АК-47
                hands.scale.set(0.18, 0.18, 0.18);
                hands.position.set(0.0, -0.45, -0.45);
                weaponContainer.add(hands);
            }, undefined, (err) => console.log('Файл Рук не найден или загружается...', err));
        }

        function setupControls() {
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-overlay').style.display = 'none';
            });

            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '70px', bottom: '70px' },
                color: 'white'
            });

            joystick.on('move', (e, data) => {
                if (data.vector) {
                    moveJoystick.x = data.vector.x;
                    moveJoystick.y = data.vector.y;
                }
            });
            joystick.on('end', () => { moveJoystick.x = 0; moveJoystick.y = 0; });

            let lookTouchId = null;
            let fireTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            const fireBtn = document.getElementById('btn-fire');

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    
                    const rect = fireBtn.getBoundingClientRect();
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        fireTouchId = touch.identifier;
                        isFiring = true;
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                        continue;
                    }

                    if (touch.target.closest('.interactive-ui')) continue;

                    if (touch.clientX > window.innerWidth / 3 && lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];

                    if (touch.identifier === lookTouchId || touch.identifier === fireTouchId) {
                        const dx = touch.clientX - lastLookX;
                        const dy = touch.clientY - lastLookY;

                        cameraYaw -= dx * 0.0045;
                        cameraPitch -= dy * 0.0045;
                        cameraPitch = Math.max(-1.4, Math.min(1.4, cameraPitch));

                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const id = e.changedTouches[i].identifier;
                    if (id === lookTouchId) lookTouchId = null;
                    if (id === fireTouchId) {
                        fireTouchId = null;
                        isFiring = false;
                    }
                }
            };
            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);

            const crouchBtn = document.getElementById('btn-crouch');
            crouchBtn.addEventListener('click', () => {
                player.isCrouching = !player.isCrouching;

                if (player.isCrouching) {
                    player.targetHeight = 0.9;
                    player.speed = 3.5;
                    crouchBtn.classList.add('btn-active');
                } else {
                    player.targetHeight = 1.6;
                    player.speed = 7.0;
                    crouchBtn.classList.remove('btn-active');
                }
            });

            document.getElementById('btn-jump').addEventListener('click', () => {
                if (player.onGround) {
                    player.vel.y = 7.5;
                    player.onGround = false;
                }
            });

            document.getElementById('btn-reload').addEventListener('click', reloadAmmo);
        }

        /* =========================================================================
           СТРЕЛЬБА И СОЗДАНИЕ СЛЕДОВ ОТ ПУЛЬ (BULLET DECALS)
           ========================================================================= */
        function createBulletHole(point, normal) {
            const decalGeo = new THREE.PlaneGeometry(0.12, 0.12);
            const decalMat = new THREE.MeshBasicMaterial({
                color: 0x111111,
                polygonOffset: true,
                polygonOffsetFactor: -4, // Предотвращает мерцание поверхностей
                side: THREE.DoubleSide
            });
            const decal = new THREE.Mesh(decalGeo, decalMat);

            decal.position.copy(point).addScaledVector(normal, 0.01);
            decal.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

            scene.add(decal);
            bulletDecals.push(decal);

            // Ограничение максимального количества следов от пуль на карте
            if (bulletDecals.length > 40) {
                const old = bulletDecals.shift();
                scene.remove(old);
            }
        }

        function processShoot(now) {
            if (player.isReloading) return;
            if (now - player.lastShootTime < player.shootInterval) return;

            if (player.ammoInMag <= 0) {
                reloadAmmo();
                return;
            }

            player.ammoInMag--;
            player.lastShootTime = now;
            updateUI();

            recoilPitch += 0.022;
            recoilYaw += (Math.random() - 0.5) * 0.012;
            weaponContainer.position.z = 0.05;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let targets = [];
            bots.forEach(b => {
                b.mesh.traverse(child => {
                    if (child.isMesh) targets.push(child);
                });
            });
            colliders.forEach(c => targets.push(c));

            const hits = raycaster.intersectObjects(targets);
            if (hits.length > 0) {
                const hit = hits[0];
                let hitBot = null;

                bots.forEach(b => {
                    b.mesh.traverse(child => {
                        if (child === hit.object) hitBot = b;
                    });
                });

                if (hitBot) {
                    const isHead = hit.object.userData && hit.object.userData.isHead;
                    hitBot.hp -= isHead ? 100 : 35;

                    if (hitBot.hp <= 0) {
                        scene.remove(hitBot.mesh);
                        bots = bots.filter(b => b !== hitBot);
                        player.score++;
                        updateUI();
                        spawnBotCS();
                    }
                } else if (hit.face) {
                    // Создание отверстия от пули на стене/ящике/земле
                    createBulletHole(hit.point, hit.face.normal);
                }
            }
        }

        function reloadAmmo() {
            if (player.isReloading || player.reserveAmmo <= 0 || player.ammoInMag === player.maxMag) return;

            player.isReloading = true;
            document.getElementById('weapon-name').innerText = "ПЕРЕЗАРЯДКА...";

            setTimeout(() => {
                const needed = player.maxMag - player.ammoInMag;
                const toLoad = Math.min(needed, player.reserveAmmo);
                player.ammoInMag += toLoad;
                player.reserveAmmo -= toLoad;
                player.isReloading = false;
                document.getElementById('weapon-name').innerText = "AK-47";
                updateUI();
            }, 1500);
        }

        function updatePlayer(dt) {
            player.vel.y -= 22.0 * dt;

            const move = new THREE.Vector3(moveJoystick.x, 0, -moveJoystick.y);
            move.normalize();
            move.applyEuler(new THREE.Euler(0, cameraYaw, 0, 'YXZ'));

            player.pos.x += move.x * player.speed * dt;
            player.pos.z += move.z * player.speed * dt;
            player.pos.y += player.vel.y * dt;

            player.currentHeight = THREE.MathUtils.lerp(player.currentHeight, player.targetHeight, 12 * dt);

            if (player.pos.y <= player.currentHeight) {
                player.pos.y = player.currentHeight;
                player.vel.y = 0;
                player.onGround = true;
            }

            recoilPitch = THREE.MathUtils.lerp(recoilPitch, 0, 10 * dt);
            recoilYaw = THREE.MathUtils.lerp(recoilYaw, 0, 10 * dt);
            weaponContainer.position.z = THREE.MathUtils.lerp(weaponContainer.position.z, 0, 12 * dt);

            camera.rotation.y = cameraYaw + recoilYaw;
            camera.rotation.x = cameraPitch + recoilPitch;
            camera.position.copy(player.pos);
        }

        function updateBots(dt) {
            bots.forEach(bot => {
                const dir = new THREE.Vector3().subVectors(player.pos, bot.mesh.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist > 1.2) {
                    dir.normalize();
                    bot.mesh.position.addScaledVector(dir, bot.speed * dt);
                    bot.mesh.lookAt(player.pos.x, bot.mesh.position.y, player.pos.z);

                    bot.animTime += dt * 8;
                    const angle = Math.sin(bot.animTime) * 0.6;
                    bot.leftLeg.rotation.x = angle;
                    bot.rightLeg.rotation.x = -angle;
                    bot.leftArm.rotation.x = -angle;
                    bot.rightArm.rotation.x = angle;
                } else {
                    bot.leftLeg.rotation.x = 0;
                    bot.rightLeg.rotation.x = 0;
                    player.hp -= 10 * dt;
                    if (player.hp < 0) player.hp = 0;
                    updateUI();
                }
            });
        }

        function renderMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const c = 55;
            const scale = 1.3;

            ctx.clearRect(0, 0, 110, 110);

            ctx.fillStyle = '#ef4444';
            bots.forEach(b => {
                const rx = (b.mesh.position.x - player.pos.x) * scale;
                const rz = (b.mesh.position.z - player.pos.z) * scale;
                ctx.beginPath();
                ctx.arc(c + rx, c + rz, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(c, c, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = Math.round(player.hp);
            document.getElementById('hp-bar-fill').style.width = `${player.hp}%`;
            document.getElementById('score-val').innerText = player.score;
            document.getElementById('ammo-count').innerText = `${player.ammoInMag} / ${player.reserveAmmo}`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = initScene;
    </script>
    <script src="hands.js"></script>
</body>
</html>
