<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CS 1.6 FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas { display: block; width: 100%; height: 100%; }

        .hud { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; color: #fff; }

        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; pointer-events: none;
        }
        .crosshair::before { content: ''; position: absolute; width: 2px; height: 8px; left: 9px; top: 0; background: #00ff00; }
        .crosshair::after { content: ''; position: absolute; width: 8px; height: 2px; top: 9px; left: 0; background: #00ff00; }

        #hp-display {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
            padding: 12px 16px; border: 1px solid #00ff00; border-radius: 4px;
            font-size: 14px; font-family: monospace; color: #00ff00;
        }

        #ammo-display {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7);
            padding: 12px 16px; border: 1px solid #ffaa00; border-radius: 4px;
            font-size: 14px; font-family: monospace; color: #ffaa00;
        }

        #kill-feed {
            position: absolute; top: 80px; right: 20px; color: #fff;
            font-family: monospace; font-size: 12px; text-align: right;
        }

        .kill-entry { background: rgba(0,0,0,0.8); padding: 4px 8px; margin-bottom: 4px; border-left: 2px solid #ff6b6b; animation: fadeOut 4s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }

        #hit-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; border: 3px solid #ff0000; border-radius: 50%;
            pointer-events: none; display: none; animation: hitPulse 0.3s ease-out;
        }
        @keyframes hitPulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        #team-select {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #team-select h1 { font-size: 32px; color: #ffaa00; margin-bottom: 30px; font-family: monospace; }

        .team-buttons { display: flex; gap: 30px; }

        .team-btn {
            padding: 20px 40px; font-size: 18px; font-weight: bold;
            border: 2px solid; background: rgba(255,255,255,0.1); color: #fff;
            cursor: pointer; border-radius: 4px; font-family: monospace;
            transition: all 0.2s;
        }

        .team-btn-ct { border-color: #4287f5; }
        .team-btn-ct:active { background: #4287f5; }

        .team-btn-t { border-color: #ff0000; }
        .team-btn-t:active { background: #ff0000; }

        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; }
        #joystick-bg { position: absolute; width: 140px; height: 140px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }
        #joystick-thumb {
            position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.5);
            border-radius: 50%; left: 45px; top: 45px; pointer-events: none;
        }

        .action-btn {
            position: fixed; width: 70px; height: 70px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15);
            color: #fff; font-size: 24px; font-weight: bold; display: flex;
            justify-content: center; align-items: center; cursor: pointer; z-index: 10;
            touch-action: none;
        }

        #btn-fire { bottom: 30px; right: 30px; background: rgba(255,0,0,0.4); border-color: #ff0000; }
        #btn-fire:active { background: rgba(255,0,0,0.7); }

        #btn-reload { bottom: 110px; right: 30px; }
        #btn-reload:active { background: rgba(255,255,255,0.3); }

        #status-text {
            position: absolute; bottom: 30px; left: 20px; color: #ffaa00;
            font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.7);
            padding: 8px 12px; border: 1px solid #ffaa00; border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="hud">
        <div class="crosshair"></div>
        <div id="hp-display">HP: <span id="hp-val">100</span></div>
        <div id="ammo-display">AMMO: <span id="ammo-val">7</span>/∞</div>
        <div id="kill-feed"></div>
        <div id="hit-indicator"></div>
        <div id="status-text">LOADING...</div>
    </div>

    <div id="team-select">
        <h1>>>> COUNTER-STRIKE 1.6 <<<</h1>
        <div class="team-buttons">
            <button class="team-btn team-btn-ct" id="select-ct">🛡️ CT SIDE</button>
            <button class="team-btn team-btn-t" id="select-t">💣 TERRORIST</button>
        </div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-bg"></div>
        <div id="joystick-thumb"></div>
    </div>

    <button id="btn-fire" class="action-btn">🔥</button>
    <button id="btn-reload" class="action-btn">R</button>

    <script async src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>

    <script>
        function waitForThree() {
            if (typeof THREE === 'undefined') {
                setTimeout(waitForThree, 100);
                return;
            }
            initGame();
        }

        function initGame() {
            let scene, camera, renderer;
            let playerPos = new THREE.Vector3(0, 0, 0);
            let playerEuler = { yaw: 0, pitch: 0 };
            let playerHP = 100;
            let playerAmmo = 7;
            let playerTeam = null;
            let isReloading = false;
            let handGroup, pistolGroup;
            let lastShotTime = 0;

            const bots = [];
            const walls = [];
            const raycaster = new THREE.Raycaster();
            const mapSize = 100;

            function initThree() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x4da6ff);
                scene.fog = new THREE.Fog(0x4da6ff, 150, 300);

                camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.7, 0);

                renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;

                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(50, 80, 50);
                light.castShadow = true;
                light.shadow.mapSize.width = 2048;
                light.shadow.mapSize.height = 2048;
                scene.add(light);

                scene.add(new THREE.AmbientLight(0xffffff, 0.6));

                buildMap();
                createHandsAndWeapon();
                createBots();

                document.getElementById('status-text').innerText = "GAME READY - SELECT TEAM";

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            function buildMap() {
                const groundMat = new THREE.MeshStandardMaterial({ color: 0xaa9966, roughness: 0.8 });
                const ground = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, mapSize), groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.9 });

                const createWall = (x, y, z, w, h, d) => {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                    wall.position.set(x, y, z);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    scene.add(wall);
                    walls.push(wall);
                };

                createWall(0, 3.5, -50, mapSize, 7, 1);
                createWall(0, 3.5, 50, mapSize, 7, 1);
                createWall(-50, 3.5, 0, 1, 7, mapSize);
                createWall(50, 3.5, 0, 1, 7, mapSize);

                createWall(-15, 1.5, -15, 5, 3, 5);
                createWall(15, 1.5, -15, 5, 3, 5);
                createWall(-15, 1.5, 15, 5, 3, 5);
                createWall(15, 1.5, 15, 5, 3, 5);
                createWall(0, 1.5, -25, 8, 3, 4);
                createWall(0, 1.5, 25, 8, 3, 4);
            }

            function createHandsAndWeapon() {
                handGroup = new THREE.Group();
                
                const skinColor = 0xd9a583;
                const handMat = new THREE.MeshStandardMaterial({ color: skinColor });
                
                const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.35, 0.1), handMat);
                forearm.position.set(0.15, -0.25, -0.4);
                handGroup.add(forearm);

                const hand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.12), handMat);
                hand.position.set(0.15, -0.45, -0.38);
                handGroup.add(hand);

                pistolGroup = new THREE.Group();

                const darkSteel = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.9, roughness: 0.3 });
                const lightSteel = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.8, roughness: 0.4 });
                const brownGrip = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.7 });

                const slide = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.06, 0.24), darkSteel);
                slide.position.set(0, 0.02, -0.08);
                pistolGroup.add(slide);

                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.28, 12), darkSteel);
                barrel.rotation.x = Math.PI / 2;
                barrel.position.set(0, 0.018, -0.12);
                pistolGroup.add(barrel);

                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.032, 0.22), lightSteel);
                frame.position.set(0, 0, -0.08);
                pistolGroup.add(frame);

                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.12, 0.065), brownGrip);
                grip.position.set(0, -0.06, -0.02);
                grip.rotation.x = -0.25;
                pistolGroup.add(grip);

                const sight = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.012, 0.012), darkSteel);
                sight.position.set(0, 0.065, -0.18);
                pistolGroup.add(sight);

                const flashGeo = new THREE.SphereGeometry(0.04, 8, 8);
                const flashMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 });
                const muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
                muzzleFlash.position.set(0, 0.018, -0.24);
                pistolGroup.add(muzzleFlash);
                pistolGroup.muzzleFlash = muzzleFlash;

                pistolGroup.position.set(0.25, -0.2, -0.45);
                handGroup.add(pistolGroup);

                handGroup.position.set(0.2, -0.35, -0.5);
                camera.add(handGroup);
            }

            function createBots() {
                const createBot = (team, id, x, z) => {
                    const group = new THREE.Group();
                    const color = team === 'CT' ? 0x4287f5 : 0xff4400;
                    const mat = new THREE.MeshStandardMaterial({ color });

                    const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.3), mat);
                    body.position.y = 0.4;
                    group.add(body);

                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mat);
                    head.position.y = 1.2;
                    group.add(head);

                    group.position.set(x, 0, z);
                    scene.add(group);

                    bots.push({
                        mesh: group,
                        team,
                        id,
                        hp: 100,
                        dead: false,
                        posX: x,
                        posZ: z,
                        targetX: x,
                        targetZ: z,
                        angle: 0,
                        patrolTime: 0,
                        lastShoot: 0
                    });
                };

                createBot('CT', 1, -20, -30);
                createBot('CT', 2, -5, -30);
                createBot('CT', 3, 5, -30);
                createBot('CT', 4, 20, -30);

                createBot('T', 1, -20, 30);
                createBot('T', 2, -5, 30);
                createBot('T', 3, 5, 30);
                createBot('T', 4, 20, 30);
            }

            let moveX = 0, moveY = 0;
