name: Install M16 Winner Blue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-m16-winner-blue.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install modeling dependencies
        run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0' 'opencv-python-headless==4.13.0.92'
      - name: Rebuild the approved GLB
        env:
          MODEL_SCRIPTS: ''
        run: |
          python - <<'PY'
          import os, base64, zlib
          from pathlib import Path
          bundle=zlib.decompress(base64.b64decode(os.environ['MODEL_SCRIPTS'])).decode('utf-8')
          scripts=bundle.split('\x1e@@M16@@\x1e')
          assert len(scripts)==3, len(scripts)
          for name, src in zip(('create_m16_winner_only.py','recolor_m16_winner_blue.py','m16_winner_blue_finish.py'),scripts):
              Path(name).write_text(src)
          PY
          python create_m16_winner_only.py
          python recolor_m16_winner_blue.py
          python m16_winner_blue_finish.py
          mkdir -p skins
          mv m16_winner_blue.glb skins/m16_winner_blue.glb
      - name: Verify exact blue model
        run: echo '2d6b4d89d2de8c7eac5fc31f1ffa715bc362e07d65e87659a6db4922980fb933  skins/m16_winner_blue.glb' | sha256sum -c -
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/m16_winner_blue.glb
          git commit -m "Add M16 Winner Blue skin"
          git push origin HEAD:main
