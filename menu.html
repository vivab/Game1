<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1013">
<title>Командный бой — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1013; --bg2:#12161a; --panel:#181e23; --panel2:#1f262c; --line:#2c353c; --line2:#3a454d;
  --text:#e9edf0; --mute:#8f9ba5; --dim:#5d6872;
  --gold:#f2b632; --gold2:#c98a16; --goldtext:#1b1305;
  --silver:#86a2d9; --silver2:#5d7cb8;
  --green:#52c46e; --red:#e0524a; --blue:#4a7bd0;
  --head:'Russo One','Arial Black',Impact,sans-serif;
  --body:'Exo 2','Segoe UI',Roboto,Arial,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}

#app{position:fixed;inset:0;background:
  radial-gradient(60% 70% at 50% 62%,rgba(242,182,50,.10),transparent 70%),
  radial-gradient(40% 50% at 12% 100%,rgba(74,123,208,.10),transparent 70%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
  linear-gradient(180deg,#14191d,#0b0e11)}
.screen{position:absolute;inset:0;display:none;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) calc(var(--sb) + 8px) calc(var(--sl) + 10px)}
.screen.on{display:grid}

/* ---------- главный экран ---------- */
#s-main{grid-template-columns:76px minmax(0,1fr) minmax(220px,29%);grid-template-rows:62px minmax(0,1fr);gap:8px 10px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;position:relative;min-width:0}
.pcard{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;background:var(--panel);border:1px solid var(--line);min-width:0;max-width:34%;text-align:left}
.pcard .av{width:46px;height:46px;flex:none;border:1px solid var(--line2);image-rendering:pixelated;background:#202830}
.pcard .meta{min-width:0}
.pcard .nick{font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pid{font-size:11px;color:var(--mute);margin-top:1px}
.xpbar{height:5px;background:#0c0f12;border:1px solid var(--line);margin-top:5px;width:132px;max-width:100%}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0}
.lvl{flex:none;width:34px;height:38px;display:grid;place-items:center;font:700 14px var(--head);color:var(--goldtext);
  background:linear-gradient(180deg,var(--gold),var(--gold2));clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
.play{position:absolute;left:50%;top:0;transform:translateX(-50%);height:56px;min-width:min(300px,34vw);padding:0 34px;display:flex;align-items:center;justify-content:center;gap:12px;
  font:400 25px var(--head);color:var(--goldtext);letter-spacing:.5px;
  background:linear-gradient(180deg,#ffd467 0%,var(--gold) 46%,var(--gold2) 100%);
  border:1px solid #ffe29a;box-shadow:0 0 0 2px rgba(242,182,50,.18),0 8px 26px rgba(242,182,50,.28),inset 0 -3px 0 rgba(120,70,0,.35);overflow:hidden}
.play:active{transform:translateX(-50%) translateY(1px)}
.play .ic{font-size:24px;fill:currentColor;stroke:none}
.play::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 1.6s .6s 1 both}
@keyframes sheen{to{left:130%}}
.bal{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.cur{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px 0 5px;font:700 16px var(--body);border:1px solid var(--line2)}
.cur i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font:400 14px var(--head);font-style:normal}
.cur.c{background:linear-gradient(180deg,#3a4d73,#2b3a58);color:#dce7ff}.cur.c i{background:var(--silver);color:#0f1a30}
.cur.g{background:linear-gradient(180deg,#6d5421,#4d3a14);color:#ffe9b3}.cur.g i{background:var(--gold);color:var(--goldtext)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;font-size:20px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}

.side{display:flex;flex-direction:column;gap:8px}
.navbtn{flex:1;max-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  font-weight:700;font-size:12px;color:var(--text)}
.navbtn .ic{font-size:30px;color:var(--gold)}
.navbtn:active{background:var(--panel2)}
.navbtn .tag{font-size:10px;color:var(--mute);font-weight:600}

.stage{position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#stageWrap{position:absolute;inset:0}
#c3d{width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.modechip{position:relative;margin-bottom:6px;padding:7px 16px;background:rgba(13,16,19,.78);border:1px solid var(--line2);font-size:13px;font-weight:700}
.modechip small{color:var(--mute);font-weight:600;margin-left:8px}

.right{display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:38px;flex:none;border-bottom:1px solid var(--line);font:400 14px var(--head)}
.card>.hd .cnt{font:600 12px var(--body);color:var(--mute)}
.card>.hd .sp{flex:1}
.card>.hd button.go{height:100%;padding:0 10px;color:var(--mute);font-size:16px;display:flex;align-items:center}
.friends{flex:1.5}.statc{flex:1}
.flist{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.frow{display:flex;align-items:center;gap:9px;padding:6px 6px 6px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.frow .av{width:36px;height:36px;flex:none;border:1px solid var(--line2);image-rendering:pixelated}
.frow .fi{flex:1;min-width:0}
.frow .fn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fs{font-size:11.5px;color:var(--dim)}
.frow .fs.game{color:var(--green)}.frow .fs.on{color:var(--silver)}
.frow .add{width:34px;height:34px;display:grid;place-items:center;font-size:18px;background:var(--panel2);border:1px solid var(--line2);color:var(--gold)}
.frow .add[disabled]{opacity:.3}
.srow{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
.srow span{color:var(--mute)}.srow b{font-weight:700}
.rank{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.rank b{font:400 15px var(--head)}

/* ---------- подэкраны ---------- */
#s-sub{grid-template-rows:56px minmax(0,1fr);gap:8px}
.sh{display:flex;align-items:center;gap:10px;min-width:0}
.back{width:48px;height:48px;display:grid;place-items:center;font-size:24px;background:var(--panel);border:1px solid var(--line)}
.sh h1{margin:0;font:400 24px var(--head);white-space:nowrap}
.sh .sp{flex:1}
.sbody{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.btn{min-height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border:1px solid var(--line2);background:var(--panel2)}
.btn.gold{background:linear-gradient(180deg,#ffd467,var(--gold) 50%,var(--gold2));color:var(--goldtext);border-color:#ffe29a;font-family:var(--head);font-weight:400;font-size:17px}
.btn.silver{background:linear-gradient(180deg,#9db5e4,var(--silver2));color:#0c1830;border-color:#b9ccf0;font-family:var(--head);font-weight:400;font-size:17px}
.btn.red{border-color:#7b2f2b;color:#ff9b94}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn .cur{height:auto;border:0;background:none;padding:0;font-size:inherit}
.btn .cur i{width:22px;height:22px;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:linear-gradient(180deg,#252e35,#1b2227);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left}
.item .art{height:104px;display:grid;place-items:center;position:relative}
.item .art svg{width:86%;height:86%}
.item .lab{padding:7px 10px;font-size:13px;font-weight:700;background:var(--silver2);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .price{position:absolute;right:8px;bottom:6px;font:400 18px var(--head);display:flex;align-items:center;gap:5px}
.item.shop .lab{background:none;color:var(--gold);text-align:center;border-bottom:1px solid var(--line);order:-1;font-weight:600;padding:8px}
.item.shop::after{content:"";height:4px;background:var(--silver2)}
.item.shop.prem::after{background:var(--gold)}
.q{font:400 54px var(--head);color:rgba(255,255,255,.5)}
.skin .art{background:radial-gradient(60% 60% at 50% 50%,rgba(255,255,255,.07),transparent)}
.skin .lab{background:var(--rc,#8b97a2)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--mute);padding:20px}
.empty b{font:400 20px var(--head);color:var(--text)}
.empty p{margin:0;max-width:420px;font-size:14px;line-height:1.45}

/* ящик */
.cr{display:flex;flex-direction:column;gap:12px;min-height:100%}
.strip{position:relative;height:118px;background:#11161a;border:1px solid var(--line);overflow:hidden;flex:none}
.strip::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--blue);box-shadow:0 0 10px var(--blue);z-index:2}
.track{display:flex;gap:8px;padding:8px 0;position:absolute;left:0;top:0;will-change:transform}
.tile{width:88px;height:102px;flex:none;background:#262f36;display:flex;flex-direction:column;justify-content:flex-end}
.tile .q{flex:1;display:grid;place-items:center;font-size:40px}
.tile i{display:block;height:12px;background:var(--rc,#8b97a2)}
.crbuy{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.crnote{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.poss{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.poss .tile{width:auto}

/* статистика */
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sc{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.sc span{font-size:12px;color:var(--mute);display:block}
.sc b{display:flex;align-items:center;gap:6px;font:400 24px var(--head);margin-top:3px}
.sc b small{font:600 12px var(--body);color:var(--mute)}
.wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.wl{padding:6px 12px 10px}
.wl .r{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.wl .r i{font:400 13px var(--head);font-style:normal;color:var(--dim)}
.wl .bar{height:6px;background:#0c0f12;margin-top:4px}
.wl .bar u{display:block;height:100%;background:var(--gold);text-decoration:none}
.gico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--goldtext);font:400 13px var(--head);font-style:normal}
.fav{padding:12px;font-size:14px;color:var(--mute)}
.fav b{display:block;font:400 22px var(--head);color:var(--text);margin-top:2px}

/* друзья (полный) */
.addf{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.addf input{flex:1;min-width:180px;height:44px;padding:0 12px;background:#0f1316;border:1px solid var(--line2)}
.flist.full{overflow:visible}
.frow .acts{display:flex;gap:6px}
.frow .acts .btn{min-height:36px;padding:0 12px;font-size:13px}

/* награды */
.rw{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px}
.rw .res{text-align:center}
.rw .res h2{margin:0;font:400 38px var(--head)}
.rw .res.win h2{color:var(--gold)}.rw .res.lose h2{color:#ff9b94}
.rw .res p{margin:4px 0 0;color:var(--mute);font-size:14px}
.rw .xpw{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.rw .xpt{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:8px}
.rw .xpt .gain{margin-left:auto;color:var(--gold)}
.rw .xpb{height:12px;background:#0c0f12;border:1px solid var(--line)}
.rw .xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .75s ease}
.rw .lines{display:flex;flex-direction:column;gap:6px}
.rline{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:9px 12px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.rline.in{opacity:1;transform:none}
.rline .rt{flex:1;font-size:14px}.rline .rt small{display:block;color:var(--mute);font-size:12px}
.rline .rv{font:400 18px var(--head);display:flex;align-items:center;gap:6px}
.rline .ric{width:44px;height:44px;display:grid;place-items:center;background:#252e35;flex:none}
.rline .ric svg{width:40px;height:40px}
.rline.big{border-color:var(--gold2);background:linear-gradient(90deg,rgba(242,182,50,.14),var(--panel))}

/* всплывающие окна */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,9,.72);display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px)}
#modal.on{display:flex}
.mbox{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox>.mh{display:flex;align-items:center;padding:0 6px 0 16px;height:50px;font:400 18px var(--head);border-bottom:1px solid var(--line)}
.mbox>.mh .sp{flex:1}
.mbox>.mh button{width:44px;height:44px;font-size:20px;color:var(--mute)}
.mbox>.mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.45}
.mbox>.mf{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
.field input{height:44px;padding:0 12px;background:#0f1316;border:1px solid var(--line2);font-size:15px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.avgrid button{aspect-ratio:1;border:2px solid transparent;padding:0}
.avgrid button.sel{border-color:var(--gold)}
.avgrid canvas,.avgrid img{width:100%;height:100%;display:block;image-rendering:pixelated}
.mode{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line2);background:var(--panel2);text-align:left;width:100%}
.mode.sel{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,182,50,.14),var(--panel2))}
.mode .mi{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:28px;background:#11161a;color:var(--gold)}
.mode b{font:400 17px var(--head);display:block}.mode span{font-size:12.5px;color:var(--mute)}
.mode .ck{margin-left:auto;font-size:22px;color:var(--gold);opacity:0}.mode.sel .ck{opacity:1}
.revealq{display:grid;place-items:center;height:130px;background:radial-gradient(60% 80% at 50% 50%,color-mix(in srgb,var(--rc) 35%,transparent),transparent)}
.revealq .tile{width:104px;height:122px}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 18px);transform:translate(-50%,20px);z-index:80;max-width:86vw;padding:11px 18px;background:#20272d;border:1px solid var(--line2);border-left:3px solid var(--gold);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* вертикальная ориентация и узкие экраны */
@media (max-aspect-ratio:1/1){
  #s-main{grid-template-columns:1fr 1fr;grid-template-rows:auto 64px minmax(220px,1fr) minmax(0,1fr)}
  .play{position:static;transform:none;order:3;height:56px;flex:1 0 100%}
  .top{flex-wrap:wrap;height:auto}
  .pcard{max-width:none;flex:1}
  .side{grid-column:1/-1;flex-direction:row}
  .stage{grid-column:1/-1}
  .right{grid-column:1/-1;flex-direction:row}.right .card{flex:1}
}
@media (max-height:430px){
  .play{height:50px;font-size:22px}
  #s-main{grid-template-rows:56px minmax(0,1fr)}
  .pcard .av{width:40px;height:40px}.xpbar{margin-top:3px}
  .navbtn .ic{font-size:26px}
}
@media (max-width:760px) and (min-aspect-ratio:1/1){
  #s-main{grid-template-columns:64px minmax(0,1fr) 200px}
  .play{min-width:200px;padding:0 20px;font-size:20px}
  .pcard{max-width:30%}.xpbar{width:90px}.cur{padding-right:7px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></symbol>
  <symbol id="i-inv" viewBox="0 0 24 24"><path d="M2.5 7.5h13.2l1.6 2.2h4.2v3.3h-7.3l-1 5.5H8.6l1.1-5.5H2.5z"/></symbol>
  <symbol id="i-market" viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="6" ry="2.6"/><path d="M3 7v4c0 1.4 2.7 2.6 6 2.6M3 11v4c0 1.4 2.7 2.6 6 2.6"/><ellipse cx="16" cy="14.5" rx="5.5" ry="2.4"/><path d="M10.5 14.5v3.2c0 1.3 2.5 2.4 5.5 2.4s5.5-1.1 5.5-2.4v-3.2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.2c2.6.2 4.5 2.1 4.5 5.3"/></symbol>
  <symbol id="i-stat" viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12 15 19.5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 4.5 16.5 12 9 19.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>

<script>

const GAME_URL = 'index.html?play=1';        // страница с игрой (запускается сразу в бой)

/* ===== ПРАВИЛА (без DOM: проверяются тестами) ===== */
const CFG = {
  maxLevel: 100,
  xpNeed: L => 1500 + 500 * L,               // сколько опыта с уровня L на L+1: 2000, 2500, 3000… (ВРЕМЕННО)
  levelSilver: 50,                           // серебро за каждый новый уровень

  dropFirst: { pSilver: 70, silver: [50, 70], pBox: 29 },                      // 1 место: 70% серебро, 29% ящик, остальное (1%) — скин
  dropOther: { pSilver: 90, silver: [20, 50] },                                // 2–5 места: 90% серебро, 10% ящик
  knifeInSkinDrop: 0.01,                     // шанс ножа среди выпавших скинов (1/100 от 1% = 1 из 10 000 за матч)
  knifeInBox: 0.001,                         // шанс ножа при открытии ящика (ВРЕМЕННО)
  maxFriends: 12,
  startSilver: 300,
  boxes: {
    wood:    { name: 'Деревянный ящик', price: { silver: 100 }, premium: false },
    premium: { name: 'Премиум-кейс',   price: { gold: 100 },   premium: true }
  }
};
const RARITY = [
  { id: 'common',  name: 'Обычный',     color: '#8b97a2', w: 55 },
  { id: 'rare',    name: 'Редкий',      color: '#3f95d6', w: 25 },
  { id: 'special', name: 'Особый',      color: '#2f55b8', w: 12 },
  { id: 'epic',    name: 'Эпический',   color: '#7a1fb5', w: 5.5 },
  { id: 'legend',  name: 'Легендарный', color: '#b4207a', w: 2 },
  { id: 'secret',  name: 'Тайный',      color: '#c0262b', w: 0.5 }

const KNIFE_R = { id: 'knife', name: 'Нож', color: '#e8b83a' };
const WEAPONS = { rifle: 'AK-47', awp: 'AWP', usp: 'USP-S', glock: 'Glock', deagle: 'Desert Eagle', knife: 'Нож' };

const rndInt = (a, b, rng) => a + Math.floor(rng() * (b - a + 1));

function gainXp(p, gain) {                   // добавляет опыт, повышает уровни; возвращает награды за уровни

const $ = (s, el) => (el || document).querySelector(s);

const AV = [
  { skin: '#c68e5b', hair: '#1a1a1a', gear: 'helmet', gc: '#223e6e' }, { skin: '#e0ac80', hair: '#4a2f1b', gear: 'cap', gc: '#556b2f' },

    else { const r = rarityById(d.rarity); rows.push({ icon: '<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" fill="#262f36"/><rect x="4" y="30" width="32" height="6" fill="' + r.color + '"/><text x="20" y="26" text-anchor="middle" font-size="22" font-family="Russo One,Arial" fill="#777">?</text></svg>', t: d.knife ? 'Выпал нож «?»' : 'Выпал скин «?»', sub: r.name, big: true }); }
    R.ups.forEach(u => {
      rows.push({ icon: '<svg viewBox="0 0 40 40"><polygon points="20,3 36,11 36,29 20,37 4,29 4,11" fill="#f2b632"/><text x="20" y="25" text-anchor="middle" font-size="15" font-family="Russo One,Arial" fill="#1b1305">' + u.level + '</text></svg>', t: 'Новый уровень: ' + u.level, sub: u.box ? 'бонус: ящик + серебро' : (u.level % 5 === 0 ? 'бонус каждые 5 уровней' : ''), v: curTag('silver', '+' + u.silver), big: !!u.box });
      if (u.box) rows.push({ icon: boxSVG(u.box), t: 'Ящик за ' + u.level + ' уровень', sub: CFG.boxes[u.box].name + ' — лежит в инвентаре', big: true });
    });
    const nodes = rows.map(r => { const n = h('div', { class: 'rline' + (r.big ? ' big' : '') }, h('div', { class: 'ric', html: r.icon }), h('div', { class: 'rt' }, r.t, r.sub ? h('small', { text: r.sub }) : null), r.v ? h('div', { class: 'rv' }, r.v) : null); lines.append(n); return n; });
    // анимация: полоса опыта по уровням, затем награды по очереди
    const segs = []; let lv = R.startLevel, from = R.startXp / CFG.xpNeed(Math.min(lv, CFG.maxLevel - 1)) * 100;
    R.ups.forEach(u => { segs.push({ lv, from, to: 100, up: u.level }); lv = u.level; from = 0; });
    segs.push({ lv, from, to: R.endLevel >= CFG.maxLevel ? 100 : R.endXp / CFG.xpNeed(R.endLevel) * 100, up: 0 });
    const fast = reduced();
    bar.style.transition = 'none'; bar.style.width = (segs[0].from || 0) + '%';
    let t = 250;
    segs.forEach(sg => {
      setTimeout(() => { bar.style.transition = fast ? 'none' : 'width .75s ease'; bar.style.width = sg.to + '%'; }, fast ? 0 : t); t += fast ? 0 : 800;
      if (sg.up) { setTimeout(() => { lvlBadge.textContent = String(sg.up); bar.style.transition = 'none'; bar.style.width = '0%'; }, fast ? 0 : t); t += fast ? 0 : 150; }
    });
    nodes.forEach(n => { setTimeout(() => n.classList.add('in'), fast ? 0 : t); t += fast ? 0 : 380; });
  } };
}

/* =====================================================================
   3D-МОДЕЛЬ СПЕЦНАЗА (кубическая, как боты в игре)
   ===================================================================== */
let stage = null, raf = 0, stageOn = false;
function buildStage() {
  if (typeof THREE === 'undefined') { $('#c3d').style.display = 'none'; $('#fallback').style.display = 'flex'; return null; }
  const cv = $('#c3d'), wrap = $('#stageWrap');
  let r; try { r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }); } catch (e) { cv.style.display = 'none'; $('#fallback').style.display = 'flex'; return null; }
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); r.setClearColor(0x000000, 0);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
  scene.add(new THREE.HemisphereLight(0xc3d3ea, 0x2a2118, 0.95));
  const key = new THREE.DirectionalLight(0xffe2b0, 1.15); key.position.set(3, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x6c8cff, 0.55); rim.position.set(-3, 2, -2); scene.add(rim);
  const V = (x, y, z) => new THREE.Vector3(x, y, z), mat = c => new THREE.MeshLambertMaterial({ color: c });
  const body = new THREE.Group(); scene.add(body);
  const box = (w, hh, d, c, x, y, z, par) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), mat(c)); m.position.set(x, y, z); (par || body).add(m); return m; };
  const limb = (a, b, w, c) => { const d = new THREE.Vector3().subVectors(b, a), len = d.length(), m = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), mat(c)); m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); body.add(m); return m; };
  const JACKET = 0x1f3a68, VEST = 0x14233f, PANTS = 0x15233d, BOOT = 0x0c0c0e, SKIN = 0xc28a5a, GLOVE = 0x101114, HELM = 0x162a4d;
  // ноги и ботинки
  [-0.15, 0.15].forEach(x => { box(0.25, 0.72, 0.26, PANTS, x, 0.42, 0); box(0.27, 0.14, 0.4, BOOT, x, 0.07, 0.06); box(0.28, 0.05, 0.42, 0x1b1b1f, x, 0.01, 0.06); });
  box(0.6, 0.07, 0.32, 0x0e0e10, 0, 0.8, 0);                      // ремень
  box(0.18, 0.14, 0.1, 0x2a2f36, 0.2, 0.74, 0.17);               // подсумок
  // корпус: куртка + разгрузка
  box(0.58, 0.7, 0.3, JACKET, 0, 1.17, 0); box(0.5, 0.42, 0.36, VEST, 0, 1.24, 0); box(0.14, 0.12, 0.08, 0x2a3140, -0.12, 1.2, 0.2); box(0.14, 0.12, 0.08, 0x2a3140, 0.12, 1.2, 0.2);
  // голова, шлем, лицо
  box(0.34, 0.36, 0.34, SKIN, 0, 1.76, 0); box(0.07, 0.1, 0.07, SKIN, 0, 1.55, 0.02);
  box(0.4, 0.2, 0.4, HELM, 0, 1.97, 0); box(0.44, 0.05, 0.44, 0x0f1c36, 0, 1.87, 0); box(0.3, 0.07, 0.14, 0x0f1c36, 0, 1.9, 0.26); box(0.42, 0.18, 0.1, HELM, 0, 1.9, -0.22);
  box(0.06, 0.05, 0.02, 0x12161a, -0.08, 1.77, 0.175); box(0.06, 0.05, 0.02, 0x12161a, 0.08, 1.77, 0.175); box(0.1, 0.03, 0.02, 0x5a3322, 0, 1.66, 0.175);
  // руки, перчатки и автомат
  const SR = V(-0.4, 1.4, 0), SL = V(0.4, 1.4, 0), ER = V(-0.5, 1.07, 0.14), EL = V(0.46, 1.1, 0.3), HR = V(-0.11, 1.12, 0.46), HL = V(0.06, 1.15, 0.84);
  limb(SR, ER, 0.2, JACKET); limb(ER, HR, 0.18, JACKET); limb(SL, EL, 0.2, JACKET); limb(EL, HL, 0.18, JACKET);
  box(0.16, 0.16, 0.16, GLOVE, HR.x, HR.y, HR.z); box(0.16, 0.16, 0.16, GLOVE, HL.x, HL.y, HL.z);
  box(0.09, 0.13, 0.98, 0x1a1c20, -0.03, 1.15, 0.7); box(0.1, 0.1, 0.36, 0x7a4a22, -0.03, 1.14, 1.06); box(0.08, 0.17, 0.32, 0x6a4020, -0.03, 1.12, 0.14);
  box(0.04, 0.04, 0.42, 0x111214, -0.03, 1.16, 1.4); box(0.075, 0.24, 0.1, 0x16181b, -0.03, 0.98, 0.66).rotation.x = 0.28;
  // пол-подиум
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.95, 0.04, 28), new THREE.MeshLambertMaterial({ color: 0x20272d })); pad.position.y = -0.03; scene.add(pad);
  cam.position.set(0, 1.12, 6.4); cam.lookAt(0, 1.0, 0);
  const fit = () => { const b = wrap.getBoundingClientRect(); if (!b.width || !b.height) return; r.setSize(b.width, b.height, false); cam.aspect = b.width / b.height; cam.fov = cam.aspect < 0.7 ? 38 : 28; cam.updateProjectionMatrix(); };
  window.addEventListener('resize', fit); try { new ResizeObserver(fit).observe(wrap); } catch (e) {}
  fit();
  return { r, scene, cam, body, fit };
}
function startStage() {
  if (stageOn) return; stageOn = true;
  if (!stage) stage = buildStage();
  if (!stage) return;
  stage.fit();
  const t0 = performance.now();
  const frame = t => {
    if (!stageOn || document.hidden) { raf = 0; return; }
    const s = (t - t0) / 1000;
    stage.body.rotation.y = -0.55 + Math.sin(s * 0.6) * 0.32; stage.body.position.y = Math.sin(s * 1.7) * 0.012;
    stage.r.render(stage.scene, stage.cam);
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}
function stopStage() { stageOn = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#s-main').classList.contains('on')) { stageOn = false; startStage(); } });

}
