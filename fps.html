<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mobile FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .hp-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border: 2px solid #2196F3;
            border-radius: 5px;
            min-width: 120px;
        }

        .hp-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }

        .hp-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        .hp-value.low {
            color: #FFD700;
        }

        .hp-value.critical {
            color: #f44336;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .ammo-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border: 2px solid #f44336;
            border-radius: 5px;
            text-align: right;
            min-width: 140px;
        }

        .weapon-name {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }

        .ammo-count {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
        }

        .ammo-count.empty {
            color: #f44336;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
        }

        .crosshair::before {
            width: 2px;
            height: 8px;
            left: 50%;
            top: -12px;
            transform: translateX(-50%);
        }

        .crosshair::after {
            width: 8px;
            height: 2px;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .death-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 36px;
            font-weight: bold;
            color: #f44336;
            text-align: center;
        }

        .death-overlay.show {
            display: flex;
            flex-direction: column;
        }

        .death-message {
            margin-bottom: 20px;
        }

        .round-info {
            font-size: 18px;
            color: #aaa;
        }

        .team-select {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .team-modal {
            text-align: center;
        }

        .team-modal h1 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #fff;
        }

        .team-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .team-btn {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .team-btn.ct {
            border-color: #2196F3;
        }

        .team-btn.ct:active {
            background: #2196F3;
        }

        .team-btn.t {
            border-color: #f44336;
        }

        .team-btn.t:active {
            background: #f44336;
        }

        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #aaa;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            z-index: 1500;
        }

        .fps-counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 12px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="hud">
        <div class="crosshair"></div>

        <div class="hp-display">
            <div class="hp-label">HP</div>
            <div class="hp-value" id="hpValue">100</div>
        </div>

        <div class="ammo-display">
            <div class="weapon-name">DEAGLE</div>
            <div class="ammo-count" id="ammoValue">7/7</div>
        </div>

        <div class="fps-counter" id="fpsCounter">60 FPS</div>

        <div class="controls-info" id="controlsInfo">
            📱 Левый сторон - движение | Палец справа - камера | Красная кнопка - огонь
        </div>

        <div class="death-overlay" id="deathOverlay">
            <div class="death-message">💀 ВЫ УБИТЫ</div>
            <div class="round-info" id="roundInfo">Ждите следующего раунда...</div>
        </div>

        <div class="team-select" id="teamSelect">
            <div class="team-modal">
                <h1>Выберите команду</h1>
                <div class="team-buttons">
                    <button class="team-btn ct" id="selectCT">🛡️ CT</button>
                    <button class="team-btn t" id="selectT">🔴 TERRORIST</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const GAME_CONFIG = {
            playerHP: 100,
            deagleDamage: 50,
            deagleMagSize: 7,
            deagleReloadTime: 1000,
            deagleFireRate: 250,
            botCount: 3,
            botSightRange: 50,
            mapSize: 100
        };

        const TEAMS = {
            CT: 'ct',
            T: 't'
        };

        let gameState = {
            playerTeam: null,
            playerAlive: true,
            round: 1,
            isGameRunning: false
        };

        let player = null;
        let bots = [];
        let scene, camera, renderer;

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 150, 200);

            const canvas = document.getElementById('canvas');
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(50, 50, 50);
            light.castShadow = true;
            light.shadow.mapSize.width = 2048;
            light.shadow.mapSize.height = 2048;
            light.shadow.camera.far = 200;
            light.shadow.camera.left = -100;
            light.shadow.camera.right = 100;
            light.shadow.camera.top = 100;
            light.shadow.camera.bottom = -100;
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const groundGeometry = new THREE.PlaneGeometry(GAME_CONFIG.mapSize, GAME_CONFIG.mapSize);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createWalls();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createWalls() {
            const wallData = [
                { x: 0, y: 2, z: -GAME_CONFIG.mapSize/2, w: GAME_CONFIG.mapSize, h: 4, d: 2 },
                { x: 0, y: 2, z: GAME_CONFIG.mapSize/2, w: GAME_CONFIG.mapSize, h: 4, d: 2 },
                { x: -GAME_CONFIG.mapSize/2, y: 2, z: 0, w: 2, h: 4, d: GAME_CONFIG.mapSize },
                { x: GAME_CONFIG.mapSize/2, y: 2, z: 0, w: 2, h: 4, d: GAME_CONFIG.mapSize },
                { x: -20, y: 2, z: -15, w: 20, h: 4, d: 2 },
                { x: 20, y: 2, z: 0, w: 2, h: 4, d: 30 },
                { x: 0, y: 2, z: 20, w: 30, h: 4, d: 2 },
            ];

            for (let wall of wallData) {
                const geometry = new THREE.BoxGeometry(wall.w, wall.h, wall.d);
                const material = new THREE.MeshLambertMaterial({ color: 0x888888 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(wall.x, wall.y, wall.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            }
        }

        class Player {
            constructor(team) {
                this.team = team;
                this.position = new THREE.Vector3(team === TEAMS.CT ? -30 : 30, 1.6, team === TEAMS.CT ? -30 : 30);
                this.velocity = new THREE.Vector3();
                this.direction = new THREE.Vector3();

                this.hp = GAME_CONFIG.playerHP;
                this.maxHP = GAME_CONFIG.playerHP;
                this.isDead = false;

                this.weapon = {
                    ammo: GAME_CONFIG.deagleMagSize,
                    maxAmmo: GAME_CONFIG.deagleMagSize,
                    isReloading: false,
                    reloadStart: 0,
                    lastShot: 0
                };

                this.speed = 0.2;
                this.angularVelocity = { x: 0, y: 0 };
                this.eulerAngles = { x: 0, y: 0 };

                this.weaponModel = this.createWeaponModel();
            }

            createWeaponModel() {
                const group = new THREE.Group();

                const slideGeom = new THREE.BoxGeometry(0.3, 0.4, 1.2);
                const slideMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7 });
                const slide = new THREE.Mesh(slideGeom, slideMat);
                slide.position.set(0.3, 0, 0.3);
                group.add(slide);

                const gripGeom = new THREE.BoxGeometry(0.25, 0.6, 0.4);
                const gripMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                const grip = new THREE.Mesh(gripGeom, gripMat);
                grip.position.set(0.25, -0.2, -0.2);
                group.add(grip);

                const barrelGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8);
                const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
                const barrel = new THREE.Mesh(barrelGeom, barrelMat);
                barrel.rotation.z = Math.PI / 2;
                barrel.position.set(0.35, 0.15, 0.6);
                group.add(barrel);

                const hammerGeom = new THREE.BoxGeometry(0.08, 0.15, 0.1);
                const hammer = new THREE.Mesh(hammerGeom, slideMat);
                hammer.position.set(0.15, 0.05, 0.1);
                group.add(hammer);

                group.position.set(0.4, -0.3, -0.6);
                group.scale.set(1.5, 1.5, 1.5);

                return group;
            }

            update(input) {
                if (this.isDead) return;

                this.velocity.x = input.moveX * this.speed;
                this.velocity.z = input.moveY * this.speed;

                this.eulerAngles.y -= input.lookX * 0.005;
                this.eulerAngles.x -= input.lookY * 0.005;
                this.eulerAngles.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, this.eulerAngles.x));

                const moveDir = new THREE.Vector3(this.velocity.x, 0, this.velocity.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.eulerAngles.y);
                
                this.position.add(moveDir);

                this.position.x = Math.max(-GAME_CONFIG.mapSize/2 + 2, Math.min(GAME_CONFIG.mapSize/2 - 2, this.position.x));
                this.position.z = Math.max(-GAME_CONFIG.mapSize/2 + 2, Math.min(GAME_CONFIG.mapSize/2 - 2, this.position.z));

                if (this.weapon.isReloading) {
                    const elapsed = Date.now() - this.weapon.reloadStart;
                    if (elapsed >= GAME_CONFIG.deagleReloadTime) {
                        this.weapon.ammo = this.weapon.maxAmmo;
                        this.weapon.isReloading = false;
                    }
                }
            }

            shoot() {
                if (this.isDead || this.weapon.isReloading || this.weapon.ammo <= 0) {
                    return false;
                }

                const now = Date.now();
                if (now - this.weapon.lastShot < GAME_CONFIG.deagleFireRate) {
                    return false;
                }

                this.weapon.lastShot = now;
                this.weapon.ammo--;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                let hit = null;
                for (let bot of bots) {
                    if (!bot.isDead && bot.boundingBox) {
                        const intersection = raycaster.ray.intersectBox(bot.boundingBox);
                        if (intersection) {
                            hit = bot;
                            break;
                        }
                    }
                }

                if (hit) {
                    hit.takeDamage(GAME_CONFIG.deagleDamage);
                }

                return true;
            }

            reload() {
                if (this.weapon.ammo === this.weapon.maxAmmo || this.weapon.isReloading) return;
                this.weapon.isReloading = true;
                this.weapon.reloadStart = Date.now();
            }

            takeDamage(damage) {
                this.hp -= damage;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.isDead = true;
                }
            }
        }

        class Bot {
            constructor(team, id) {
                this.team = team;
                this.id = id;
                this.position = new THREE.Vector3(team === TEAMS.CT ? -30 : 30, 0.8, team === TEAMS.CT ? -30 + id * 8 : 30 + id * 8);
                this.hp = GAME_CONFIG.playerHP;
                this.maxHP = GAME_CONFIG.playerHP;
                this.isDead = false;

                this.model = this.createModel();
                scene.add(this.model);

                this.weapon = {
                    ammo: GAME_CONFIG.deagleMagSize,
                    isReloading: false,
                    reloadStart: 0,
                    lastShot: 0
                };

                this.targetPosition = this.position.clone();
                this.targetChangeTime = 0;
                this.speed = 0.08;
                this.angle = team === TEAMS.CT ? 0 : Math.PI;

                this.boundingBox = new THREE.Box3();
                this.updateBoundingBox();
            }

            createModel() {
                const group = new THREE.Group();
                group.position.copy(this.position);

                const color = this.team === TEAMS.CT ? 0x2196F3 : 0xf44336;

                const bodyGeom = new THREE.BoxGeometry(0.4, 1, 0.3);
                const material = new THREE.MeshLambertMaterial({ color });
                const body = new THREE.Mesh(bodyGeom, material);
                body.position.y = 0.5;
                body.castShadow = true;
                group.add(body);

                const headGeom = new THREE.SphereGeometry(0.2, 8, 8);
                const head = new THREE.Mesh(headGeom, material);
                head.position.y = 1.3;
                head.castShadow = true;
                group.add(head);

                const armGeom = new THREE.BoxGeometry(0.15, 0.8, 0.15);
                const armL = new THREE.Mesh(armGeom, material);
                armL.position.set(-0.3, 0.6, 0);
                armL.castShadow = true;
                group.add(armL);

                const armR = new THREE.Mesh(armGeom, material);
                armR.position.set(0.3, 0.6, 0);
                armR.castShadow = true;
                group.add(armR);

                const legGeom = new THREE.BoxGeometry(0.15, 0.7, 0.15);
                const legL = new THREE.Mesh(legGeom, material);
                legL.position.set(-0.15, 0.25, 0);
                legL.castShadow = true;
                group.add(legL);

                const legR = new THREE.Mesh(legGeom, material);
                legR.position.set(0.15, 0.25, 0);
                legR.castShadow = true;
                group.add(legR);

                return group;
            }

            updateBoundingBox() {
                this.boundingBox.setFromObject(this.model);
            }

            update() {
                if (this.isDead) {
                    this.model.visible = false;
                    return;
                }

                const distToPlayer = this.position.distanceTo(player.position);
                
                if (distToPlayer < GAME_CONFIG.botSightRange && !player.isDead) {
                    this.targetPosition = player.position.clone();
                    this.targetPosition.y = 1.6;
                } else {
                    if (Date.now() - this.targetChangeTime > 3000) {
                        this.targetPosition = new THREE.Vector3(
                            (Math.random() - 0.5) * GAME_CONFIG.mapSize,
                            1.6,
                            (Math.random() - 0.5) * GAME_CONFIG.mapSize
                        );
                        this.targetChangeTime = Date.now();
                    }
                }

                const direction = new THREE.Vector3().subVectors(this.targetPosition, this.position);
                const distance = direction.length();

                if (distance > 0.5) {
                    direction.normalize();
                    this.position.addScaledVector(direction, this.speed);
                    this.angle = Math.atan2(direction.x, direction.z);
                }

                this.position.x = Math.max(-GAME_CONFIG.mapSize/2 + 1, Math.min(GAME_CONFIG.mapSize/2 - 1, this.position.x));
                this.position.z = Math.max(-GAME_CONFIG.mapSize/2 + 1, Math.min(GAME_CONFIG.mapSize/2 - 1, this.position.z));

                this.model.position.copy(this.position);
                this.model.rotation.y = this.angle;

                this.updateBoundingBox();

                if (distToPlayer < GAME_CONFIG.botSightRange && !player.isDead) {
                    this.shoot();
                }

                if (this.weapon.isReloading) {
                    const elapsed = Date.now() - this.weapon.reloadStart;
                    if (elapsed >= GAME_CONFIG.deagleReloadTime) {
                        this.weapon.ammo = GAME_CONFIG.deagleMagSize;
                        this.weapon.isReloading = false;
                    }
                }
            }

            shoot() {
                if (this.weapon.isReloading || this.weapon.ammo <= 0) return;

                const now = Date.now();
                const fireRate = GAME_CONFIG.deagleFireRate + Math.random() * 300;
                
                if (now - this.weapon.lastShot < fireRate) return;

                this.weapon.lastShot = now;
                this.weapon.ammo--;

                const direction = new THREE.Vector3().subVectors(player.position, this.position);
                direction.normalize();

                direction.x += (Math.random() - 0.5) * 0.3;
                direction.z += (Math.random() - 0.5) * 0.3;
                direction.normalize();

                const raycaster = new THREE.Raycaster(this.position, direction);
                const distance = raycaster.ray.distanceToPoint(player.position);

                if (distance < 0.5) {
                    player.takeDamage(GAME_CONFIG.deagleDamage);
                }

                if (this.weapon.ammo <= 0) {
                    this.weapon.isReloading = true;
                    this.weapon.reloadStart = Date.now();
                }
            }

            takeDamage(damage) {
                this.hp -= damage;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.isDead = true;
                }
            }
        }

        let input = {
            moveX: 0,
            moveY: 0,
            lookX: 0,
            lookY: 0
        };

        let touchState = {
            leftStick: null,
            rightStick: null,
            leftTouchId: null,
            rightTouchId: null
        };

        document.addEventListener('touchstart', (e) => {
            for (let touch of e.touches) {
                const x = touch.clientX;
                const y = touch.clientY;

                if (x < window.innerWidth / 2) {
                    touchState.leftStick = { x, y, startX: x, startY: y };
                    touchState.leftTouchId = touch.identifier;
                } else {
                    touchState.rightStick = { x, y };
                    touchState.rightTouchId = touch.identifier;
                }
            }
        });

        document.addEventListener('touchmove', (e) => {
            for (let touch of e.touches) {
                if (touch.identifier === touchState.leftTouchId && touchState.leftStick) {
                    const dx = touch.clientX - touchState.leftStick.startX;
                    const dy = touch.clientY - touchState.leftStick.startY;
                    const length = Math.hypot(dx, dy);
                    const maxDistance = 60;

                    if (length > 0) {
                        const angle = Math.atan2(dy, dx);
                        input.moveX = Math.cos(angle) * Math.min(length, maxDistance) / maxDistance;
                        input.moveY = Math.sin(angle) * Math.min(length, maxDistance) / maxDistance;
                    }
                } else if (touch.identifier === touchState.rightTouchId && touchState.rightStick) {
                    const dx = touch.clientX - touchState.rightStick.x;
                    const dy = touch.clientY - touchState.rightStick.y;

                    touchState.rightStick.x = touch.clientX;
                    touchState.rightStick.y = touch.clientY;

                    input.lookX = dx;
                    input.lookY = dy;
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchState.leftTouchId) {
                    touchState.leftStick = null;
                    touchState.leftTouchId = null;
                    input.moveX = 0;
                    input.moveY = 0;
                } else if (touch.identifier === touchState.rightTouchId) {
                    touchState.rightStick = null;
                    touchState.rightTouchId = null;
                }
            }
        });

        function updateHUD() {
            if (!player) return;

            const hpValue = document.getElementById('hpValue');
            hpValue.textContent = Math.ceil(player.hp);
            hpValue.className = 'hp-value';
            if (player.hp <= 25) {
                hpValue.classList.add('critical');
            } else if (player.hp <= 50) {
                hpValue.classList.add('low');
            }

            const ammoValue = document.getElementById('ammoValue');
            ammoValue.textContent = `${player.weapon.ammo}/${player.weapon.maxAmmo}`;
            if (player.weapon.ammo === 0) {
                ammoValue.classList.add('empty');
            } else {
                ammoValue.classList.remove('empty');
            }

            if (player.isDead && gameState.playerAlive) {
                gameState.playerAlive = false;
                document.getElementById('deathOverlay').classList.add('show');
                document.getElementById('controlsInfo').style.display = 'none';
            }

            if (window.performance && window.performance.now) {
                const fps = Math.round(1000 / (Date.now() - lastFrameTime));
                document.getElementById('fpsCounter').textContent = fps + ' FPS';
                lastFrameTime = Date.now();
            }
        }

        let lastFrameTime = Date.now();

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (!gameState.isGameRunning) return;

            player.update(input);

            for (let bot of bots) {
                bot.update();
            }

            camera.position.copy(player.position);
            camera.position.y = 1.6;
            
            const forward = new THREE.Vector3();
            forward.setFromEulerOrder(player.eulerAngles.x, player.eulerAngles.y, 0, 'YXZ');
            
            camera.lookAt(
                camera.position.x + forward.x,
                camera.position.y + forward.y,
                camera.position.z + forward.z
            );
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.eulerAngles.y;
            camera.rotation.x = player.eulerAngles.x;

            if (player.weaponModel.parent !== camera) {
                if (player.weaponModel.parent) {
                    player.weaponModel.parent.remove(player.weaponModel);
                }
                camera.add(player.weaponModel);
            }

            const aliveBots = bots.filter(b => !b.isDead);
            if (aliveBots.length === 0 && gameState.isGameRunning) {
                gameState.isGameRunning = false;
                setTimeout(() => {
                    gameState.round++;
                    startNewGame();
                }, 2000);
            }

            updateHUD();
            renderer.render(scene, camera);
        }

        function startNewGame() {
            for (let bot of bots) {
                scene.remove(bot.model);
            }
            bots = [];

            player = new Player(gameState.playerTeam);
            gameState.playerAlive = true;
            document.getElementById('deathOverlay').classList.remove('show');
            document.getElementById('controlsInfo').style.display = 'block';

            const botTeam = gameState.playerTeam === TEAMS.CT ? TEAMS.T : TEAMS.CT;
            for (let i = 0; i < GAME_CONFIG.botCount; i++) {
                bots.push(new Bot(botTeam, i));
            }

            gameState.isGameRunning = true;
        }

        document.getElementById('selectCT').addEventListener('click', () => {
            gameState.playerTeam = TEAMS.CT;
            document.getElementById('teamSelect').style.display = 'none';
            startNewGame();
        });

        document.getElementById('selectT').addEventListener('click', () => {
            gameState.playerTeam = TEAMS.T;
            document.getElementById('teamSelect').style.display = 'none';
            startNewGame();
        });

        document.addEventListener('click', () => {
            if (gameState.isGameRunning && player) {
                player.shoot();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && player) {
                player.reload();
            }
        });

        const fireBtn = document.createElement('div');
        fireBtn.style.cssText = `
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(244, 67, 54, 0.8);
            border: 3px solid rgba(244, 67, 54, 1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            z-index: 500;
        `;
        fireBtn.textContent = '🔫';
        document.body.appendChild(fireBtn);

        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState.isGameRunning && player) {
                player.shoot();
            }
        });

        const reloadBtn = document.createElement('div');
        reloadBtn.style.cssText = `
            position: absolute;
            bottom: 130px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: rgba(76, 175, 80, 0.8);
            border: 3px solid rgba(76, 175, 80, 1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            z-index: 500;
        `;
        reloadBtn.textContent = '↻';
        document.body.appendChild(reloadBtn);

        reloadBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player) {
                player.reload();
            }
        });

        initThreeJS();
        gameLoop();
    </script>
</body>
</html>
